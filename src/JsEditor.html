<script>
(function () {
  var TIPE_LABEL = { pg: 'Pilihan ganda', pgk: 'Pilihan ganda kompleks', isian: 'Isian singkat' };
  var INSTRUKSI = {
    pg: 'Pilih satu jawaban benar!',
    pgk: 'Pilih satu atau lebih jawaban benar!',
    isian: 'Ketik jawaban Anda pada kolom di bawah.'
  };
  var HURUF = 'ABCDEFGH';
  var SNIPPET = [
    ['a/b', '\\frac{a}{b}'], ['akar', '\\sqrt{x}'], ['x^n', 'x^{n}'], ['x_n', 'x_{n}'],
    ['×', '\\times '], ['÷', '\\div '], ['±', '\\pm '], ['≤', '\\leq '], ['≥', '\\geq '],
    ['≠', '\\neq '], ['≈', '\\approx '], ['π', '\\pi '], ['Δ', '\\Delta '], ['°', '^{\\circ}'],
    ['reaksi', '\\ce{A + B -> C}'], ['\\ce{}', '\\ce{}'], ['satuan', '\\,\\text{m/s}']
  ];
  var MAKS_SISI = 1000, MAKS_BYTE = 3 * 1024 * 1024;

  // ---------- editor teks kaya ----------

  /** execCommand menulis perataan sebagai style atau atribut align; ubah ke kelas yang lolos sanitasi. */
  function normRata(html) {
    // DOMParser menghasilkan dokumen inert: skrip dan gambar di dalamnya tidak dijalankan atau dimuat.
    var wadah = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html').body;
    var peta = { left: 'rata-kiri', start: 'rata-kiri', center: 'rata-tengah', right: 'rata-kanan', end: 'rata-kanan', justify: 'rata-penuh' };
    wadah.querySelectorAll('[style], [align]').forEach(function (e) {
      var nilai = (e.style && e.style.textAlign) || e.getAttribute('align') || '';
      var kelas = peta[String(nilai).toLowerCase()];
      e.removeAttribute('style'); e.removeAttribute('align');
      if (kelas) e.className = kelas;
    });
    return wadah.innerHTML;
  }

  function editorTeks(awal, mini) {
    var area = el('div', { class: 'editor-area' + (mini ? ' editor-mini' : ''), contenteditable: 'true', role: 'textbox', 'aria-multiline': 'true' });
    area.innerHTML = window.clean(awal || '');
    var rentang = null;

    function simpanRentang() {
      var s = window.getSelection();
      if (s && s.rangeCount && area.contains(s.anchorNode)) rentang = s.getRangeAt(0).cloneRange();
    }
    ['keyup', 'mouseup', 'focusout', 'touchend'].forEach(function (n) { area.addEventListener(n, simpanRentang); });

    function masukkan(teks) {
      area.focus();
      var s = window.getSelection();
      if (rentang) { s.removeAllRanges(); s.addRange(rentang); }
      else { var r = document.createRange(); r.selectNodeContents(area); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
      document.execCommand('insertText', false, teks);
      simpanRentang();
    }

    // Selalu tempel sebagai teks polos; Unicode (termasuk Arab berharakat) dipertahankan.
    area.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text/plain');
      // Tabel yang disalin dari Word atau Excel tiba sebagai teks bertab: dijadikan tabel (baris pertama sebagai judul).
      if (!mini && /\t/.test(t) && /\n/.test(t.replace(/\s+$/, ''))) {
        var br = t.replace(/\r/g, '').replace(/\n+$/, '').split('\n').slice(0, 40).map(function (r) { return r.split('\t').slice(0, 8); });
        var kol = Math.max.apply(null, br.map(function (r) { return r.length; }));
        var esc = function (x) { return window.normArab(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
        var h = '<table>' + br.map(function (r, i) {
          var tag = i === 0 ? 'th' : 'td', c = '';
          for (var k = 0; k < kol; k++) c += '<' + tag + '>' + (esc(r[k] == null ? '' : r[k].trim()) || '<br>') + '</' + tag + '>';
          return (i === 0 ? '<thead>' : (i === 1 ? '<tbody>' : '')) + '<tr>' + c + '</tr>' + (i === 0 ? '</thead>' : '');
        }).join('') + (br.length > 1 ? '</tbody>' : '') + '</table><br>';
        document.execCommand('insertHTML', false, h);
        return;
      }
      document.execCommand('insertText', false, window.normArab(t));
    });
    area.addEventListener('drop', function (e) {
      e.preventDefault();
      var t = e.dataTransfer && e.dataTransfer.getData('text/plain');
      if (t) document.execCommand('insertText', false, window.normArab(t));
    });

    var panel = null, panelTbl = null;
    function tombolTb(label, judul, aksi) {
      return el('button', {
        type: 'button', class: 'btn-tb', title: judul, 'aria-label': judul,
        onmousedown: function (e) { e.preventDefault(); },
        onclick: aksi
      }, label);
    }
    function perintah(c) { return function () { area.focus(); document.execCommand(c); simpanRentang(); segarkanRata(); }; }
    var tombolRata = {};
    function rata(kunci, label, judul, perintahRata) {
      var b = tombolTb(label, judul, function () {
        area.focus();
        document.execCommand('styleWithCSS', false, true);
        document.execCommand(perintahRata);
        simpanRentang(); segarkanRata();
      });
      tombolRata[perintahRata] = b;
      return b;
    }
    function segarkanRata() {
      Object.keys(tombolRata).forEach(function (c) {
        var aktif = false;
        try { aktif = document.queryCommandState(c); } catch (e) { aktif = false; }
        tombolRata[c].classList.toggle('aktif', aktif);
        tombolRata[c].setAttribute('aria-pressed', aktif ? 'true' : 'false');
      });
    }
    ['keyup', 'mouseup', 'touchend'].forEach(function (n) { area.addEventListener(n, segarkanRata); });

    // Gaya nomor daftar: kelas nomor-* pada elemen ol (angka biasa = tanpa kelas).
    var GAYA_NOMOR = [['', '1.  2.  3.'], ['nomor-kurung', '1)  2)  3)'], ['nomor-a', 'a.  b.  c.'], ['nomor-a-kurung', 'a)  b)  c)'], ['nomor-A', 'A.  B.  C.'], ['nomor-i', 'i.  ii.  iii.'], ['nomor-I', 'I.  II.  III.']];
    var gayaNomor = window.dropdown({
      aria: 'Gaya nomor daftar', nilai: '', awalan: 'Nomor: ',
      pilihan: GAYA_NOMOR.map(function (g) { return { nilai: g[0] || 'angka', label: g[1] }; })
    });
    gayaNomor.value = 'angka';
    function olAktif() {
      var s = window.getSelection();
      if (!s || !s.rangeCount || !area.contains(s.anchorNode)) return null;
      var n = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentNode;
      return n && n.closest ? n.closest('ol') : null;
    }
    gayaNomor.addEventListener('change', function () {
      area.focus();
      var s = window.getSelection();
      if (rentang) { s.removeAllRanges(); s.addRange(rentang); }
      var ol = olAktif();
      if (!ol) { document.execCommand('insertOrderedList'); ol = olAktif(); }
      if (!ol) return;
      var kls = gayaNomor.value === 'angka' ? '' : gayaNomor.value;
      ol.className = kls;
      if (!kls) ol.removeAttribute('class');
      simpanRentang();
      area.dispatchEvent(new Event('input', { bubbles: true }));
    });
    function segarkanNomor() {
      var ol = olAktif();
      gayaNomor.value = ol && ol.className && GAYA_NOMOR.some(function (g) { return g[0] === ol.className; }) ? ol.className : 'angka';
    }
    ['keyup', 'mouseup', 'touchend'].forEach(function (n) { area.addEventListener(n, segarkanNomor); });

    var pisah = function () { return el('span', { class: 'tb-pisah', 'aria-hidden': 'true' }); };
    var tb = el('div', { class: 'editor-tb', role: 'toolbar', 'aria-label': 'Format teks' },
      tombolTb(el('span', { class: 'tb-b' }, 'B'), 'Tebal', perintah('bold')),
      tombolTb(el('span', { class: 'tb-i' }, 'I'), 'Miring', perintah('italic')),
      tombolTb(el('span', { class: 'tb-u' }, 'U'), 'Garis bawah', perintah('underline')),
      tombolTb(el('span', null, 'x', el('sub', null, '2')), 'Subskrip', perintah('subscript')),
      tombolTb(el('span', null, 'x', el('sup', null, '2')), 'Superskrip', perintah('superscript')));
    if (!mini) {
      tb.appendChild(pisah());
      tb.appendChild(rata('kiri', window.ikon('rataKiri', 16), 'Rata kiri', 'justifyLeft'));
      tb.appendChild(rata('tengah', window.ikon('rataTengah', 16), 'Rata tengah', 'justifyCenter'));
      tb.appendChild(rata('kanan', window.ikon('rataKanan', 16), 'Rata kanan', 'justifyRight'));
      tb.appendChild(rata('penuh', window.ikon('rataPenuh', 16), 'Rata kiri dan kanan (justify)', 'justifyFull'));
      tb.appendChild(pisah());
      tb.appendChild(tombolTb(window.ikon('daftar', 16), 'Daftar berpoin', perintah('insertUnorderedList')));
      tb.appendChild(tombolTb(window.ikon('daftarNomor', 16), 'Daftar bernomor', perintah('insertOrderedList')));
      tb.appendChild(gayaNomor);
      tb.appendChild(pisah());
      tb.appendChild(tombolTb(window.ikon('hapusFormat', 16), 'Hapus format', perintah('removeFormat')));
    }
    if (!mini) {
      tb.appendChild(pisah());
      tb.appendChild(tombolTb(window.ikon('tabel', 16), 'Sisipkan tabel', function () {
        if (!panelTbl) { panelTbl = panelTabel(sisipTabel); wrap.insertBefore(panelTbl, area); }
        else panelTbl.hidden = !panelTbl.hidden;
        if (!panelTbl.hidden) panelTbl.querySelector('input').focus();
      }));
    }
    tb.appendChild(pisah());
    tb.appendChild(tombolTb(el('span', { class: 'tb-sigma' }, '\u2211'), 'Sisipkan rumus', function () {
      if (!panel) { panel = panelRumus(masukkan); wrap.insertBefore(panel, area); }
      else panel.hidden = !panel.hidden;
      if (!panel.hidden) panel.querySelector('textarea').focus();
    }));

    // ---- tabel ----
    function sisipTabel(baris, kolom, judul) {
      var sel = function (tag) { return '<' + tag + '><br></' + tag + '>'; };
      var h = '<table>';
      if (judul) h += '<thead><tr>' + new Array(kolom + 1).join(sel('th')) + '</tr></thead>';
      h += '<tbody>' + new Array(baris - (judul ? 1 : 0) + 1).join('<tr>' + new Array(kolom + 1).join(sel('td')) + '</tr>') + '</tbody></table><br>';
      area.focus();
      var s = window.getSelection();
      if (rentang) { s.removeAllRanges(); s.addRange(rentang); }
      document.execCommand('insertHTML', false, h);
      simpanRentang(); segarkanTabel();
      var pertama = area.querySelector('table th, table td'); if (pertama && !window.layarSentuh()) { var rg = document.createRange(); rg.selectNodeContents(pertama); rg.collapse(true); s.removeAllRanges(); s.addRange(rg); }
    }
    function selAktif() {
      var s = window.getSelection();
      if (!s || !s.rangeCount || !area.contains(s.anchorNode)) return null;
      var n = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentNode;
      return n && n.closest ? n.closest('td, th') : null;
    }
    function barisTabel(t) { return Array.prototype.slice.call(t.rows); }
    function fokusSel(c) { if (!c) return; var rg = document.createRange(); rg.selectNodeContents(c); rg.collapse(true); var s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); simpanRentang(); }
    function selBaru(tag) { var c = document.createElement(tag); c.appendChild(document.createElement('br')); return c; }
    var aksiTabel = {
      barisBaru: function (c) {
        var tr = c.parentNode, t = tr.closest('table'), baru = document.createElement('tr');
        for (var i = 0; i < tr.cells.length; i++) baru.appendChild(selBaru('td'));
        var bagian = tr.parentNode;
        if (bagian.tagName === 'THEAD') { var tb2 = t.tBodies[0] || t.appendChild(document.createElement('tbody')); tb2.insertBefore(baru, tb2.firstChild); }
        else bagian.insertBefore(baru, tr.nextSibling);
        fokusSel(baru.cells[0]);
      },
      kolomBaru: function (c) {
        var t = c.closest('table'), idx = c.cellIndex;
        barisTabel(t).forEach(function (tr) {
          var rujuk = tr.cells[idx], sel = selBaru(rujuk && rujuk.tagName === 'TH' ? 'th' : 'td');
          if (rujuk) tr.insertBefore(sel, rujuk.nextSibling); else tr.appendChild(sel);
        });
        fokusSel(c.nextSibling);
      },
      hapusBaris: function (c) {
        var tr = c.parentNode, t = tr.closest('table');
        if (barisTabel(t).length <= 1) { t.remove(); return; }
        var lain = tr.nextElementSibling || tr.previousElementSibling || (tr.parentNode.nextElementSibling && tr.parentNode.nextElementSibling.firstElementChild);
        tr.remove();
        if (t.tHead && !t.tHead.rows.length) t.tHead.remove();
        fokusSel(lain && lain.cells && lain.cells[Math.min(c.cellIndex, lain.cells.length - 1)]);
      },
      hapusKolom: function (c) {
        var t = c.closest('table'), idx = c.cellIndex;
        if (barisTabel(t)[0].cells.length <= 1) { t.remove(); return; }
        barisTabel(t).forEach(function (tr) { if (tr.cells[idx]) tr.cells[idx].remove(); });
        fokusSel(barisTabel(t)[0].cells[Math.max(0, idx - 1)]);
      },
      hapusTabel: function (c) { c.closest('table').remove(); }
    };
    function alatTabel(label, judul, kunci) {
      return el('button', { type: 'button', class: 'btn-kecil', title: judul, 'aria-label': judul, onmousedown: function (e) { e.preventDefault(); }, onclick: function () {
        var c = selAktif(); if (!c) return;
        aksiTabel[kunci](c); simpanRentang(); segarkanTabel();
      } }, label);
    }
    var barTabel = el('div', { class: 'editor-tb tb-tabel', role: 'toolbar', 'aria-label': 'Ubah tabel', hidden: true },
      el('span', { class: 'tb-tabel-label' }, window.ikon('tabel', 14), 'Tabel'),
      alatTabel('Tambah baris', 'Tambah baris di bawah baris ini', 'barisBaru'),
      alatTabel('Tambah kolom', 'Tambah kolom di kanan kolom ini', 'kolomBaru'),
      alatTabel('Hapus baris', 'Hapus baris ini', 'hapusBaris'),
      alatTabel('Hapus kolom', 'Hapus kolom ini', 'hapusKolom'),
      alatTabel('Hapus tabel', 'Hapus seluruh tabel', 'hapusTabel'));
    // Posisi tabel di dalam kartu soal: kelas rata-* pada elemen table.
    var tombolPosisi = {};
    var grupPosisi = el('div', { class: 'adm-seg adm-seg-kecil adm-seg-ikon', role: 'group', 'aria-label': 'Posisi tabel' },
      [['rata-kiri', 'rataKiri', 'Tabel rata kiri'], ['rata-tengah', 'rataTengah', 'Tabel di tengah'], ['rata-kanan', 'rataKanan', 'Tabel rata kanan'], ['rata-penuh', 'rataPenuh', 'Tabel selebar kartu (rata kiri dan kanan)']].map(function (r) {
        var t = el('button', { type: 'button', title: r[2], 'aria-label': r[2], 'aria-pressed': 'false', onmousedown: function (e) { e.preventDefault(); }, onclick: function () {
          var c = selAktif(); if (!c) return;
          var tabel = c.closest('table');
          tabel.className = r[0] === 'rata-kiri' ? '' : r[0];
          if (!tabel.className) tabel.removeAttribute('class');
          area.dispatchEvent(new Event('input', { bubbles: true }));
          segarkanTabel();
        } }, window.ikon(r[1], 15));
        tombolPosisi[r[0]] = t; return t;
      }));
    barTabel.appendChild(grupPosisi);
    function segarkanTabel() {
      var c = selAktif();
      barTabel.hidden = !c;
      if (!c) return;
      var kls = c.closest('table').className || 'rata-kiri';
      Object.keys(tombolPosisi).forEach(function (k) { tombolPosisi[k].setAttribute('aria-pressed', kls.indexOf(k) >= 0 ? 'true' : 'false'); });
    }
    ['keyup', 'mouseup', 'touchend', 'focusin'].forEach(function (n) { area.addEventListener(n, segarkanTabel); });
    // Tab berpindah antar sel; Tab di sel terakhir menambah baris.
    area.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      var c = selAktif(); if (!c) return;
      e.preventDefault();
      var sel = Array.prototype.slice.call(c.closest('table').querySelectorAll('th, td')), i = sel.indexOf(c) + (e.shiftKey ? -1 : 1);
      if (i >= sel.length) { aksiTabel.barisBaru(sel[sel.length - 1].parentNode.lastElementChild); segarkanTabel(); return; }
      if (i >= 0) fokusSel(sel[i]);
    });

    var wrap = el('div', { class: 'editor' }, tb, barTabel, area);
    return {
      el: wrap,
      kosong: function () { return area.textContent.replace(/ /g, ' ').trim() === '' && !area.querySelector('img'); },
      ambil: function () {
        var h = window.clean(normRata(area.innerHTML)).replace(/&nbsp;/g, ' ');
        return window.normArab(h).replace(/(?:<br\s*\/?>|\s)+$/i, '').trim();
      }
    };
  }

  function panelTabel(sisip) {
    var baris = el('input', { type: 'number', min: 1, max: 12, value: 3, 'aria-label': 'Jumlah baris', class: 'tbl-angka' });
    var kolom = el('input', { type: 'number', min: 1, max: 8, value: 3, 'aria-label': 'Jumlah kolom', class: 'tbl-angka' });
    var judul = el('input', { type: 'checkbox', checked: true, id: 'tblJudul' + Math.random().toString(36).slice(2, 6) });
    var galat = el('div', { class: 'galat', role: 'alert' });
    function jalankan() {
      var b = parseInt(baris.value, 10), k = parseInt(kolom.value, 10);
      if (!(b >= 1 && b <= 12) || !(k >= 1 && k <= 8)) { galat.textContent = 'Baris 1 sampai 12 dan kolom 1 sampai 8.'; return; }
      galat.textContent = '';
      sisip(b, k, judul.checked && b >= 2);
      panel.hidden = true;
    }
    var panel = el('div', { class: 'panel-tabel' },
      el('label', null, el('span', null, 'Baris'), baris), el('label', null, el('span', null, 'Kolom'), kolom),
      el('label', { class: 'tbl-cek' }, judul, el('span', null, 'Baris judul')),
      el('button', { type: 'button', class: 'btn btn-kecil btn-utama', onmousedown: function (e) { e.preventDefault(); }, onclick: jalankan }, 'Sisipkan tabel'), galat);
    return panel;
  }

  function panelRumus(masukkan) {
    var ta = el('textarea', { rows: 2, class: 'rumus-ta', spellcheck: false, placeholder: 'Tulis LaTeX, contoh \\frac{a}{b}', 'aria-label': 'Rumus LaTeX' });
    var pra = el('div', { class: 'rumus-pra', 'aria-live': 'polite' });
    var baris = el('input', { type: 'checkbox' });
    function gambar() {
      pra.textContent = '';
      if (!ta.value.trim() || !window.katex) return;
      try { window.katex.render(ta.value, pra, { throwOnError: false, displayMode: baris.checked }); }
      catch (e) { pra.textContent = 'Rumus tidak dapat ditampilkan.'; }
    }
    ta.addEventListener('input', gambar);
    baris.addEventListener('change', gambar);
    var cepat = el('div', { class: 'rumus-cepat' }, SNIPPET.map(function (sn) {
      return el('button', { type: 'button', class: 'btn-tb', title: sn[1], onclick: function () {
        ta.setRangeText(sn[1], ta.selectionStart, ta.selectionEnd, 'end'); ta.focus(); gambar();
      } }, sn[0]);
    }));
    var sisip = el('button', { type: 'button', class: 'btn btn-utama btn-kecil', onclick: function () {
      var tex = ta.value.trim();
      if (!tex) return;
      var d = baris.checked ? '$$' : '$';
      masukkan(d + tex + d);
      ta.value = ''; gambar();
    } }, 'Sisipkan');
    return el('div', { class: 'rumus-panel' }, cepat, ta,
      el('label', { class: 'cek' }, baris, el('span', null, 'Tampilkan di baris sendiri')),
      pra, sisip);
  }

  // ---------- gambar: kompres di browser lalu unggah ----------

  function bacaDataUrl(file) {
    return new Promise(function (ok, gagal) {
      var fr = new FileReader();
      fr.onload = function () { ok(fr.result); };
      fr.onerror = function () { gagal(new Error('Gambar tidak dapat dibaca.')); };
      fr.readAsDataURL(file);
    });
  }

  function kompres(file) {
    if (['image/png', 'image/jpeg', 'image/webp', 'image/gif'].indexOf(file.type) < 0) {
      return Promise.reject(new Error('Format gambar harus PNG, JPG, WEBP, atau GIF.'));
    }
    if (file.type === 'image/gif') return bacaDataUrl(file).then(function (d) { return { data: d, mime: 'image/gif' }; });
    return bacaDataUrl(file).then(function (src) {
      return new Promise(function (ok, gagal) {
        var img = new Image();
        img.onload = function () {
          var skala = Math.min(1, MAKS_SISI / img.naturalWidth);
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * skala));
          c.height = Math.max(1, Math.round(img.naturalHeight * skala));
          var g = c.getContext('2d');
          var png = file.type === 'image/png';
          if (!png) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); }
          g.drawImage(img, 0, 0, c.width, c.height);
          var mime = png ? 'image/png' : 'image/jpeg';
          ok({ data: c.toDataURL(mime, 0.85), mime: mime });
        };
        img.onerror = function () { gagal(new Error('Gambar tidak dapat dibaca.')); };
        img.src = src;
      });
    });
  }

  // ---------- bagian soal (teks / gambar / kosong) ----------

  function buatBagian(b, ctx) {
    var o = { mode: b && b.tipe === 'gambar' ? 'gambar' : 'teks' };
    o.teks = editorTeks(b && b.tipe === 'teks' ? b.isi : '', false);
    o.url = el('input', { type: 'text', placeholder: 'https://... (kosongkan jika gambar menyusul)', value: b && b.tipe === 'gambar' ? b.isi : '', 'aria-label': 'URL gambar' });
    o.pra = el('img', { class: 'pra-gambar', alt: 'Pratinjau gambar', hidden: true, referrerPolicy: 'no-referrer' });
    o.status = el('div', { class: 'redup' });
    o.file = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif', hidden: true });
    o.nomor = el('span', { class: 'bagian-no' });
    o.ukuran = window.dropdown({
      aria: 'Ukuran gambar', nilai: b && b.tipe === 'gambar' && b.ukuran ? b.ukuran : 'asli', awalan: 'Ukuran: ',
      pilihan: [{ nilai: 'asli', label: 'Asli' }, { nilai: 'kecil', label: 'Kecil' }, { nilai: 'sedang', label: 'Sedang' }, { nilai: 'besar', label: 'Besar' }, { nilai: 'penuh', label: 'Penuh lebar' }]
    });

    o.rata = b && b.tipe === 'gambar' && b.rata ? b.rata : 'kiri';
    var tombolRataG = {};
    function aturRataG() {
      Object.keys(tombolRataG).forEach(function (k) { tombolRataG[k].setAttribute('aria-pressed', o.rata === k ? 'true' : 'false'); });
    }
    var grupRata = el('div', { class: 'adm-seg adm-seg-kecil adm-seg-ikon', role: 'group', 'aria-label': 'Posisi gambar' },
      [['kiri', 'rataKiri', 'Rata kiri'], ['tengah', 'rataTengah', 'Rata tengah'], ['kanan', 'rataKanan', 'Rata kanan'], ['penuh', 'rataPenuh', 'Rata kiri dan kanan (direntangkan selebar kartu)']].map(function (r) {
        var t = el('button', { type: 'button', title: r[2], 'aria-label': r[2], onclick: function () { o.rata = r[0]; aturRataG(); aturPra(); o.root && o.root.dispatchEvent(new Event('input', { bubbles: true })); } }, window.ikon(r[1], 15));
        tombolRataG[r[0]] = t; return t;
      }));

    function aturPra() {
      var u = o.url.value.trim();
      o.pra.className = 'pra-gambar' + (o.ukuran.value !== 'asli' || o.rata !== 'kiri' ? ' blok-gambar' : '') + (o.ukuran.value !== 'asli' ? ' ukuran-' + o.ukuran.value : '') + (o.rata !== 'kiri' ? ' posisi-' + o.rata : '');
      if (/^https:\/\//i.test(u)) { o.pra.src = u; o.pra.hidden = false; } else { o.pra.hidden = true; o.pra.removeAttribute('src'); }
      o.status.textContent = u === '' ? 'Gambar belum diisi. Soal tidak tampil ke siswa sebelum gambar diisi.' : (/^https:\/\//i.test(u) ? '' : 'URL gambar harus diawali https://');
    }
    o.pra.addEventListener('error', function () { o.pra.hidden = true; o.status.textContent = 'Gambar tidak dapat dimuat dari URL ini.'; });
    o.url.addEventListener('input', aturPra);
    o.ukuran.addEventListener('change', aturPra);

    var tbUnggah = el('button', { type: 'button', class: 'btn btn-kecil', onclick: function () { o.file.click(); } }, window.ikon('unggah', 14), 'Unggah');
    function unggahBerkas(f) {
      if (!f) return;
      tbUnggah.disabled = true; o.status.textContent = 'Mengunggah gambar...';
      kompres(f).then(function (h) {
        var b64 = h.data.split(',')[1] || '';
        if (b64.length * 0.75 > MAKS_BYTE) throw new Error('Gambar terlalu besar. Maksimal 3 MB.');
        return window.call('adminUpload', ctx.tok(), b64, h.mime, f.name || 'gambar');
      }).then(function (url) {
        o.url.value = url; aturPra();
        window.toast('Gambar terunggah.');
      }).catch(function (e) { o.status.textContent = e.message; })
        .then(function () { tbUnggah.disabled = false; });
    }
    o.file.addEventListener('change', function () {
      var f = o.file.files && o.file.files[0];
      o.file.value = '';
      unggahBerkas(f);
    });

    /** Gambar dari papan klip (Ctrl+V) atau seretan berkas; mengembalikan berkas gambar pertama atau null. */
    function gambarDari(dt) {
      if (!dt) return null;
      var items = dt.items || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && /^image\//.test(items[i].type)) return items[i].getAsFile();
      }
      var fl = dt.files || [];
      for (var j = 0; j < fl.length; j++) if (/^image\//.test(fl[j].type)) return fl[j];
      return null;
    }
    o.terimaTempel = function (f) {
      if (o.mode === 'gambar') { unggahBerkas(f); return true; }
      if (o.teks.kosong()) { o.mode = 'gambar'; aturMode(); aturPra(); unggahBerkas(f); return true; }
      return false;
    };
    var tbTempel = el('button', { type: 'button', class: 'btn btn-kecil', title: 'Tempel gambar dari papan klip', onclick: function () {
      if (!(navigator.clipboard && navigator.clipboard.read)) { window.toast('Tekan Ctrl+V (atau tahan lama lalu Tempel di HP) di kotak gambar ini.', true); return; }
      navigator.clipboard.read().then(function (daftar) {
        for (var i = 0; i < daftar.length; i++) {
          var tipe = daftar[i].types.filter(function (t) { return /^image\//.test(t); })[0];
          if (tipe) return daftar[i].getType(tipe).then(function (blob) { unggahBerkas(new File([blob], 'tempel.' + (tipe.split('/')[1] || 'png'), { type: tipe })); });
        }
        window.toast('Tidak ada gambar di papan klip.', true);
      }).catch(function () { window.toast('Izin papan klip ditolak. Tekan Ctrl+V di kotak gambar ini.', true); });
    } }, window.ikon('tempel', 14), 'Tempel');

    var sekGambar = el('div', { class: 'bagian-gambar', tabindex: '0' },
      el('div', { class: 'baris-token' }, o.url, tbUnggah, tbTempel), el('div', { class: 'tempel-info redup' }, 'Atau salin gambar lalu tekan Ctrl+V di sini, juga bisa diseret ke kotak ini.'), el('div', { class: 'baris-ukuran' }, o.ukuran, grupRata, el('span', { class: 'redup' }, 'Ukuran dan posisi gambar di layar siswa.')), o.file, o.pra, o.status);
    var btnTeks = el('button', { type: 'button', onclick: function () { o.mode = 'teks'; aturMode(); } }, 'Teks');
    var btnGambar = el('button', { type: 'button', onclick: function () { o.mode = 'gambar'; aturMode(); aturPra(); } }, 'Gambar');
    function aturMode() {
      o.teks.el.hidden = o.mode !== 'teks';
      sekGambar.hidden = o.mode !== 'gambar';
      btnTeks.setAttribute('aria-pressed', o.mode === 'teks' ? 'true' : 'false');
      btnGambar.setAttribute('aria-pressed', o.mode === 'gambar' ? 'true' : 'false');
    }
    o.tombolNaik = el('button', { type: 'button', class: 'adm-ikon', title: 'Naikkan bagian', onclick: function () { ctx.geser(o, -1); } }, window.ikon('naik', 16));
    o.tombolTurun = el('button', { type: 'button', class: 'adm-ikon', title: 'Turunkan bagian', onclick: function () { ctx.geser(o, 1); } }, window.ikon('turunSoal', 16));
    o.tombolHapus = el('button', { type: 'button', class: 'adm-ikon adm-ikon-hapus', title: 'Hapus bagian', onclick: function () { ctx.hapus(o); } }, window.ikon('hapus', 16));

    o.root = el('div', { class: 'bagian' },
      el('div', { class: 'bagian-kepala' }, o.nomor, el('div', { class: 'adm-seg adm-seg-kecil', role: 'group', 'aria-label': 'Jenis bagian' }, btnTeks, btnGambar),
        el('span', { class: 'spacer' }), o.tombolNaik, o.tombolTurun, o.tombolHapus),
      o.teks.el, sekGambar);
    // Ctrl+V gambar di mana pun di dalam bagian ini (fase tangkap agar mendahului editor teks yang hanya menerima teks polos)
    o.root.addEventListener('paste', function (e) {
      var f = gambarDari(e.clipboardData);
      if (!f) return;
      e.preventDefault(); e.stopPropagation();
      if (!o.terimaTempel(f)) window.toast('Bagian ini berisi teks. Ubah jenisnya ke Gambar, atau tempel di bagian gambar.', true);
    }, true);
    sekGambar.addEventListener('dragover', function (e) { e.preventDefault(); sekGambar.classList.add('seret'); });
    sekGambar.addEventListener('dragleave', function () { sekGambar.classList.remove('seret'); });
    sekGambar.addEventListener('drop', function (e) {
      sekGambar.classList.remove('seret');
      var f = gambarDari(e.dataTransfer);
      if (!f) return;
      e.preventDefault(); unggahBerkas(f);
    });
    aturMode(); aturRataG();
    if (o.mode === 'gambar') aturPra();
    o.ambil = function () {
      if (o.mode === 'teks') return o.teks.kosong() ? null : { tipe: 'teks', isi: o.teks.ambil() };
      var g = { tipe: 'gambar', isi: o.url.value.trim() };
      if (o.ukuran.value !== 'asli') g.ukuran = o.ukuran.value;
      if (o.rata !== 'kiri') g.rata = o.rata;
      return g;
    };
    return o;
  }

  // ---------- pratinjau persis tampilan siswa ----------

  function soalSiswaEl(soal, nomor, total) {
    var badan = el('div', { class: 'kartu-badan' });
    badan.innerHTML = window.blokHTML(soal.blok);
    var kartu = el('div', { class: 'kartu-soal' },
      el('div', { class: 'kartu-kepala' }, el('strong', null, 'Soal ' + nomor + ' dari ' + total), el('span', { class: 'lencana' }, TIPE_LABEL[soal.tipe])),
      badan,
      el('p', { class: 'instruksi' }, INSTRUKSI[soal.tipe]));
    if (soal.tipe === 'isian') {
      kartu.appendChild(el('input', { type: 'text', class: 'isian-siswa', disabled: true, placeholder: 'Ketik jawaban di sini' }));
    } else {
      (soal.opsi || []).forEach(function (op, n) {
        var teks = el('div', { class: 'opsi-teks' });
        teks.innerHTML = window.clean(op.h);
        kartu.appendChild(el('div', { class: 'opsi', style: '--n:' + n },
          el('span', { class: 'opsi-huruf ' + (soal.tipe === 'pg' ? 'bulat' : 'kotak') }, HURUF.charAt(n)), teks));
      });
    }
    window.mathify(kartu);
    return kartu;
  }
  window.soalSiswaEl = soalSiswaEl;

  // ---------- editor soal (modal) ----------

  /**
   * opt: { tok: fn, ujianId, soal (null = baru), nomor, total, onSimpan(hasil) }
   */
  function bukaEditorSoal(opt) {
    var s = opt.soal;
    var baru = !s;
    var ctx = { tok: opt.tok };
    var bagian = [];
    var opsiRows = [];

    var kontBagian = el('div', { class: 'bagian-daftar' });
    function gambarUrutBagian() {
      kontBagian.textContent = '';
      bagian.forEach(function (b, i) {
        b.nomor.textContent = String(i + 1);
        b.tombolNaik.disabled = i === 0; b.tombolTurun.disabled = i === bagian.length - 1;
        [b.tombolNaik, b.tombolTurun, b.tombolHapus].forEach(function (t) { t.setAttribute('aria-label', t.title + ' ' + (i + 1)); });
        kontBagian.appendChild(b.root);
      });
      if (tbTambahBagian) tbTambahBagian.disabled = bagian.length >= 8;
    }
    ctx.geser = function (b, arah) {
      var i = bagian.indexOf(b), j = i + arah;
      if (j < 0 || j >= bagian.length) return;
      bagian.splice(i, 1); bagian.splice(j, 0, b);
      gambarUrutBagian();
    };
    ctx.hapus = function (b) {
      if (bagian.length <= 1) { window.toast('Soal minimal punya satu bagian.', true); return; }
      var i = bagian.indexOf(b);
      bagian.splice(i, 1); gambarUrutBagian(); jadwalkanPratinjau();
      window.toast('Bagian ' + (i + 1) + ' dihapus.', false, { teks: 'Urungkan', fn: function () {
        bagian.splice(Math.min(i, bagian.length), 0, b); gambarUrutBagian(); jadwalkanPratinjau();
      } });
    };
    var awalBlok = (s && s.blok) || [];
    var tbTambahBagian = null;
    var jumlah = Math.max(baru ? 2 : 1, awalBlok.length);
    for (var i = 0; i < jumlah; i++) bagian.push(buatBagian(awalBlok[i] || { tipe: 'teks', isi: '' }, ctx));
    tbTambahBagian = el('button', { type: 'button', class: 'btn btn-kecil', onclick: function () {
      if (bagian.length >= 8) { window.toast('Maksimal 8 bagian.', true); return; }
      var nb = buatBagian({ tipe: 'teks', isi: '' }, ctx);
      bagian.push(nb); gambarUrutBagian();
      var ta = nb.root.querySelector('[contenteditable]'); if (ta && !window.layarSentuh()) ta.focus();
    } }, window.ikon('tambah', 14), 'Tambah bagian');
    gambarUrutBagian();

    var pilihTipe = window.dropdown({ aria: 'Tipe soal', nilai: s ? s.tipe : 'pg',
      pilihan: Object.keys(TIPE_LABEL).map(function (k) { return { nilai: k, label: TIPE_LABEL[k] }; }) });
    var bobot = el('input', { type: 'number', min: '0', step: 'any', value: s ? s.bobot : 1, 'aria-label': 'Bobot' });

    // opsi
    var kontOpsi = el('div', { class: 'opsi-daftar' });
    var kunciAwal = (s && s.kunci) || [];
    function barisOpsi(op, benar) {
      var r = { benar: !!benar };
      r.huruf = el('span', { class: 'opsi-huruf kotak' });
      r.ed = editorTeks(op ? op.h : '', true);
      r.kontrol = el('span', { class: 'kontrol-kunci' });
      r.hapus = el('button', { type: 'button', class: 'adm-ikon adm-ikon-hapus', title: 'Hapus opsi', 'aria-label': 'Hapus opsi', onclick: function () {
        if (opsiRows.length <= 2) { window.toast('Minimal 2 opsi.', true); return; }
        simpanBenar(); opsiRows.splice(opsiRows.indexOf(r), 1); gambarOpsi();
      } }, window.ikon('hapus', 16));
      r.root = el('div', { class: 'opsi-baris' }, r.huruf, el('div', { class: 'opsi-ed' }, r.ed.el), r.kontrol, r.hapus);
      return r;
    }
    function simpanBenar() {
      opsiRows.forEach(function (r) { if (r.input) r.benar = r.input.checked; });
    }
    function gambarOpsi() {
      var tipe = pilihTipe.value;
      if (tipe === 'pg') {
        var ada = false;
        opsiRows.forEach(function (r) { if (r.benar && ada) r.benar = false; if (r.benar) ada = true; });
      }
      kontOpsi.textContent = '';
      opsiRows.forEach(function (r, n) {
        r.huruf.textContent = HURUF.charAt(n);
        r.huruf.className = 'opsi-huruf ' + (tipe === 'pg' ? 'bulat' : 'kotak');
        r.kontrol.textContent = '';
        r.input = el('input', { type: tipe === 'pg' ? 'radio' : 'checkbox', name: 'kunciOpsi', checked: r.benar, 'aria-label': 'Kunci ' + HURUF.charAt(n) });
        r.kontrol.appendChild(el('label', { class: 'cek kunci-pilih', title: 'Jadikan jawaban benar' }, r.input));
        kontOpsi.appendChild(r.root);
      });
      tbTambahOpsi.disabled = opsiRows.length >= 8;
    }
    var tbTambahOpsi = el('button', { type: 'button', class: 'btn btn-teks btn-kecil', onclick: function () {
      if (opsiRows.length >= 8) return;
      simpanBenar(); opsiRows.push(barisOpsi(null, false)); gambarOpsi();
    } }, window.ikon('tambah', 14), 'Tambah opsi');

    var opsiAwal = (s && s.opsi && s.opsi.length) ? s.opsi : [{ k: 'A', h: '' }, { k: 'B', h: '' }, { k: 'C', h: '' }, { k: 'D', h: '' }];
    opsiAwal.forEach(function (op) { opsiRows.push(barisOpsi(op, s && s.tipe !== 'isian' && kunciAwal.indexOf(op.k) >= 0)); });
    var seksiOpsi = el('div', null, el('div', { class: 'adm-bagian' }, 'PILIHAN JAWABAN (PILIH KUNCI DI SEBELAH KANAN)'), kontOpsi, tbTambahOpsi);

    var isianKunci = el('input', { type: 'text', value: s && s.tipe === 'isian' ? kunciAwal.join(' | ') : '', placeholder: 'Contoh: 12,5 | 12.5', 'aria-label': 'Jawaban benar' });
    var seksiIsian = el('div', null, el('div', { class: 'adm-bagian' }, 'JAWABAN BENAR'),
      el('label', { class: 'field' }, el('span', { class: 'redup' }, 'Pisahkan beberapa jawaban yang diterima dengan tanda |. Harakat Arab diabaikan saat mencocokkan.'), isianKunci));

    function aturTipe() {
      var isian = pilihTipe.value === 'isian';
      seksiOpsi.hidden = isian; seksiIsian.hidden = !isian;
      if (!isian) { simpanBenar(); gambarOpsi(); }
    }
    pilihTipe.addEventListener('change', aturTipe);

    var galat = el('div', { class: 'galat', role: 'alert' });

    function kumpul() {
      var tipe = pilihTipe.value;
      var data = {
        id: s ? s.id : undefined, ujian_id: opt.ujianId, tipe: tipe,
        blok: bagian.map(function (b) { return b.ambil(); }).filter(Boolean),
        bobot: bobot.value === '' ? 1 : Number(bobot.value)
      };
      if (tipe === 'isian') {
        data.kunci = isianKunci.value.split('|').map(function (x) { return x.trim(); }).filter(Boolean);
        data.opsi = [];
      } else {
        simpanBenar();
        data.opsi = {}; data.kunci = [];
        opsiRows.forEach(function (r, n) {
          data.opsi[HURUF.charAt(n)] = r.ed.kosong() ? '' : r.ed.ambil();
          if (r.benar) data.kunci.push(HURUF.charAt(n));
        });
      }
      return data;
    }

    function pratinjau() {
      var d = kumpul();
      var soal = { tipe: d.tipe, blok: d.blok, opsi: [] };
      if (d.tipe !== 'isian') soal.opsi = Object.keys(d.opsi).map(function (k) { return { k: k, h: d.opsi[k] }; });
      window.openModal({
        judul: 'Pratinjau soal', lebar: true,
        isi: soalSiswaEl(soal, opt.nomor, opt.total),
        tombol: [{ teks: 'Tutup', utama: true }]
      });
    }

    function simpan(modal) {
      var data = kumpul();
      var blokTeks = data.blok.some(function (b) { return b.tipe === 'teks'; });
      if (!blokTeks) { galat.textContent = 'Teks soal wajib diisi.'; return false; }
      if (data.tipe !== 'isian' && Object.keys(data.opsi).some(function (k) { return data.opsi[k] === ''; })) {
        galat.textContent = 'Semua opsi harus diisi. Hapus opsi yang tidak dipakai.'; return false;
      }
      tombol.disabled = true; galat.textContent = '';
      window.call('adminSoalSimpan', opt.tok(), data).then(function (h) {
        modal.close();
        if (h.peringatan && h.peringatan.length) window.toast('Soal disimpan. Periksa: ' + h.peringatan.join(' '), true);
        else window.toast('Soal disimpan.');
        if (opt.onSimpan) opt.onSimpan(h);
      }).catch(function (e) {
        tombol.disabled = false;
        if (e.message.indexOf('SESI_ADMIN') !== 0) galat.textContent = e.message;
      });
      return false;
    }

    var kunciInfo = el('div', { class: 'kunci-info' });
    var pvWadah = el('div', { class: 'pv-wadah' });
    var pvStatus = el('div', { class: 'pv-status' });
    var jam = null;
    function segarPratinjau() {
      var d = kumpul();
      var soal = { tipe: d.tipe, blok: d.blok, opsi: [] };
      if (d.tipe !== 'isian') soal.opsi = Object.keys(d.opsi).map(function (k) { return { k: k, h: d.opsi[k] }; });
      var kartu = soalSiswaEl(soal, opt.nomor, opt.total);
      kartu.querySelectorAll('.opsi').forEach(function (o, n) { if (d.kunci.indexOf(HURUF.charAt(n)) >= 0) o.classList.add('opsi-kunci'); });
      pvWadah.textContent = ''; pvWadah.appendChild(kartu);
      var kunciTeks = d.kunci.length ? d.kunci.join(d.tipe === 'isian' ? ' | ' : ', ') : '';
      kunciInfo.textContent = kunciTeks || 'belum dipilih';
      kunciInfo.classList.toggle('kosong-kunci', !kunciTeks);
      pvStatus.textContent = '';
      pvStatus.appendChild(el('span', { class: kunciTeks ? 'ok' : 'peringatan' }, window.ikon(kunciTeks ? 'centang' : 'peringatan', 14), kunciTeks ? 'Kunci: ' + kunciTeks : 'Kunci belum dipilih'));
      pvStatus.appendChild(el('span', { class: 'ok' }, window.ikon('centang', 14), d.blok.length + ' bagian' + (d.tipe === 'isian' ? '' : ', ' + Object.keys(d.opsi).length + ' opsi')));
    }
    function jadwalkanPratinjau() {
      clearTimeout(jam);
      jam = setTimeout(function () { if (kunciInfo.isConnected) segarPratinjau(); }, 250);
    }

    var kiri = el('div', { class: 'ed2-kiri' },
      el('div', { class: 'ed2-meta' },
        el('div', { class: 'field' }, el('span', null, 'Tipe soal'), pilihTipe),
        el('label', { class: 'field' }, el('span', null, 'Bobot'), bobot),
        el('div', { class: 'field' }, el('span', null, 'Kunci'), kunciInfo)),
      el('div', { class: 'adm-bagian' }, 'ISI SOAL'), kontBagian, tbTambahBagian,
      seksiOpsi, seksiIsian, galat);
    var kanan = el('div', { class: 'ed2-kanan' }, el('div', { class: 'ed2-lengket' },
      el('div', { class: 'adm-bagian' }, 'PRATINJAU SISWA (LANGSUNG)'), pvWadah, pvStatus));
    var badan = el('div', { class: 'ed2' }, kiri, kanan);
    ['input', 'change', 'click'].forEach(function (n) { kiri.addEventListener(n, jadwalkanPratinjau); });
    var modal = window.openModal({
      judul: baru ? 'Tambah soal' : 'Ubah soal ' + opt.nomor, isi: badan, kelas: 'modal-editor', tutupDiLuar: false,
      tombol: [
        { teks: 'Batal' },
        { teks: 'Pratinjau', aksi: function () { pratinjau(); return false; } },
        { teks: 'Simpan soal', utama: true, aksi: simpan }
      ]
    });
    var tombol = modal.el.querySelector('.btn-utama');
    aturTipe();
    segarPratinjau();
  }

  window.Editor = { buka: bukaEditorSoal };
})();
</script>
