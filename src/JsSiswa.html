<script>
(function () {
  var KUNCI_SESI = 'cbt_sesi_v1';
  var ATURAN_NILAI = [
    'Pilihan ganda: benar jika pilihan sama dengan kunci.',
    'Pilihan ganda kompleks: benar hanya jika semua pilihan yang Anda centang sama persis dengan kunci.',
    'Isian singkat: benar jika cocok dengan salah satu jawaban yang diterima. Huruf besar dan kecil dianggap sama, koma dan titik desimal dianggap sama.',
    'Soal yang tidak dijawab tidak dihitung salah. Jawaban salah tidak mengurangi nilai.',
    'Nilai = jumlah bobot soal benar dibagi jumlah bobot seluruh soal, dikali 100.'
  ];
  var TATA_TERTIB = [
    'Peserta tidak boleh digantikan orang lain atau menerima bantuan.',
    'Peserta tidak boleh keluar ruangan tanpa izin pengawas.',
    'Peserta tidak boleh memakai alat bantu seperti alat komunikasi atau kalkulator, dan tidak boleh membawa buku, kamus, catatan, atau tabel, kecuali pengawas mengizinkan.',
    'Waktu berjalan di server dan tidak berhenti walau halaman ditutup. Jawaban terkirim otomatis saat waktu habis.',
    'Setelah jawaban dikirim, jawaban tidak dapat diubah.'
  ];

  function rincianTipe(u) {
    var bagian = [];
    if (u.n_pg) bagian.push(u.n_pg + ' pilihan ganda');
    if (u.n_pgk) bagian.push(u.n_pgk + ' pilihan ganda kompleks');
    if (u.n_isian) bagian.push(u.n_isian + ' isian singkat');
    return bagian.join(', ');
  }

  // ---------- beranda ----------

  function kartuUjian(u) {
    return el('button', { type: 'button', class: 'kontainer', onclick: function () { langkah1(u, {}); } },
      el('span', { class: 'kontainer-atas' }, el('span', { class: 'lencana' }, u.jenjang), u.sesi ? el('span', { class: 'redup' }, u.sesi) : null),
      el('strong', { class: 'kontainer-mapel' }, u.mapel),
      el('span', { class: 'kontainer-nama' }, u.nama),
      el('span', { class: 'redup' }, u.jumlah_soal + ' soal · ' + u.durasi_menit + ' menit'),
      el('span', { class: 'kontainer-pilih' }, 'Pilih'));
  }

  function sesiTersimpan() {
    var d = window.bacaLokal(KUNCI_SESI);
    if (!d || !d.sesiId || !d.akhirMs) return null;
    if (d.akhirMs - (Date.now() + (d.offset || 0)) <= 0) return null;
    return d;
  }

  function kotakLanjut() {
    var d = sesiTersimpan();
    if (!d) return null;
    return el('div', { class: 'lanjut-kotak' },
      el('div', null, el('strong', null, 'Lanjutkan ujian'), el('div', { class: 'redup' }, (d.ujianNama || 'Ujian') + ' atas nama ' + (d.peserta && d.peserta.nama || ''))),
      el('button', { type: 'button', class: 'btn btn-utama', onclick: function () { mulai(d.ujianId, d.token, d.peserta || {}); } }, 'Lanjutkan'));
  }

  function gambarBeranda(daftar) {
    var s = document.querySelector('[data-view="beranda"]');
    s.textContent = '';
    s.appendChild(el('h1', null, 'Pilih ujian'));
    s.appendChild(el('p', { class: 'redup' }, 'Pilih kontainer sesuai jenjang dan mata pelajaran Anda.'));
    var lanjut = kotakLanjut();
    if (lanjut) s.appendChild(lanjut);
    if (!daftar.length) {
      s.appendChild(el('p', { class: 'kosong' }, 'Belum ada ujian yang dibuka. Hubungi pengawas atau admin.'));
    } else {
      var kelompok = [], terakhir = null;
      daftar.forEach(function (u) {
        if (!terakhir || terakhir.jenjang.toLowerCase() !== u.jenjang.toLowerCase()) { terakhir = { jenjang: u.jenjang, isi: [] }; kelompok.push(terakhir); }
        terakhir.isi.push(u);
      });
      kelompok.forEach(function (k) {
        s.appendChild(el('h2', { class: 'kelompok' }, k.jenjang));
        s.appendChild(el('div', { class: 'grid-ujian' }, k.isi.map(kartuUjian)));
      });
    }
    s.appendChild(el('footer', { class: 'footer' }, 'Dibuat oleh Genio Institute Yogyakarta'));
  }

  function muatBeranda() {
    var s = document.querySelector('[data-view="beranda"]');
    window.showView('beranda');
    s.textContent = '';
    s.appendChild(el('h1', null, 'Pilih ujian'));
    s.appendChild(el('div', { class: 'grid-ujian' }, [1, 2, 3].map(function () {
      return el('div', { class: 'kontainer' }, el('div', { class: 'kerangka' }), el('div', { class: 'kerangka' }), el('div', { class: 'kerangka' }));
    })));
    window.call('apiBeranda').then(gambarBeranda).catch(function (e) {
      s.textContent = '';
      s.appendChild(el('h1', null, 'Pilih ujian'));
      s.appendChild(el('p', { class: 'kosong' }, e.message));
      s.appendChild(el('button', { type: 'button', class: 'btn', onclick: muatBeranda }, 'Coba lagi'));
    });
  }
  window.App.muatBeranda = muatBeranda;

  // ---------- popup langkah 1 dan 2 ----------

  function langkah1(u, isi) {
    var f = {};
    function kolom(kunci, label, wajib, extra) {
      f[kunci] = el('input', Object.assign({ type: 'text', value: isi[kunci] || '', maxLength: kunci === 'nama' ? 100 : 100, autocomplete: 'off' }, extra || {}));
      return el('label', { class: 'field' }, el('span', null, label + (wajib ? ' *' : '')), f[kunci]);
    }
    var galatNama = el('div', { class: 'galat', role: 'alert' });
    var galatToken = el('div', { class: 'galat', role: 'alert' });
    var badan = el('div', null,
      el('p', { class: 'redup' }, u.mapel + ' · ' + u.nama),
      kolom('nama', 'Nama lengkap', true), galatNama,
      el('div', { class: 'grid2' }, kolom('nomor', 'Nomor peserta', false), kolom('kelas', 'Kelas', false)),
      kolom('sekolah', 'Sekolah', false),
      kolom('token', 'Token', true, { autocapitalize: 'characters', spellcheck: false }), galatToken);
    f.token.addEventListener('input', function () { f.token.value = f.token.value.toUpperCase(); });

    function ambil() {
      return { nama: f.nama.value.trim(), nomor: f.nomor.value.trim(), kelas: f.kelas.value.trim(), sekolah: f.sekolah.value.trim(), token: f.token.value.trim() };
    }
    function lanjut(modal) {
      var d = ambil();
      galatNama.textContent = ''; galatToken.textContent = '';
      if (!d.nama) { galatNama.textContent = 'Isi nama lengkap Anda.'; f.nama.focus(); return false; }
      if (!d.token) { galatToken.textContent = 'Isi token dari pengawas.'; f.token.focus(); return false; }
      tombol.disabled = true;
      window.call('apiCekToken', u.id, d.token).then(function (h) {
        modal.close();
        langkah2(h.ujian, d);
      }).catch(function (e) {
        galatToken.textContent = e.message;
        tombol.disabled = false;
        f.token.select();
      });
      return false;
    }
    var modal = window.openModal({
      judul: 'Data peserta', isi: badan, tutupDiLuar: false,
      tombol: [{ teks: 'Batal' }, { teks: 'Lanjut', utama: true, aksi: lanjut }]
    });
    var tombol = modal.el.querySelector('.btn-utama');
    modal.el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); lanjut(modal); } });
  }

  function langkah2(u, d) {
    function daftar(judul, butir) {
      return el('div', null, el('h3', null, judul), el('ul', { class: 'daftar-info' }, butir.map(function (b) { return el('li', null, b); })));
    }
    var badan = el('div', null,
      el('dl', { class: 'info-grid' },
        el('div', null, el('dt', null, 'Ujian'), el('dd', null, u.nama)),
        el('div', null, el('dt', null, 'Jenjang dan mata pelajaran'), el('dd', null, u.jenjang + ' · ' + u.mapel + (u.sesi ? ' · ' + u.sesi : ''))),
        el('div', null, el('dt', null, 'Jumlah soal'), el('dd', null, u.jumlah_soal + ' soal: ' + rincianTipe(u))),
        el('div', null, el('dt', null, 'Durasi'), el('dd', null, u.durasi_menit + ' menit'))),
      u.catatan && String(u.catatan).trim() ? el('div', null, el('h3', null, 'Catatan dari pengawas'), el('p', { class: 'catatan' }, String(u.catatan).trim())) : null,
      daftar('Aturan penilaian', ATURAN_NILAI),
      daftar('Tata tertib', TATA_TERTIB),
      el('p', { class: 'redup' }, 'Waktu mulai dihitung saat Anda menekan "Mulai ujian".'));
    window.openModal({
      judul: 'Sebelum mulai', isi: badan, lebar: true, tutupDiLuar: false,
      tombol: [
        { teks: 'Kembali', aksi: function () { setTimeout(function () { langkah1(u, d); }, 0); } },
        { teks: 'Mulai ujian', utama: true, aksi: function () { mulai(u.id, d.token, { nama: d.nama, nomor: d.nomor, kelas: d.kelas, sekolah: d.sekolah }); } }
      ]
    });
  }

  function mulai(ujianId, token, peserta) {
    window.App.mulaiUjian(ujianId, token, peserta);
  }

  // ---------- mengerjakan ujian ----------

  var HURUF = 'ABCDEFGH';
  var LABEL_TIPE = { pg: 'Pilihan ganda', pgk: 'Pilihan ganda kompleks', isian: 'Isian singkat' };
  var INSTRUKSI = {
    pg: 'Pilih satu jawaban benar!',
    pgk: 'Pilih satu atau lebih jawaban benar!',
    isian: 'Ketik jawaban singkat Anda!'
  };
  var INTERVAL_SINKRON_MS = 3 * 60 * 1000;
  var BATAS_MEPET_MS = 5 * 60 * 1000;
  var U = null;
  var pengatur = { timer: null, sinkron: null };

  function layarPesan(teks) {
    var s = document.querySelector('[data-view="ujian"]');
    window.showView('ujian');
    s.textContent = '';
    s.appendChild(el('p', { class: 'kosong' }, teks));
    return s;
  }

  window.App.mulaiUjian = function (ujianId, token, peserta) {
    layarPesan('Menyiapkan ujian...');
    window.call('apiMulai', ujianId, token, peserta)
      .then(function (d) { mulaiSesi(d, ujianId, token); })
      .catch(function (e) { window.toast(e.message, true); muatBeranda(); });
  };

  function mulaiSesi(d, ujianId, token) {
    bersihkan();
    var lokal = window.bacaLokal(KUNCI_SESI);
    var sama = lokal && lokal.sesiId === d.sesiId && lokal.jawaban && typeof lokal.jawaban === 'object';
    U = {
      sesiId: d.sesiId, ujianId: ujianId, token: token, peserta: d.peserta, ujian: d.ujian, soal: d.soal,
      jawaban: sama ? lokal.jawaban : (d.jawaban || {}),
      idx: sama && lokal.idx >= 0 && lokal.idx < d.soal.length ? lokal.idx : 0,
      offset: d.serverNow - Date.now(), akhirMs: d.akhirMs,
      versi: 0, versiKirim: 0, selesai: false, mengirim: false, el: {}
    };
    simpanSesiLokal();
    bangunLayar();
    tampilSoal();
    mulaiTimer();
    pengatur.sinkron = setInterval(function () { sinkron(false); }, INTERVAL_SINKRON_MS);
    window.addEventListener('beforeunload', peringatTutup);
    if (d.lanjut) window.toast('Melanjutkan ujian Anda.');
  }

  function simpanSesiLokal() {
    if (!U) return;
    window.simpanLokal(KUNCI_SESI, {
      sesiId: U.sesiId, ujianId: U.ujianId, ujianNama: U.ujian.nama, akhirMs: U.akhirMs, offset: U.offset,
      token: U.token, peserta: U.peserta, jawaban: U.jawaban, idx: U.idx
    });
  }

  function peringatTutup(e) {
    if (U && !U.selesai) { e.preventDefault(); e.returnValue = ''; }
  }

  function bersihkan() {
    clearInterval(pengatur.timer); clearInterval(pengatur.sinkron);
    pengatur.timer = pengatur.sinkron = null;
    window.removeEventListener('beforeunload', peringatTutup);
    document.removeEventListener('visibilitychange', tick);
  }

  function adaJawaban(id) {
    var j = U.jawaban[id];
    return Array.isArray(j) && j.some(function (x) { return String(x).trim() !== ''; });
  }
  function jumlahTerjawab() {
    return U.soal.filter(function (s) { return adaJawaban(s.id); }).length;
  }

  // tata letak

  function bangunLayar() {
    var s = document.querySelector('[data-view="ujian"]');
    var p = U.peserta, e = U.el;
    window.showView('ujian');
    s.textContent = '';

    var side = el('aside', { class: 'u-side' },
      el('div', { class: 'u-avatar', 'aria-hidden': 'true' }, (p.nama || '?').trim().charAt(0).toUpperCase()),
      el('strong', { class: 'u-nama' }, p.nama),
      p.nomor ? el('div', { class: 'redup' }, 'No. peserta ' + p.nomor) : null,
      el('div', { class: 'u-lencana' }, el('span', { class: 'lencana' }, U.ujian.jenjang + ' ' + U.ujian.mapel),
        U.ujian.sesi ? el('span', { class: 'lencana' }, U.ujian.sesi) : null));

    e.kartu = el('div', { class: 'kartu-soal' });
    e.sebelumnya = el('button', { type: 'button', class: 'btn', onclick: function () { pindah(U.idx - 1); } }, 'Sebelumnya');
    e.berikutnya = el('button', { type: 'button', class: 'btn btn-utama', onclick: function () { pindah(U.idx + 1); } }, 'Berikutnya');
    var main = el('section', { class: 'u-main' }, e.kartu, el('div', { class: 'u-nav' }, e.sebelumnya, e.berikutnya));

    e.timer = el('div', { class: 'u-timer', role: 'timer' }, '--:--:--');
    e.refresh = el('button', { type: 'button', class: 'btn', onclick: function () {
      e.refresh.disabled = true;
      sinkron(true).then(function () { e.refresh.disabled = false; });
    } }, 'Refresh');
    e.hitung = el('span', { class: 'redup' });
    e.grid = el('div', { class: 'u-grid' }, U.soal.map(function (soal, i) {
      return el('button', { type: 'button', class: 'sel', onclick: function () { pindah(i); } }, (i < 9 ? '0' : '') + (i + 1));
    }));
    e.laci = el('div', { class: 'u-laci tutup' }, e.grid);
    var tombolLaci = el('button', { type: 'button', class: 'btn u-laci-tombol', 'aria-expanded': 'false', onclick: function () {
      var buka = e.laci.classList.toggle('tutup') === false;
      tombolLaci.setAttribute('aria-expanded', buka ? 'true' : 'false');
    } }, 'Daftar soal');
    var panel = el('aside', { class: 'u-panel' },
      el('div', { class: 'redup' }, 'Sisa waktu ujian'), e.timer,
      el('div', { class: 'u-aksi' }, e.refresh,
        el('button', { type: 'button', class: 'btn', onclick: kosongkanJawaban }, 'Kosongkan jawaban'),
        el('button', { type: 'button', class: 'btn btn-bahaya', onclick: konfirmasiSelesai }, 'Selesaikan ujian')),
      el('div', { class: 'u-daftar-kepala' }, el('strong', null, 'Daftar soal'), e.hitung),
      tombolLaci, e.laci);

    s.appendChild(el('div', { class: 'ujian' }, side, main, panel));
  }

  function segarkanGrid() {
    var sel = U.el.grid.children;
    for (var i = 0; i < sel.length; i++) {
      var ada = adaJawaban(U.soal[i].id);
      sel[i].className = 'sel' + (ada ? ' terjawab' : '') + (i === U.idx ? ' aktif' : '');
      sel[i].setAttribute('aria-label', 'Soal ' + (i + 1) + (ada ? ', terjawab' : ', belum dijawab') + (i === U.idx ? ', sedang dibuka' : ''));
      if (i === U.idx) sel[i].setAttribute('aria-current', 'true'); else sel[i].removeAttribute('aria-current');
    }
    U.el.hitung.textContent = jumlahTerjawab() + '/' + U.soal.length + ' terjawab';
  }

  // soal

  function pasangGambar(akar) {
    akar.querySelectorAll('img.blok-gambar').forEach(function (img) {
      img.addEventListener('error', function () {
        var asal = img.getAttribute('src');
        var kotak = el('div', { class: 'gambar-gagal' }, el('span', null, 'Gambar tidak dapat dimuat. '),
          el('button', { type: 'button', class: 'btn btn-teks', onclick: function () {
            var baru = img.cloneNode(false);
            baru.src = asal + (asal.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
            kotak.replaceWith(baru);
            pasangGambar(baru.parentNode || akar);
          } }, 'Coba lagi'));
        img.replaceWith(kotak);
      }, { once: true });
    });
  }

  function ubahJawaban(soal, nilaiArray) {
    var kosong = !nilaiArray.length || nilaiArray.every(function (x) { return String(x).trim() === ''; });
    if (kosong) delete U.jawaban[soal.id]; else U.jawaban[soal.id] = nilaiArray;
    U.versi++;
    simpanSesiLokal();
    segarkanGrid();
  }

  function opsiEl(soal, op, n) {
    var jawab = U.jawaban[soal.id] || [];
    var dipilih = jawab.indexOf(op.k) >= 0;
    var input = el('input', { type: soal.tipe === 'pg' ? 'radio' : 'checkbox', name: 'opsi-' + soal.id, value: op.k, checked: dipilih });
    var teks = el('div', { class: 'opsi-teks' });
    teks.innerHTML = window.clean(op.h);
    var label = el('label', { class: 'opsi' + (dipilih ? ' terpilih' : '') }, input,
      el('span', { class: 'opsi-huruf ' + (soal.tipe === 'pg' ? 'bulat' : 'kotak') }, HURUF.charAt(n)), teks);
    input.addEventListener('change', function () {
      var skrg = (U.jawaban[soal.id] || []).slice();
      if (soal.tipe === 'pg') skrg = [op.k];
      else if (input.checked) { if (skrg.indexOf(op.k) < 0) skrg.push(op.k); }
      else skrg = skrg.filter(function (x) { return x !== op.k; });
      ubahJawaban(soal, skrg);
      U.el.kartu.querySelectorAll('.opsi').forEach(function (l) {
        l.classList.toggle('terpilih', l.querySelector('input').checked);
      });
    });
    return label;
  }

  function tampilSoal() {
    var soal = U.soal[U.idx], k = U.el.kartu;
    k.textContent = '';
    var badan = el('div', { class: 'kartu-badan' });
    badan.innerHTML = window.blokHTML(soal.blok);
    pasangGambar(badan);
    k.appendChild(el('div', { class: 'kartu-kepala' },
      el('strong', null, 'Soal ' + (U.idx + 1) + ' dari ' + U.soal.length),
      el('span', { class: 'lencana' }, LABEL_TIPE[soal.tipe])));
    k.appendChild(badan);
    k.appendChild(el('p', { class: 'instruksi' }, INSTRUKSI[soal.tipe]));
    if (soal.tipe === 'isian') {
      var jawab = U.jawaban[soal.id] || [];
      var input = el('input', { type: 'text', class: 'isian-siswa', value: jawab[0] || '', dir: 'auto', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, 'aria-label': 'Jawaban Anda' });
      input.addEventListener('input', function () { ubahJawaban(soal, [input.value]); });
      k.appendChild(input);
    } else {
      soal.opsi.forEach(function (op, n) { k.appendChild(opsiEl(soal, op, n)); });
    }
    window.mathify(k);
    U.el.sebelumnya.disabled = U.idx === 0;
    U.el.berikutnya.disabled = U.idx === U.soal.length - 1;
    segarkanGrid();
  }

  function pindah(i) {
    if (!U || i < 0 || i >= U.soal.length || i === U.idx) return;
    U.idx = i;
    simpanSesiLokal();
    tampilSoal();
    var atas = U.el.kartu.getBoundingClientRect().top;
    if (atas < 0) window.scrollTo(0, window.scrollY + atas - 16);
  }

  function kosongkanJawaban() {
    var soal = U.soal[U.idx];
    if (!adaJawaban(soal.id)) { window.toast('Soal ini belum dijawab.'); return; }
    window.openModal({
      judul: 'Kosongkan jawaban soal ' + (U.idx + 1) + '?',
      isi: 'Jawaban yang sudah Anda pilih untuk soal ini akan dihapus.',
      tombol: [{ teks: 'Batal' }, { teks: 'Kosongkan', utama: true, aksi: function () { ubahJawaban(soal, []); tampilSoal(); } }]
    });
  }

  // waktu

  function sisaMs() { return U.akhirMs - (Date.now() + U.offset); }

  function format(ms) {
    var d = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), s = d % 60;
    return [h, m, s].map(function (x) { return (x < 10 ? '0' : '') + x; }).join(':');
  }

  function tick() {
    if (!U || U.selesai || U.mengirim) return;
    var sisa = sisaMs();
    U.el.timer.textContent = format(sisa);
    U.el.timer.classList.toggle('mepet', sisa <= BATAS_MEPET_MS);
    if (sisa <= 0) kirimSelesai(true);
  }

  function mulaiTimer() {
    tick();
    pengatur.timer = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', tick);
  }

  function sinkron(manual) {
    if (!U || U.selesai || U.mengirim) return Promise.resolve();
    if (!manual && U.versi === U.versiKirim) return Promise.resolve();
    var versi = U.versi;
    return window.call('apiSinkron', U.sesiId, U.jawaban).then(function (h) {
      if (!U) return;
      U.offset = h.serverNow - Date.now();
      U.akhirMs = h.akhirMs;
      if (U.versi === versi) U.versiKirim = versi;
      simpanSesiLokal();
      tick();
      if (manual) window.toast('Waktu dan jawaban sudah disinkronkan.');
    }).catch(function (e) {
      if (/sudah selesai/.test(e.message)) { kirimSelesai(false); return; }
      if (manual) window.toast(e.message + ' Jawaban tetap tersimpan di perangkat ini.', true);
    });
  }

  // selesai

  function konfirmasiSelesai() {
    var belum = U.soal.length - jumlahTerjawab();
    window.openModal({
      judul: 'Kirim jawaban sekarang?',
      isi: belum
        ? 'Masih ada ' + belum + ' soal yang belum dijawab. Setelah dikirim, jawaban tidak dapat diubah.'
        : 'Semua soal sudah dijawab. Setelah dikirim, jawaban tidak dapat diubah.',
      tombol: [{ teks: 'Kembali mengerjakan' }, { teks: 'Kirim jawaban', utama: true, aksi: function () { kirimSelesai(false); } }]
    });
  }

  function kirimSelesai(otomatis) {
    if (!U || U.mengirim || U.selesai) return;
    U.mengirim = true;
    clearInterval(pengatur.timer); clearInterval(pengatur.sinkron);
    kirimJawaban(otomatis ? 'Waktu habis. Mengirim jawaban Anda...' : 'Mengirim jawaban Anda...');
  }

  function kirimJawaban(pesan) {
    layarPesan(pesan);
    window.call('apiSelesai', U.sesiId, U.jawaban).then(function (h) {
      U.selesai = true;
      var sesiAktif = U;
      bersihkan();
      window.hapusLokal(KUNCI_SESI);
      window.App.tampilHasil(h, sesiAktif);
      U = null;
    }).catch(function (e) {
      var s = layarPesan('Jawaban belum terkirim: ' + e.message);
      s.appendChild(el('p', { class: 'redup' }, 'Jawaban Anda aman di perangkat ini. Periksa koneksi internet, lalu kirim ulang.'));
      s.appendChild(el('button', { type: 'button', class: 'btn btn-utama', onclick: function () { kirimJawaban('Mengirim jawaban Anda...'); } }, 'Kirim ulang'));
    });
  }

  // ---------- hasil, PDF, cetak ----------

  function formatDurasi(detik) {
    var d = Math.max(0, Math.round(detik || 0)), j = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), s = d % 60;
    var bagian = [];
    if (j) bagian.push(j + ' jam');
    if (m) bagian.push(m + ' menit');
    if (s || !bagian.length) bagian.push(s + ' detik');
    return bagian.join(' ');
  }

  function formatTanggal(iso) {
    var t = new Date(iso);
    if (isNaN(t.getTime())) return '';
    try { return t.toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }); } catch (e) { return t.toLocaleString(); }
  }

  /** Huruf sesuai tampilan siswa (urutan opsi bisa diacak), bukan huruf asli di database. */
  function hurufTampil(soal, daftarK) {
    return (daftarK || []).map(function (k) {
      var n = soal.opsi.map(function (o) { return o.k; }).indexOf(k);
      return n >= 0 ? HURUF.charAt(n) : k;
    }).sort().join(', ');
  }

  function teksJawaban(soal, r) {
    if (!r || !r.jawaban || !r.jawaban.length) return '-';
    if (soal.tipe === 'isian') return String(r.jawaban[0]);
    return hurufTampil(soal, r.jawaban) || '-';
  }

  var LABEL_STATUS = { benar: 'Benar', salah: 'Salah', kosong: 'Kosong' };

  function baris(label, nilai) {
    return el('div', { class: 'hasil-baris' }, el('dt', null, label), el('dd', null, nilai || '-'));
  }

  function bangunHasil(h, sesi) {
    var daftar = sesi.soal;
    var perId = {};
    h.rincian.forEach(function (r) { perId[r.id] = r; });
    var adaKunci = h.tampilKunci === true;

    var kop = el('div', { class: 'hasil-kop' },
      el('div', { class: 'hasil-logo' }, Array.prototype.map.call(document.querySelectorAll('.header-logo img'), function (g) {
        return el('img', { src: g.src, alt: g.alt, crossOrigin: 'anonymous' });
      })),
      el('div', null, el('strong', null, 'Try Out OMI 2026'), el('div', { class: 'redup' }, 'Dibuat oleh Genio Institute Yogyakarta')));

    var kepalaTabel = el('tr', null, el('th', null, 'No'), el('th', null, 'Jawaban Anda'),
      adaKunci ? el('th', { class: 'no-pdf' }, 'Kunci') : null, el('th', null, 'Hasil'));
    var badan = el('tbody');
    daftar.forEach(function (soal, i) {
      var r = perId[soal.id];
      var status = r ? r.status : 'kosong';
      var sel = el('td', null, el('span', { class: 'status-' + status }, LABEL_STATUS[status]));
      var jawab = el('td', { dir: 'auto' }, teksJawaban(soal, r));
      var kunci = adaKunci ? el('td', { class: 'no-pdf' }, r && r.kunci && soal.tipe !== 'isian' ? hurufTampil(soal, r.kunci) : '-') : null;
      badan.appendChild(el('tr', null, el('td', null, String(i + 1)), jawab, kunci, sel));
    });

    var cetak = el('div', { id: 'hasilCetak', class: 'hasil' },
      kop,
      el('h1', null, 'Hasil ujian'),
      el('p', { class: 'hasil-ujian' }, el('strong', null, h.ujian.nama), el('br'),
        [h.ujian.jenjang, h.ujian.mapel, h.ujian.sesi].filter(Boolean).join(' · '), el('br'), formatTanggal(h.selesaiAt)),
      el('div', { class: 'hasil-atas' },
        el('dl', { class: 'hasil-identitas' }, baris('Nama', h.nama), baris('Nomor peserta', h.nomor), baris('Kelas', h.kelas), baris('Sekolah', h.sekolah)),
        el('div', { class: 'hasil-nilai' }, el('div', { class: 'redup' }, 'Nilai'), el('div', { class: 'hasil-skor' }, String(h.skor)))),
      el('div', { class: 'hasil-angka' },
        el('div', null, el('div', { class: 'redup' }, 'Benar'), el('strong', null, String(h.benar))),
        el('div', null, el('div', { class: 'redup' }, 'Salah'), el('strong', null, String(h.salah))),
        el('div', null, el('div', { class: 'redup' }, 'Kosong'), el('strong', null, String(h.kosong))),
        el('div', null, el('div', { class: 'redup' }, 'Waktu pengerjaan'), el('strong', null, formatDurasi(h.durasi)))),
      el('div', { class: 'tabel-gulir' }, el('table', { class: 'tabel hasil-tabel' }, el('thead', null, kepalaTabel), badan)));
    return cetak;
  }

  function namaBerkas(h) {
    var aman = function (t) { return String(t || '').trim().replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, ''); };
    return 'Hasil_' + (aman(h.nama) || 'Peserta') + '_' + (aman(h.ujian.nama) || 'Ujian') + '.pdf';
  }

  function unduhPdf(h, cetak, tombol) {
    if (!window.html2pdf) { window.toast('Pustaka PDF tidak termuat. Gunakan tombol Cetak.', true); return; }
    tombol.disabled = true;
    var gudang = el('div', { class: 'pdf-gudang' });
    var salinan = cetak.cloneNode(true);
    salinan.querySelectorAll('.no-pdf').forEach(function (x) { x.remove(); });
    gudang.appendChild(salinan);
    document.body.appendChild(gudang);
    var pilihan = {
      margin: 10, filename: namaBerkas(h), image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr'] }
    };
    var siap = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    siap.then(function () { return window.html2pdf().set(pilihan).from(salinan).save(); })
      .catch(function () { window.toast('PDF gagal dibuat. Coba tombol Cetak.', true); })
      .then(function () { gudang.remove(); tombol.disabled = false; });
  }

  window.App.tampilHasil = function (h, sesi) {
    var s = document.querySelector('[data-view="hasil"]');
    window.showView('hasil');
    s.textContent = '';
    var cetak = bangunHasil(h, sesi);
    var tbPdf = el('button', { type: 'button', class: 'btn btn-utama', onclick: function () { unduhPdf(h, cetak, tbPdf); } }, 'Download PDF');
    s.appendChild(cetak);
    s.appendChild(el('div', { class: 'hasil-aksi no-print' }, tbPdf,
      el('button', { type: 'button', class: 'btn', onclick: function () { window.print(); } }, 'Cetak'),
      el('button', { type: 'button', class: 'btn btn-teks', onclick: muatBeranda }, 'Kembali ke beranda')));
  };

  window.App.tampilAwal = muatBeranda;
  muatBeranda();
})();
</script>
