<script>
(function () {
  var KUNCI_SESI = 'cbt_sesi_v1';
  var ATURAN_NILAI = [
    'Pilihan ganda: benar jika pilihan sama dengan kunci.',
    'Pilihan ganda kompleks: benar hanya jika semua pilihan yang Anda centang sama persis dengan kunci.',
    'Isian singkat: benar jika cocok dengan salah satu jawaban yang diterima. Huruf besar dan kecil dianggap sama, koma dan titik desimal dianggap sama.',
    'Soal yang tidak dijawab tidak dihitung salah. Jawaban salah tidak mengurangi nilai.',
    'Nilai = jumlah bobot soal benar dibagi jumlah bobot seluruh soal, dikali 100.'
  ];
  var TATA_TERTIB = [
    'Peserta tidak boleh digantikan orang lain atau menerima bantuan.',
    'Peserta tidak boleh keluar ruangan tanpa izin pengawas.',
    'Peserta tidak boleh memakai alat bantu seperti alat komunikasi atau kalkulator, dan tidak boleh membawa buku, kamus, catatan, atau tabel, kecuali pengawas mengizinkan.',
    'Waktu berjalan di server dan tidak berhenti walau halaman ditutup. Jawaban terkirim otomatis saat waktu habis.',
    'Setelah jawaban dikirim, jawaban tidak dapat diubah.'
  ];

  function rincianTipe(u) {
    var bagian = [];
    if (u.n_pg) bagian.push(u.n_pg + ' pilihan ganda');
    if (u.n_pgk) bagian.push(u.n_pgk + ' pilihan ganda kompleks');
    if (u.n_isian) bagian.push(u.n_isian + ' isian singkat');
    return bagian.join(', ');
  }

  // ---------- halaman utama ----------

  var daftarBeranda = null;      // daftar terakhir yang diketahui; ditampilkan dulu, lalu disegarkan di belakang layar
  var terakhirSegar = 0;
  var filterAktif = 'semua';
  var halaman = null;            // bagian halaman yang tetap (hero, tentang, aturan, footer)
  var pengamat = null;

  function ikonTeks(nama, teks) {
    return el('span', null, window.ikon(nama, 15), teks);
  }

  function ikonMapel(mapel) {
    var m = String(mapel || '').toLowerCase();
    if (m.indexOf('matemat') >= 0) return 'hitung';
    if (m.indexOf('biolog') >= 0 || m.indexOf('ipa') >= 0) return 'daun';
    if (m.indexOf('kimia') >= 0) return 'labu';
    if (m.indexOf('fisika') >= 0) return 'atom';
    if (m.indexOf('ips') >= 0 || m.indexOf('geograf') >= 0 || m.indexOf('ekonomi') >= 0) return 'bumi';
    return 'buku';
  }

  function kartuUjian(u, n) {
    var chip = function (t) { return el('span', { class: 'chip-info' }, t); };
    var rincian = [chip(u.jumlah_soal + ' soal')];
    if (u.n_pg) rincian.push(chip(u.n_pg + ' PG'));
    if (u.n_pgk) rincian.push(chip(u.n_pgk + ' PG kompleks'));
    if (u.n_isian) rincian.push(chip(u.n_isian + ' isian'));
    return el('button', { type: 'button', class: 'kontainer', style: '--n:' + Math.min(n, 8), onclick: function () { langkah1(u, {}); } },
      el('span', { class: 'kontainer-kepala' },
        el('span', { class: 'kontainer-ikon' }, window.ikon(ikonMapel(u.mapel), 22)),
        el('span', { class: 'kontainer-judul' },
          el('strong', { class: 'kontainer-nama' }, u.nama),
          el('span', { class: 'kontainer-sub' }, [u.jenjang, u.mapel, u.sesi].filter(Boolean).join(' \u00b7 ')))),
      el('span', { class: 'kontainer-chip' }, rincian),
      el('span', { class: 'kontainer-meta' },
        ikonTeks('jam', u.durasi_menit + ' menit'),
        el('span', { class: 'kontainer-pilih' }, 'Mulai ujian')));
  }

  function kerangkaKartu() {
    return el('div', { class: 'kontainer kerangka-kartu', 'aria-hidden': 'true' },
      el('div', { class: 'kerangka pendek' }), el('div', { class: 'kerangka sedang tebal' }), el('div', { class: 'kerangka' }),
      el('div', { class: 'kerangka sedang', style: 'margin-top:12px' }));
  }

  function sesiTersimpan() {
    var d = window.bacaLokal(KUNCI_SESI);
    if (!d || !d.sesiId || !d.akhirMs) return null;
    if (d.akhirMs - (Date.now() + (d.offset || 0)) <= 0) return null;
    return d;
  }

  function kotakLanjut() {
    var d = sesiTersimpan();
    if (!d) return null;
    return el('div', { class: 'lanjut-kotak' },
      el('div', null, el('strong', null, 'Lanjutkan ujian'), el('div', { class: 'redup' }, (d.ujianNama || 'Ujian') + ' atas nama ' + (d.peserta && d.peserta.nama || ''))),
      el('button', { type: 'button', class: 'btn btn-utama', onclick: function () { mulai(d.ujianId, d.token, d.peserta || {}); } }, 'Lanjutkan'));
  }

  function gulirKe(id) {
    var e = document.getElementById(id);
    if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.header-menu [data-tuju]'), function (b) {
    b.addEventListener('click', function () { gulirKe(b.getAttribute('data-tuju')); });
  });

  function amatiMuncul(akar) {
    var daftar = akar.querySelectorAll('.muncul:not(.terlihat)');
    if (!('IntersectionObserver' in window)) { daftar.forEach(function (e) { e.classList.add('terlihat'); }); return; }
    if (!pengamat) {
      pengamat = new IntersectionObserver(function (masuk) {
        masuk.forEach(function (m) { if (m.isIntersecting) { m.target.classList.add('terlihat'); pengamat.unobserve(m.target); } });
      }, { rootMargin: '0px 0px -8% 0px' });
    }
    daftar.forEach(function (e) { pengamat.observe(e); });
  }

  function daftarJenjang(daftar) {
    var peta = {}, urut = [];
    daftar.forEach(function (u) {
      var k = u.jenjang.toLowerCase();
      if (!peta[k]) { peta[k] = { nama: u.jenjang, jumlah: 0 }; urut.push(k); }
      peta[k].jumlah++;
    });
    return urut.map(function (k) { return { kunci: k, nama: peta[k].nama, jumlah: peta[k].jumlah }; });
  }

  function gambarDaftar() {
    if (!halaman) return;
    var daftar = daftarBeranda || [];
    var slot = halaman.daftar, filter = halaman.filter;
    halaman.lanjut.textContent = '';
    var lanjut = kotakLanjut();
    if (lanjut) halaman.lanjut.appendChild(lanjut);

    var jenjang = daftarJenjang(daftar);
    if (filterAktif !== 'semua' && !jenjang.some(function (j) { return j.kunci === filterAktif; })) filterAktif = 'semua';
    filter.textContent = '';
    filter.hidden = jenjang.length < 2;
    [{ kunci: 'semua', nama: 'Semua', jumlah: daftar.length }].concat(jenjang).forEach(function (j) {
      filter.appendChild(el('button', { type: 'button', class: 'chip', role: 'tab', 'aria-selected': j.kunci === filterAktif ? 'true' : 'false', onclick: function () {
        filterAktif = j.kunci; gambarDaftar();
      } }, j.nama, el('small', null, String(j.jumlah))));
    });

    slot.textContent = '';
    var tampil = daftar.filter(function (u) { return filterAktif === 'semua' || u.jenjang.toLowerCase() === filterAktif; });
    if (!tampil.length) {
      slot.appendChild(el('div', { class: 'kosong-daftar' },
        el('strong', null, daftar.length ? 'Tidak ada ujian untuk jenjang ini' : 'Belum ada ujian yang dibuka'),
        daftar.length ? 'Pilih jenjang lain di atas.' : 'Hubungi pengawas atau admin untuk menanyakan jadwal ujian.'));
      return;
    }
    tampil.forEach(function (u, n) { slot.appendChild(kartuUjian(u, n)); });
  }

  function bangunHalaman() {
    var s = document.querySelector('[data-view="beranda"]');
    document.documentElement.classList.add('js');
    s.textContent = '';

    // hero: foto latar opsional (hero.jpg di bucket aset); bila tidak ada, tampil hijau polos
    var aksi = el('div', { class: 'hero-aksi' },
      el('button', { type: 'button', class: 'btn btn-hero', onclick: function () { gulirKe('ujian'); } }, 'Pilih ujian'),
      el('button', { type: 'button', class: 'btn btn-hero-garis', onclick: function () { gulirKe('tentang'); } }, 'Pelajari OMI'));
    var hero = el('section', { class: 'hero', id: 'atas' }, el('div', { class: 'isi' },
      el('p', { class: 'eyebrow' }, 'Try Out OMI 2026'),
      el('h1', null, 'Berlatih untuk Olimpiade Madrasah Indonesia'),
      el('p', { class: 'hero-sub' }, 'OMI adalah ajang sains madrasah dari Kemenag. Kerjakan simulasinya dengan tampilan dan aturan seperti ujian sesungguhnya.'),
      aksi));
    var logoOmi = document.querySelector('.header-logo img[alt^="Olimpiade"]');
    if (logoOmi && /logo-omi\.png/.test(logoOmi.src)) hero.style.setProperty('--foto', 'url("' + logoOmi.src.replace('logo-omi.png', 'hero.jpg') + '")');
    var langkahData = [['daftar', 'Pilih ujian', 'Sesuai jenjang dan mapel'], ['kunciToken', 'Isi data dan token', 'Token dari pengawas'], ['selesai', 'Kerjakan dan lihat hasil', 'Nilai langsung keluar']];
    var langkahKartu = el('div', { class: 'isi langkah-bungkus' }, el('div', { class: 'langkah' }, langkahData.map(function (l) {
      return el('div', { class: 'langkah-item' }, el('span', { class: 'langkah-ikon' }, window.ikon(l[0], 20)), el('div', null, el('strong', null, l[1]), el('span', null, l[2])));
    })));

    // daftar ujian
    halaman = { lanjut: el('div'), filter: el('div', { class: 'filter', role: 'tablist', 'aria-label': 'Jenjang' }),
      daftar: el('div', { class: 'grid-ujian', 'aria-live': 'polite' }) };
    var ujian = el('section', { class: 'pita', id: 'ujian' }, el('div', { class: 'isi' },
      el('div', { class: 'judul-bagian' }, el('h2', null, 'Pilih ujian'), el('p', null, 'Pilih sesuai jenjang dan mata pelajaran Anda, lalu masukkan token dari pengawas.')),
      halaman.lanjut, halaman.filter, halaman.daftar));

    // tentang OMI
    var tentang = el('section', { class: 'pita muncul', id: 'tentang' }, el('div', { class: 'isi' },
      el('div', { class: 'tentang' },
        el('div', null,
          el('div', { class: 'judul-bagian' }, el('h2', null, 'Apa itu OMI?')),
          el('p', null, 'Olimpiade Madrasah Indonesia diselenggarakan Direktorat Jenderal Pendidikan Islam, Kementerian Agama, sebagai instrumen pembinaan talenta madrasah di bidang sains dan riset. OMI tidak hanya menjadi ajang kompetisi, tetapi juga wahana untuk mengidentifikasi, membina, dan mengakselerasi talenta melalui budaya riset, berpikir kritis, kreativitas, dan inovasi.'),
          el('p', { class: 'tema' }, 'Islam, Sains, dan Ekoteologi: Menumbuhkan Talenta serta Menggerakkan Inovasi Madrasah untuk Indonesia Maju.')),
        el('dl', { class: 'fakta' },
          [['Penyelenggara', 'Ditjen Pendidikan Islam, Kementerian Agama'], ['Dasar', 'Keputusan Dirjen Pendidikan Islam Nomor 6843 Tahun 2026'], ['Bidang', 'Sains dan Riset'], ['Peserta sains', 'Siswa kelas V–VI, VII–IX, dan X–XII, satu bidang per peserta'], ['Tahap', 'Satuan pendidikan, kabupaten/kota, provinsi, nasional']].map(function (r) {
            return el('div', null, el('dt', null, r[0]), el('dd', null, r[1]));
          }))),
      el('div', { class: 'cabang' },
        [['MI/SD/sederajat', 'Kelas V–VI', ['Matematika Terintegrasi', 'IPAS Terintegrasi']],
         ['MTs/SMP/sederajat', 'Kelas VII–IX', ['Matematika Terintegrasi', 'IPA Terintegrasi', 'IPS Terintegrasi']],
         ['MA/SMA/sederajat', 'Kelas X–XII', ['Matematika Terintegrasi', 'Biologi Terintegrasi', 'Fisika Terintegrasi', 'Kimia Terintegrasi', 'Ekonomi Terintegrasi', 'Geografi Terintegrasi']]].map(function (c) {
          return el('div', null, el('h3', null, c[0]), el('p', { class: 'redup' }, c[1]), el('ul', null, c[2].map(function (x) { return el('li', null, x); })));
        }))));

    // aturan dan penilaian
    var tahap = [['Kabupaten/Kota', '25 soal pilihan ganda', '7–8 September 2026'],
      ['Provinsi', '20 pilihan ganda dan 5 pilihan ganda kompleks', '5–6 Oktober 2026'],
      ['Nasional', '10 isian singkat dan 5 esai', '10–11 November 2026']];
    var siap = ['Hadir 30 menit sebelum pelaksanaan dimulai.', 'Membawa kartu peserta OMI.', 'Berpakaian seragam madrasah dengan rapi.', 'Menyiapkan alat tulis sendiri: ballpoint, pensil, kertas polos, penghapus.'];
    var larang = ['Digantikan oleh orang lain.', 'Menerima bantuan dari orang lain.', 'Keluar ruangan tanpa izin pengawas.', 'Memakai alat bantu seperti alat komunikasi dan kalkulator.', 'Membawa buku, kamus, catatan, atau tabel.'];
    function daftarIkon(items, ikonNama, kelas) {
      return el('ul', { class: 'daftar-centang' + (kelas ? ' ' + kelas : '') }, items.map(function (t) {
        return el('li', null, window.ikon(ikonNama, 16), el('span', null, t));
      }));
    }
    var aturan = el('section', { class: 'pita muncul', id: 'aturan' }, el('div', { class: 'isi' },
      el('div', { class: 'aturan' },
        el('div', null,
          el('div', { class: 'judul-bagian' }, el('h2', null, 'Bentuk tes dan jadwal'), el('p', null, 'Format resmi bidang sains menurut Petunjuk Teknis OMI 2026.')),
          el('div', { class: 'tahap' }, tahap.map(function (t) {
            return el('div', { class: 'tahap-baris' }, el('strong', null, t[0]), el('span', null, t[1]), el('span', { class: 'tgl' }, t[2]));
          })),
          el('p', { class: 'catatan-kecil' }, 'Simulasi ini memakai pilihan ganda, pilihan ganda kompleks, dan isian singkat. Durasi pengerjaan 120 menit untuk semua jenjang.')),
        el('div', null,
          el('div', { class: 'judul-bagian' }, el('h2', null, 'Penilaian')),
          el('ol', { class: 'urutan' }, [
            'Nilai ditentukan dari jawaban benar. Soal kosong tidak dihitung salah dan jawaban salah tidak mengurangi nilai.',
            'Bila nilai sama, peringkat ditentukan oleh jumlah benar terbanyak.',
            'Berikutnya jumlah salah tersedikit.',
            'Terakhir waktu penyelesaian tercepat.'].map(function (t) { return el('li', null, el('span', null, t)); })))),
      el('div', { class: 'tertib' },
        el('div', null, el('h3', null, 'Yang perlu disiapkan peserta'), daftarIkon(siap, 'centang')),
        el('div', null, el('h3', null, 'Larangan bagi peserta'), daftarIkon(larang, 'silang', 'larangan')))));

    // footer
    var logoFooter = el('div', { class: 'footer-logo' });
    document.querySelectorAll('.header-logo img').forEach(function (g) { logoFooter.appendChild(el('img', { src: g.src, alt: g.alt })); });
    var footer = el('footer', { class: 'footer-situs' }, el('div', { class: 'isi' }, logoFooter,
      el('div', null,
        el('p', null, el('strong', null, 'Dibuat oleh Genio Institute Yogyakarta.')),
        el('p', null, 'Situs ini adalah simulasi (try out) untuk berlatih dan bukan sistem resmi panitia OMI. Rujukan: Keputusan Direktur Jenderal Pendidikan Islam Nomor 6843 Tahun 2026 tentang Petunjuk Teknis Pelaksanaan OMI Tahun 2026.'),
        el('p', null, 'Informasi resmi: ', el('a', { href: 'https://omi.kemenag.go.id', target: '_blank', rel: 'noopener noreferrer' }, 'omi.kemenag.go.id')))));

    [hero, langkahKartu, ujian, tentang, aturan, footer].forEach(function (b) { s.appendChild(b); });
    amatiMuncul(s);
  }

  function segarkanBeranda() {
    if (Date.now() - terakhirSegar < 15000) return Promise.resolve();
    return window.call('apiBeranda').then(function (d) {
      terakhirSegar = Date.now();
      if (JSON.stringify(d) !== JSON.stringify(daftarBeranda)) { daftarBeranda = d; gambarDaftar(); }
    });
  }

  function muatBeranda() {
    window.showView('beranda');
    if (!halaman) bangunHalaman();
    if (daftarBeranda === null && window.AWAL && window.AWAL.beranda) {
      // Daftar sudah ikut dalam halaman pertama: tampil seketika tanpa menunggu server.
      daftarBeranda = window.AWAL.beranda; terakhirSegar = Date.now(); window.AWAL = null;
    }
    if (daftarBeranda === null) {
      halaman.daftar.textContent = '';
      for (var i = 0; i < 3; i++) halaman.daftar.appendChild(kerangkaKartu());
      halaman.lanjut.textContent = '';
    } else {
      gambarDaftar();
    }
    segarkanBeranda().catch(function (e) {
      if (daftarBeranda !== null) return;
      halaman.daftar.textContent = '';
      halaman.daftar.appendChild(el('div', { class: 'kosong-daftar' }, el('strong', null, 'Daftar ujian belum bisa dimuat'), e.message,
        el('div', { style: 'margin-top:12px' }, el('button', { type: 'button', class: 'btn', onclick: function () { terakhirSegar = 0; muatBeranda(); } }, 'Coba lagi'))));
    });
  }
  window.App.muatBeranda = muatBeranda;

  // ---------- popup langkah 1 dan 2 ----------

  function langkah1(u, isi) {
    var f = {};
    function kolom(kunci, label, wajib, extra) {
      f[kunci] = el('input', Object.assign({ type: 'text', value: isi[kunci] || '', maxLength: kunci === 'nama' ? 100 : 100, autocomplete: 'off' }, extra || {}));
      return el('label', { class: 'field' }, el('span', null, label + (wajib ? ' *' : '')), f[kunci]);
    }
    var galatNama = el('div', { class: 'galat', role: 'alert' });
    var galatToken = el('div', { class: 'galat', role: 'alert' });
    var badan = el('div', null,
      el('p', { class: 'redup' }, u.mapel + ' · ' + u.nama),
      kolom('nama', 'Nama lengkap', true), galatNama,
      el('div', { class: 'grid2' }, kolom('nomor', 'Nomor peserta', false), kolom('kelas', 'Kelas', false)),
      kolom('sekolah', 'Sekolah', false),
      kolom('token', 'Token', true, { autocapitalize: 'characters', spellcheck: false }), galatToken);
    f.token.addEventListener('input', function () { f.token.value = f.token.value.toUpperCase(); });

    function ambil() {
      return { nama: f.nama.value.trim(), nomor: f.nomor.value.trim(), kelas: f.kelas.value.trim(), sekolah: f.sekolah.value.trim(), token: f.token.value.trim() };
    }
    function lanjut(modal) {
      var d = ambil();
      galatNama.textContent = ''; galatToken.textContent = '';
      if (!d.nama) { galatNama.textContent = 'Isi nama lengkap Anda.'; f.nama.focus(); return false; }
      if (!d.token) { galatToken.textContent = 'Isi token dari pengawas.'; f.token.focus(); return false; }
      window.sibuk(tombol, window.call('apiCekToken', u.id, d.token).then(function (h) {
        modal.close();
        langkah2(h.ujian, d);
      }).catch(function (e) {
        galatToken.textContent = e.message;
        f.token.select();
      }));
      return false;
    }
    var modal = window.openModal({
      judul: 'Data peserta', isi: badan, tutupDiLuar: false,
      tombol: [{ teks: 'Batal' }, { teks: 'Lanjut', utama: true, aksi: lanjut }]
    });
    var tombol = modal.el.querySelector('.btn-utama');
    modal.el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); lanjut(modal); } });
  }

  function langkah2(u, d) {
    function daftar(judul, butir) {
      return el('div', null, el('h3', null, judul), el('ul', { class: 'daftar-info' }, butir.map(function (b) { return el('li', null, b); })));
    }
    var badan = el('div', null,
      el('dl', { class: 'info-grid' },
        el('div', null, el('dt', null, 'Ujian'), el('dd', null, u.nama)),
        el('div', null, el('dt', null, 'Jenjang dan mata pelajaran'), el('dd', null, u.jenjang + ' · ' + u.mapel + (u.sesi ? ' · ' + u.sesi : ''))),
        el('div', null, el('dt', null, 'Jumlah soal'), el('dd', null, u.jumlah_soal + ' soal: ' + rincianTipe(u))),
        el('div', null, el('dt', null, 'Durasi'), el('dd', null, u.durasi_menit + ' menit'))),
      u.catatan && String(u.catatan).trim() ? el('div', null, el('h3', null, 'Catatan dari pengawas'), el('p', { class: 'catatan' }, String(u.catatan).trim())) : null,
      daftar('Aturan penilaian', ATURAN_NILAI),
      daftar('Tata tertib', TATA_TERTIB),
      el('p', { class: 'redup' }, 'Waktu mulai dihitung saat Anda menekan "Mulai ujian".'));
    window.openModal({
      judul: 'Sebelum mulai', isi: badan, lebar: true, tutupDiLuar: false,
      tombol: [
        { teks: 'Kembali', aksi: function () { setTimeout(function () { langkah1(u, d); }, 0); } },
        { teks: 'Mulai ujian', utama: true, aksi: function () { mulai(u.id, d.token, { nama: d.nama, nomor: d.nomor, kelas: d.kelas, sekolah: d.sekolah }); } }
      ]
    });
  }

  function mulai(ujianId, token, peserta) {
    window.App.mulaiUjian(ujianId, token, peserta);
  }

  // ---------- mengerjakan ujian ----------

  var HURUF = 'ABCDEFGH';
  var LABEL_TIPE = { pg: 'Pilihan ganda', pgk: 'Pilihan ganda kompleks', isian: 'Isian singkat' };
  var INSTRUKSI = {
    pg: 'Pilih satu jawaban benar!',
    pgk: 'Pilih satu atau lebih jawaban benar!',
    isian: 'Ketik jawaban singkat Anda!'
  };
  var INTERVAL_SINKRON_MS = 3 * 60 * 1000;
  var BATAS_MEPET_MS = 5 * 60 * 1000;
  var U = null;
  var pengatur = { timer: null, sinkron: null };

  function layarMuat(judul, langkah) {
    var s = document.querySelector('[data-view="ujian"]');
    window.showView('ujian');
    s.textContent = '';
    s.appendChild(window.muatan(judul, langkah));
    return s;
  }

  function layarPesan(teks) {
    var s = document.querySelector('[data-view="ujian"]');

    });
    return el('div', { id: 'hasilCetak', class: 'hasil' },
      el('div', { class: 'hasil-selesai' }, window.ikon('centang'), 'Jawaban Anda sudah terkirim dan dinilai.'),
      el('div', { class: 'hasil-atas' },
        el('div', null, el('div', { class: 'redup' }, 'Hasil ujian'), el('h1', null, h.ujian.nama),
          el('p', { class: 'hasil-ujian' }, infoUjian(h)), identitas(h)),
        el('div', { class: 'hasil-nilai' }, el('div', { class: 'redup' }, 'Nilai'), skorTampil(h.skor))),
      angkaRingkas(h),
      el('h2', { class: 'hasil-judul' }, 'Jawaban per soal'),
      el('div', { class: 'tabel-gulir' }, el('table', { class: 'tabel hasil-tabel' }, el('thead', null, kepalaTabel), badan)));
  }

  // Dokumen PDF terpisah dari tampilan layar: satu halaman, tabel dua kolom, tanpa kunci.
  function bangunPdf(h, sesi) {
    var semua = barisJawaban(sesi, h);
    var separuh = Math.ceil(semua.length / 2);
    var kepala = function () { return [el('th', null, 'No'), el('th', null, 'Jawaban Anda'), el('th', null, 'Hasil')]; };
    var sel = function (x) {
      return [el('td', null, String(x.no)), el('td', { dir: 'auto' }, teksJawaban(x.soal, x.r)), el('td', null, LABEL_STATUS[x.status])];
    };
    var badan = el('tbody');
    for (var i = 0; i < separuh; i++) {
      var kiri = sel(semua[i]);
      var kanan = semua[i + separuh] ? sel(semua[i + separuh]) : [el('td'), el('td'), el('td')];
      kanan[0].classList.add('pisah');
      badan.appendChild(el('tr', null, kiri, kanan));
    }
    var kepalaBaris = el('tr', null, kepala(), kepala());
    kepalaBaris.children[3].classList.add('pisah');
    return el('div', { class: 'hasil hasil-pdf' },
      el('div', { class: 'hasil-kop' }, logoKop(),
        el('div', null, el('strong', null, 'Laporan Hasil Try Out OMI 2026'), el('div', { class: 'redup' }, 'Dibuat oleh Genio Institute Yogyakarta'))),
      el('div', { class: 'hasil-atas' },
        el('div', null, el('h1', null, h.ujian.nama), el('p', { class: 'hasil-ujian' }, infoUjian(h)), identitas(h)),
        el('div', { class: 'hasil-kotak' }, el('div', { class: 'redup' }, 'Nilai'), skorTampil(h.skor))),
      angkaRingkas(h),
      el('table', { class: 'tabel hasil-tabel' }, el('thead', null, kepalaBaris), badan),
      el('div', { class: 'hasil-kaki' }, 'Dokumen ini dibuat otomatis oleh sistem Try Out OMI 2026.'));
  }

  function namaBerkas(h) {
    var aman = function (t) { return String(t || '').trim().replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, ''); };
    return 'Hasil_' + (aman(h.nama) || 'Peserta') + '_' + (aman(h.ujian.nama) || 'Ujian') + '.pdf';
  }

  function unduhPdf(h, sesi, tombol) {
    tombol.disabled = true; tombol.classList.add('sibuk');
    window.pastikanPdf().then(function () { buatPdf(h, sesi, tombol); }).catch(function () {
      window.toast('Pustaka PDF tidak termuat. Gunakan tombol Cetak.', true);
      tombol.disabled = false; tombol.classList.remove('sibuk');
    });
  }

  function buatPdf(h, sesi, tombol) {
    var gudang = el('div', { class: 'pdf-gudang' });
    var salinan = bangunPdf(h, sesi);
    gudang.appendChild(salinan);
    document.body.appendChild(gudang);
    var pilihan = {
      margin: 10, filename: namaBerkas(h), image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr'] }
    };
    var siap = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    siap.then(function () { return window.html2pdf().set(pilihan).from(salinan).save(); })
      .catch(function () { window.toast('PDF gagal dibuat. Coba tombol Cetak.', true); })
      .then(function () { gudang.remove(); tombol.disabled = false; tombol.classList.remove('sibuk'); });
  }

  window.App.tampilHasil = function (h, sesi) {
    var s = document.querySelector('[data-view="hasil"]');
    window.showView('hasil');
    s.textContent = '';
    var cetak = bangunHasil(h, sesi);
    var tbPdf = el('button', { type: 'button', class: 'btn btn-utama', onclick: function () { unduhPdf(h, sesi, tbPdf); } }, 'Download PDF');
    window.siapkanPdfNanti();
    s.appendChild(cetak);
    s.appendChild(el('div', { class: 'hasil-aksi no-print' }, tbPdf,
      el('button', { type: 'button', class: 'btn', onclick: function () { window.print(); } }, 'Cetak'),
      el('button', { type: 'button', class: 'btn btn-teks', onclick: muatBeranda }, 'Kembali ke beranda')));
  };

  window.App.tampilAwal = muatBeranda;
  muatBeranda();
})();
</script>
