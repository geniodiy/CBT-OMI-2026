<script>
(function () {
  var KUNCI_TOKEN = 'cbt_admin_v1';
  var tokenAdmin = null;
  var daftarUjian = [];

  function bacaTokenTersimpan() {
    try { return sessionStorage.getItem(KUNCI_TOKEN); } catch (e) { return null; }
  }
  function simpanToken(t) {
    tokenAdmin = t;
    try { if (t) sessionStorage.setItem(KUNCI_TOKEN, t); else sessionStorage.removeItem(KUNCI_TOKEN); } catch (e) { /* tanpa storage: sesi hilang saat refresh */ }
  }

  function keBeranda() {
    document.getElementById('btnAdmin').textContent = 'Login admin';
    if (window.App.muatBeranda) window.App.muatBeranda(); else window.showView('beranda');
  }

  function sesiHabis(pesan) {
    simpanToken(null);
    keBeranda();
    window.toast(String(pesan).replace(/^SESI_ADMIN:\s*/, 'Sesi admin berakhir, ') + '.', true);
  }
  window.App.onSesiAdminHabis = sesiHabis;

  var popoverLogin = null;

  function tutupLogin() {
    if (!popoverLogin) return;
    var p = popoverLogin; popoverLogin = null;
    document.removeEventListener('mousedown', luarLogin, true);
    document.removeEventListener('keydown', escLogin, true);
    window.removeEventListener('resize', tutupLogin);
    p.remove();
  }
  function luarLogin(e) {
    if (popoverLogin && !popoverLogin.contains(e.target) && e.target !== document.getElementById('btnAdmin')) tutupLogin();
  }
  function escLogin(e) { if (e.key === 'Escape') tutupLogin(); }

  /** Kotak kecil di dekat tombol "Login admin": hanya kata sandi. */
  function bukaLogin() {
    if (popoverLogin) { tutupLogin(); return; }
    var btn = document.getElementById('btnAdmin');
    var input = el('input', { type: 'password', autocomplete: 'current-password', 'aria-label': 'Kata sandi admin', placeholder: 'Kata sandi' });
    var masuk = el('button', { class: 'btn btn-utama', type: 'button' }, 'Masuk');
    var galat = el('div', { class: 'galat', role: 'alert' });
    function kirim() {
      if (!input.value) { galat.textContent = 'Isi kata sandi.'; input.focus(); return; }
      galat.textContent = '';
      window.sibuk(masuk, window.call('adminLogin', input.value).then(function (h) {
        simpanToken(h.tok);
        daftarUjian = h.ujian || [];
        tutupLogin();
        tampilAdmin();
      }).catch(function (e) {
        galat.textContent = e.message;
        input.select();
      }));
    }
    masuk.addEventListener('click', kirim);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); kirim(); } });
    var pop = el('div', { class: 'popover', role: 'dialog', 'aria-label': 'Login admin' },
      el('h3', null, 'Login admin'),
      el('p', null, 'Masukkan kata sandi admin.'),
      el('div', { class: 'popover-baris' }, input, masuk),
      galat);
    var r = btn.getBoundingClientRect();
    pop.style.top = Math.round(r.bottom + 8) + 'px';
    pop.style.right = Math.max(8, Math.round(window.innerWidth - r.right)) + 'px';
    document.body.appendChild(pop);
    popoverLogin = pop;
    document.addEventListener('mousedown', luarLogin, true);
    document.addEventListener('keydown', escLogin, true);
    window.addEventListener('resize', tutupLogin);
    input.focus();
  }

  var tabAktif = 'ujian';
  var ujianTerpilih = null;
  var daftarSoal = [];

  var NAV = [['ujian', 'Ujian', 'ujian'], ['soal', 'Soal', 'bantuan'], ['hasil', 'Hasil', 'hasil']];

  function jumlahNav(t) {
    var n = 0;
    if (t === 'ujian') return daftarUjian.length;
    daftarUjian.forEach(function (u) { n += Number(t === 'soal' ? u.jumlah_soal : u.n_selesai) || 0; });
    return n;
  }

  function tampilAdmin() {
    var s = document.querySelector('[data-view="admin"]');
    s.textContent = '';
    var navEl = el('nav', { class: 'adm-nav', 'aria-label': 'Menu admin' });
    NAV.forEach(function (t) {
      var jml = el('em', { 'data-jml': t[0] }, String(jumlahNav(t[0])));
      navEl.appendChild(el('button', { class: 'adm-nav-btn', type: 'button', 'data-tab': t[0], onclick: function () { pilihTab(t[0]); } },
        window.ikon(t[2], 17), el('span', null, t[1]), jml));
    });
    var logo = document.querySelectorAll('.header-logo img');
    var side = el('aside', { class: 'adm-side' },
      el('div', { class: 'adm-merek' },
        el('div', { class: 'adm-logo' }, Array.prototype.map.call(logo, function (g) { return el('img', { src: g.src, alt: g.alt }); })),
        el('div', { class: 'adm-judul' }, el('strong', null, 'Try Out OMI 2026'), el('span', null, 'Panel admin'))),
      navEl,
      el('div', { class: 'adm-kaki' },
        el('button', { class: 'adm-nav-btn', type: 'button', onclick: keBerandaTetapMasuk }, window.ikon('beranda', 17), el('span', null, 'Lihat beranda')),
        el('button', { class: 'adm-nav-btn adm-keluar', type: 'button', onclick: keluar }, window.ikon('keluar', 17), el('span', null, 'Keluar'))));
    s.appendChild(el('div', { class: 'adm' }, side, el('div', { class: 'adm-isi' }, el('div', { id: 'panelAdmin' }))));
    window.showView('admin');
    document.getElementById('btnAdmin').textContent = 'Panel admin';
    pilihTab(tabAktif);
  }

  function segarkanNav() {
    document.querySelectorAll('.adm-nav-btn em').forEach(function (e) { e.textContent = String(jumlahNav(e.getAttribute('data-jml'))); });
  }

  function keBerandaTetapMasuk() {
    if (window.App.muatBeranda) window.App.muatBeranda(); else window.showView('beranda');
    document.getElementById('btnAdmin').textContent = 'Panel admin';
  }

  function pilihTab(t) {
    tabAktif = t;
    document.querySelectorAll('.adm-nav-btn[data-tab]').forEach(function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-tab') === t ? 'page' : 'false');
    });
    if (t === 'soal') tampilSoalTab();
    else if (t === 'hasil') tampilHasilTab();
    else muatUjian();
  }

  function keluar() {
    var t = tokenAdmin;
    simpanToken(null);
    keBeranda();
    window.call('adminKeluar', t).catch(function () { /* token tetap kedaluwarsa sendiri */ });
  }

  var filterStatus = 'semua', filterJenjang = '', urutan = 'terbaru', cari = '';
  var BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  /** Tampilkan daftar yang sudah ada lebih dulu, lalu segarkan dari server di belakang layar. */
  function muatUjian() {
    var p = document.getElementById('panelAdmin');
    if (daftarUjian.length) gambarUjian();
    else { p.textContent = ''; p.appendChild(el('div', { class: 'kerangka' })); p.appendChild(el('div', { class: 'kerangka' })); }
    window.call('adminUjianList', tokenAdmin).then(function (d) {
      daftarUjian = d;
      segarkanNav();
      if (tabAktif === 'ujian' && !document.querySelector('.modal')) gambarUjian();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      if (!daftarUjian.length) { p.textContent = ''; p.appendChild(el('p', { class: 'kosong' }, e.message)); }
    });
  }

  /** Status gabungan aktif, jadwal, dan waktu sekarang. k: aktif, belum, ditutup, nonaktif. */
  function statusDari(u) {
    var sekarang = Date.now(), b = u.buka_at ? Date.parse(u.buka_at) : NaN, t = u.tutup_at ? Date.parse(u.tutup_at) : NaN;
    if (!u.aktif) return { k: 'nonaktif', teks: 'Nonaktif' };
    if (!isNaN(b) && sekarang < b) return { k: 'belum', teks: 'Belum dibuka' };
    if (!isNaN(t) && sekarang >= t) return { k: 'ditutup', teks: 'Ditutup' };
    return { k: 'aktif', teks: 'Aktif' };
  }

  function tglPendek(iso) {
    var t = new Date(iso);
    return isNaN(t.getTime()) ? '' : t.getDate() + ' ' + BULAN[t.getMonth()];
  }
  function jadwalTeks(u) {
    var b = u.buka_at ? tglPendek(u.buka_at) : '', t = u.tutup_at ? tglPendek(u.tutup_at) : '';
    if (b && t) return b === t ? b : b + ' - ' + t;
    if (b) return 'Buka ' + b;
    if (t) return 'Tutup ' + t;
    return '-';
  }
  function rincianSoal(u) {
    var r = [Number(u.n_pg) || 0, Number(u.n_pgk) || 0, Number(u.n_isian) || 0];
    while (r.length > 1 && r[r.length - 1] === 0) r.pop();
    return r.join('/');
  }

  function gambarUjian() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    var hitung = { semua: daftarUjian.length, aktif: 0, belum: 0, nonaktif: 0, ditutup: 0 };
    daftarUjian.forEach(function (u) { hitung[statusDari(u).k]++; });
    var ringkas = daftarUjian.length + ' ujian, ' + hitung.aktif + ' aktif, ' + hitung.belum + ' terjadwal, ' + hitung.nonaktif + ' nonaktif, ' + hitung.ditutup + ' ditutup';

    p.appendChild(el('div', { class: 'adm-atas' },
      el('h1', null, 'Ujian'),
      el('span', { class: 'redup' }, daftarUjian.length ? ringkas : ''),
      el('button', { class: 'btn btn-utama', type: 'button', onclick: function () { bukaForm(null); } }, window.ikon('tambah', 15), 'Tambah ujian')));
    if (!daftarUjian.length) {
      p.appendChild(el('div', { class: 'adm-tabel' }, el('p', { class: 'kosong' }, 'Belum ada ujian. Klik "Tambah ujian" untuk membuat yang pertama.')));
      return;
    }

    var seg = el('div', { class: 'adm-seg', role: 'group', 'aria-label': 'Saring status' });
    [['semua', 'Semua'], ['aktif', 'Aktif'], ['belum', 'Terjadwal'], ['nonaktif', 'Nonaktif'], ['ditutup', 'Ditutup']].forEach(function (x) {
      seg.appendChild(el('button', { type: 'button', 'aria-pressed': filterStatus === x[0] ? 'true' : 'false', onclick: function () { filterStatus = x[0]; isiTabelUjian(); tandaiSeg(seg); } },
        x[1], el('small', null, String(hitung[x[0]]))));
    });
    var jenjang = daftarUjian.map(function (u) { return u.jenjang; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
    var selJenjang = window.dropdown({ aria: 'Saring jenjang', nilai: jenjang.indexOf(filterJenjang) >= 0 ? filterJenjang : '',
      pilihan: [{ nilai: '', label: 'Semua jenjang', jml: daftarUjian.length }].concat(jenjang.map(function (j) {
        return { nilai: j, label: j, jml: daftarUjian.filter(function (u) { return u.jenjang === j; }).length };
      })) });
    filterJenjang = selJenjang.value;
    selJenjang.addEventListener('change', function () { filterJenjang = selJenjang.value; isiTabelUjian(); });
    var selUrut = window.dropdown({ aria: 'Urutkan', nilai: urutan, awalan: 'Urut: ',
      pilihan: [{ nilai: 'terbaru', label: 'terbaru' }, { nilai: 'nama', label: 'nama' }, { nilai: 'jenjang', label: 'jenjang' }, { nilai: 'peserta', label: 'peserta' }] });
    selUrut.addEventListener('change', function () { urutan = selUrut.value; isiTabelUjian(); });
    var kolomCari = el('input', { type: 'search', placeholder: 'Cari nama, mapel, atau token', 'aria-label': 'Cari ujian', value: cari });
    kolomCari.addEventListener('input', function () { cari = kolomCari.value; isiTabelUjian(); });

    p.appendChild(el('div', { class: 'adm-alat' }, seg, selJenjang, selUrut,
      el('label', { class: 'adm-cari' }, window.ikon('cari', 15), kolomCari)));
    p.appendChild(el('div', { class: 'adm-tabel', id: 'admTabel' }));
    p.appendChild(el('div', { class: 'adm-kaki-tabel', id: 'admKaki' }));
    isiTabelUjian();
  }

  function tandaiSeg(seg) {
    seg.querySelectorAll('button').forEach(function (b, i) {
      b.setAttribute('aria-pressed', ['semua', 'aktif', 'belum', 'nonaktif', 'ditutup'][i] === filterStatus ? 'true' : 'false');
    });
  }

  function isiTabelUjian() {
    var tabel = document.getElementById('admTabel'), kaki = document.getElementById('admKaki');
    if (!tabel) return;
    var kata = cari.trim().toLowerCase();
    var tampil = daftarUjian.filter(function (u) {
      if (filterStatus !== 'semua' && statusDari(u).k !== filterStatus) return false;
      if (filterJenjang && u.jenjang !== filterJenjang) return false;
      return !kata || [u.nama, u.mapel, u.token, u.sesi].join(' ').toLowerCase().indexOf(kata) >= 0;
    });
    if (urutan === 'nama') tampil.sort(function (a, b) { return String(a.nama).localeCompare(b.nama, 'id'); });
    else if (urutan === 'jenjang') tampil.sort(function (a, b) { return String(a.jenjang).localeCompare(b.jenjang, 'id') || String(a.mapel).localeCompare(b.mapel, 'id'); });
    else if (urutan === 'peserta') tampil.sort(function (a, b) { return (Number(b.n_selesai) || 0) - (Number(a.n_selesai) || 0); });
    tabel.textContent = '';
    tabel.appendChild(el('div', { class: 'adm-baris adm-kepala' },
      ['UJIAN', 'JENJANG', 'SOAL (PG/PGK/ISIAN)', 'DURASI', 'TOKEN', 'JADWAL', 'SELESAI', 'STATUS', ''].map(function (t) { return el('span', null, t); })));
    if (!tampil.length) tabel.appendChild(el('p', { class: 'kosong' }, 'Tidak ada ujian yang cocok dengan saringan ini.'));
    tampil.forEach(function (u) { tabel.appendChild(barisUjian(u)); });
    kaki.textContent = '';
    kaki.appendChild(el('span', null, 'Menampilkan ' + tampil.length + ' dari ' + daftarUjian.length + ' ujian'));
    kaki.appendChild(el('span', null, 'Selesai = peserta yang sudah mengirim jawaban. Angka +n = sedang mengerjakan.'));
  }

  function barisUjian(u) {
    var st = statusDari(u);
    var kosong = Number(u.n_gambar_kosong) || 0, jalan = Number(u.n_berjalan) || 0;
    var ikonAksi = function (nama, label, fn, kelas) {
      return el('button', { class: 'adm-ikon' + (kelas ? ' ' + kelas : ''), type: 'button', title: label, 'aria-label': label + ' ' + u.nama, onclick: fn }, window.ikon(nama, 16));
    };
    var token = el('button', { class: 'adm-token', type: 'button', title: 'Salin token', 'aria-label': 'Salin token ' + u.token,
      onclick: function () { salinTeks(u.token, 'Token ' + u.token + ' disalin.'); } }, el('code', null, u.token), window.ikon('salin', 12));
    return el('div', { class: 'adm-baris' },
      el('div', { class: 'adm-nama' },
        el('strong', { title: u.nama }, u.nama),
        el('span', null, u.mapel + (u.sesi ? ', ' + u.sesi : ''),
          kosong ? el('em', null, kosong + ' gambar kosong') : null),
        el('span', { class: 'adm-ringkas' }, u.jenjang + ' | ' + u.jumlah_soal + ' soal | ' + u.durasi_menit + ' menit')),
      el('span', { class: 'adm-jenjang' }, u.jenjang),
      el('span', { class: 'adm-soal' }, el('strong', null, String(u.jumlah_soal)), el('small', null, rincianSoal(u))),
      el('span', { class: 'adm-durasi' }, u.durasi_menit + ' mnt'),
      el('span', { class: 'adm-tk' }, token),
      el('span', { class: 'adm-jadwal' }, jadwalTeks(u)),
      el('span', { class: 'adm-selesai' }, u.n_selesai == null ? '-' : String(u.n_selesai), jalan ? el('small', null, ' +' + jalan) : null),
      el('span', { class: 'adm-st' }, el('span', { class: 'adm-pil adm-pil-' + st.k }, st.teks)),
      el('span', { class: 'adm-aksi' },
        ikonAksi('ubah', 'Ubah', function () { bukaForm(u); }),
        ikonAksi('duplikat', 'Duplikat', function () { duplikatUjian(u); }),
        ikonAksi('hapus', 'Hapus', function () { konfirmasiHapus(u); }, 'adm-ikon-hapus')));
  }

  /** Nilai untuk input datetime-local (jam perangkat) dari ISO. */
  function keInputWaktu(iso) {
    var t = iso ? new Date(iso) : null;
    if (!t || isNaN(t.getTime())) return '';
    var dua = function (n) { return (n < 10 ? '0' : '') + n; };
    return t.getFullYear() + '-' + dua(t.getMonth() + 1) + '-' + dua(t.getDate()) + 'T' + dua(t.getHours()) + ':' + dua(t.getMinutes());
  }
  function dariInputWaktu(v) {
    if (!v) return '';
    var t = new Date(v);
    return isNaN(t.getTime()) ? '' : t.toISOString();
  }

  function duplikatUjian(u) {
    var nama = el('input', { type: 'text', maxLength: 150, value: String(u.nama).slice(0, 138) + ' (salinan)', 'aria-label': 'Nama salinan' });
    var badan = el('div', { class: 'adm-form' },
      el('p', null, 'Ujian ', el('strong', null, u.nama), ' disalin beserta ', el('strong', null, u.jumlah_soal + ' soalnya'), '. Hasil siswa tidak disalin.'),
      el('label', { class: 'field' }, el('span', null, 'Nama salinan'), nama),
      el('div', { class: 'adm-info' }, 'Salinan berstatus nonaktif dan memakai token baru. Aktifkan setelah soalnya diperiksa.'));
    window.openModal({
      judul: 'Duplikat ujian?', isi: badan, tutupDiLuar: false,
      tombol: [
        { teks: 'Batal' },
        { teks: 'Duplikat', utama: true, aksi: function (m) {
          var tb = m.el.querySelector('.btn-utama');
          window.sibuk(tb, window.call('adminUjianDuplikat', tokenAdmin, u.id, nama.value).then(function (b) {
            m.close();
            window.toast('Ujian disalin dengan token ' + b.token + '. Aktifkan bila sudah siap.');
            muatUjian();
          }).catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true); }));
          return false;
        } }
      ]
    });
  }

  function tokenAcak() {
    var abjad = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var b = new Uint32Array(6), hasil = '';
    try { window.crypto.getRandomValues(b); } catch (e) { for (var i = 0; i < 6; i++) b[i] = Math.floor(Math.random() * 4294967296); }
    for (var j = 0; j < 6; j++) hasil += abjad.charAt(b[j] % abjad.length);
    return hasil;
  }

  function bukaForm(u) {
    var baru = !u;
    var d = u || { jenjang: '', durasi_menit: 120, aktif: true, token: tokenAcak() };
    var f = {};
    function isian(kunci, label, tipe, extra) {
      f[kunci] = el('input', Object.assign({ type: tipe || 'text', value: d[kunci] == null ? '' : d[kunci] }, extra || {}));
      return el('label', { class: 'field' }, el('span', null, label), f[kunci]);
    }
    function cek(kunci, label) {
      f[kunci] = el('input', { type: 'checkbox', checked: !!d[kunci] });
      return el('label', { class: 'cek' }, f[kunci], el('span', null, label));
    }
    f.jenjang = window.dropdown({ aria: 'Jenjang', nilai: d.jenjang || '', placeholder: 'Pilih jenjang', bebas: 'Jenjang lain, tekan Enter',
      pilihan: ['MI', 'MTs', 'MA'].map(function (j) { return { nilai: j, label: j }; }) });
    var jenjangField = el('div', { class: 'field' }, el('span', null, 'Jenjang *'), f.jenjang);
    f.token = el('input', { type: 'text', value: d.token || '', maxLength: 30, autocapitalize: 'characters' });
    var tokenField = el('div', { class: 'field' }, el('span', null, 'Token *'),
      el('div', { class: 'baris-token' }, f.token,
        el('button', { class: 'btn', type: 'button', onclick: function () { f.token.value = tokenAcak(); } }, 'Acak')));
    f.catatan = el('textarea', { rows: 2, value: d.catatan || '' });
    f.buka_at = window.pilihWaktu({ nilai: keInputWaktu(d.buka_at), aria: 'Waktu dibuka', placeholder: 'Selalu terbuka' });
    f.tutup_at = window.pilihWaktu({ nilai: keInputWaktu(d.tutup_at), aria: 'Waktu ditutup', placeholder: 'Tanpa batas' });
    var galat = el('div', { class: 'galat', role: 'alert' });

    var badan = el('div', { class: 'adm-form' },
      isian('nama', 'Nama ujian *', 'text', { maxLength: 150 }),
      el('div', { class: 'grid3' }, jenjangField, isian('mapel', 'Mata pelajaran *'),
        isian('sesi', 'Sesi (opsional)', 'text', { placeholder: 'Contoh: Sesi 1' })),
      el('div', { class: 'grid2' }, isian('durasi_menit', 'Durasi (menit) *', 'number', { min: 1, step: 1 }), tokenField),
      el('div', { class: 'adm-bagian' }, 'JADWAL (KOSONGKAN BILA SELALU TERBUKA)'),
      el('div', { class: 'grid2' },
        el('div', { class: 'field' }, el('span', null, 'Dibuka'), f.buka_at),
        el('div', { class: 'field' }, el('span', null, 'Ditutup'), f.tutup_at)),
      el('p', { class: 'redup petunjuk' }, 'Ujian tampil di beranda hanya di antara waktu buka dan tutup (jam perangkat ini). Siswa yang sudah mulai tetap dapat menyelesaikan ujiannya.'),
      el('div', { class: 'adm-bagian' }, 'PENGATURAN'),
      el('div', { class: 'adm-cek' },
        cek('aktif', 'Ujian aktif'), cek('acak_soal', 'Acak soal'), cek('acak_opsi', 'Acak opsi'), cek('tampil_kunci', 'Tampil kunci')),
      el('label', { class: 'field' }, el('span', null, 'Catatan untuk siswa (opsional)'), f.catatan),
      galat);

    function simpan(modal) {
      var data = {
        id: u ? u.id : undefined,
        nama: f.nama.value, jenjang: f.jenjang.value, mapel: f.mapel.value, sesi: f.sesi.value,
        token: f.token.value, durasi_menit: Number(f.durasi_menit.value), catatan: f.catatan.value,
        buka_at: dariInputWaktu(f.buka_at.value), tutup_at: dariInputWaktu(f.tutup_at.value),
        aktif: f.aktif.checked, acak_soal: f.acak_soal.checked, acak_opsi: f.acak_opsi.checked, tampil_kunci: f.tampil_kunci.checked
      };
      tombol.disabled = true; galat.textContent = '';
      window.call('adminUjianSimpan', tokenAdmin, data).then(function () {
        modal.close();
        window.toast(baru ? 'Ujian ditambahkan.' : 'Ujian disimpan.');
        muatUjian();
      }).catch(function (e) {

  /** Buang pagar kode, urai JSON, beri posisi baris dan kolom bila rusak. Mengembalikan array/objek. */
  function uraiImport(teks) {
    var t = String(teks || '').trim();
    var pagar = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (pagar) t = pagar[1].trim();
    if (!t) throw new Error('Tempel atau unggah JSON soal terlebih dulu.');
    // Buang kalimat AI di luar JSON (misalnya baris "LANJUT:" atau "CATATAN:" di akhir).
    var awal = t.search(/[\[{]/);
    if (awal > 0) t = t.slice(awal);
    var akhir = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
    if (akhir > 0 && akhir < t.length - 1) t = t.slice(0, akhir + 1);
    try { return JSON.parse(t); }
    catch (e) {
      var m = /position (\d+)/.exec(e.message), lk = /line (\d+) column (\d+)/.exec(e.message);
      var lokasi = '';
      if (lk) lokasi = ' pada baris ' + lk[1] + ', kolom ' + lk[2];
      else if (m) {
        var sebelum = t.slice(0, Number(m[1])).split('\n');
        lokasi = ' pada baris ' + sebelum.length + ', kolom ' + (sebelum[sebelum.length - 1].length + 1);
      }
      throw new Error('JSON tidak valid' + lokasi + '. Pastikan garis miring terbalik di rumus ditulis dua kali (\\\\frac). Detail: ' + e.message);
    }
  }

  function salinTeks(teks, pesan) {
    function cadangan() {
      var ta = el('textarea', { value: teks, style: 'position:fixed;opacity:0' });
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      window.toast(ok ? (pesan || 'Prompt disalin.') : 'Tidak bisa menyalin otomatis. Salin dari kotak yang ditampilkan.', !ok);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks).then(function () { window.toast(pesan || 'Prompt disalin.'); }).catch(cadangan);
    } else cadangan();
  }

  function bukaImport() {
    var u = daftarUjian.filter(function (x) { return x.id === ujianTerpilih; })[0];
    var kotak = el('textarea', { rows: 10, class: 'import-ta', spellcheck: false, placeholder: 'Tempel JSON soal di sini', 'aria-label': 'JSON soal' });
    var berkas = el('input', { type: 'file', accept: '.json,application/json,text/plain', 'aria-label': 'Unggah berkas JSON', hidden: true });
    var tbUnggah = el('button', { type: 'button', class: 'btn', onclick: function () { berkas.click(); } }, window.ikon('unggah', 15), 'Unggah berkas');
    var modeTambah = el('input', { type: 'radio', name: 'modeImport', value: 'tambah', checked: true });
    var modeGanti = el('input', { type: 'radio', name: 'modeImport', value: 'ganti' });
    var hasil = el('div', { class: 'import-hasil', 'aria-live': 'polite' });
    var galat = el('div', { class: 'galat', role: 'alert' });
    var terperiksa = null;

    berkas.addEventListener('change', function () {
      var f = berkas.files && berkas.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { kotak.value = fr.result; setel(null); };
      fr.onerror = function () { galat.textContent = 'Berkas tidak dapat dibaca.'; };
      fr.readAsText(f, 'UTF-8');
    });
    kotak.addEventListener('input', function () { setel(null); });
    modeTambah.addEventListener('change', function () { setel(null); });
    modeGanti.addEventListener('change', function () { setel(null); });

    function setel(h) {
      terperiksa = h;
      tbImpor.disabled = !h;
      if (!h) { hasil.textContent = ''; galat.textContent = ''; }
    }

    function kirim(dry) {
      galat.textContent = '';
      var daftar;
      try { daftar = uraiImport(kotak.value); } catch (e) { galat.textContent = e.message; return Promise.reject(e); }
      var mode = modeGanti.checked ? 'ganti' : 'tambah';
      return window.call('adminSoalImport', tokenAdmin, ujianTerpilih, daftar, mode, dry);
    }

    function tampilHasil(h) {
      hasil.textContent = '';
      hasil.appendChild(el('p', null, el('strong', null, h.jumlah + ' soal valid'), ': ' +
        h.per_tipe.pg + ' pilihan ganda, ' + h.per_tipe.pgk + ' pilihan ganda kompleks, ' + h.per_tipe.isian + ' isian.'));
      if (h.gambar_kosong.length) {
        hasil.appendChild(el('p', { class: 'tanda-gambar' }, 'Gambar belum diisi pada soal ' + h.gambar_kosong.join(', ') + '. Isi lewat editor soal setelah impor.'));
      }
      if (h.peringatan.length) {
        hasil.appendChild(el('p', { class: 'redup' }, 'Peringatan (tidak menghentikan impor):'));
        hasil.appendChild(el('ul', null, h.peringatan.map(function (x) { return el('li', null, x); })));
      }
      hasil.appendChild(el('h3', null, 'Pratinjau' + (h.jumlah > h.pratinjau.length ? ' (' + h.pratinjau.length + ' soal pertama)' : '')));
      h.pratinjau.forEach(function (soal, n) {
        var w = el('div', { class: 'import-pra' }, window.soalSiswaEl(soal, n + 1, h.jumlah));
        hasil.appendChild(w);
      });
    }

    var tbPeriksa = el('button', { type: 'button', class: 'btn', onclick: function () {
      tbPeriksa.disabled = true; setel(null);
      kirim(true).then(function (h) { setel(h); tampilHasil(h); })
        .catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) galat.textContent = e.message; })
        .then(function () { tbPeriksa.disabled = false; });
    } }, 'Periksa');
    var tbSalin = el('button', { type: 'button', class: 'btn', onclick: function () { salinTeks(PROMPT_AI); } }, window.ikon('salin', 15), 'Salin prompt untuk AI');

    function jalankan(modal) {
      tbImpor.disabled = true;
      kirim(false).then(function (h) {
        modal.close();
        window.toast(h.jumlah + ' soal diimpor.');
        muatSoal();
      }).catch(function (e) {
        tbImpor.disabled = false;
        if (e.message.indexOf('SESI_ADMIN') !== 0) galat.textContent = e.message;
      });
    }
    function impor(modal) {
      if (!terperiksa) { galat.textContent = 'Klik "Periksa" dulu sebelum mengimpor.'; return false; }
      if (modeGanti.checked && daftarSoal.length) {
        window.openModal({
          judul: 'Ganti semua soal?',
          isi: 'Semua ' + daftarSoal.length + ' soal yang ada di ujian ini akan dihapus dan diganti ' + terperiksa.jumlah + ' soal dari import. Tindakan ini tidak bisa dibatalkan.',
          tombol: [{ teks: 'Batal' }, { teks: 'Ganti semua', bahaya: true, aksi: function () { jalankan(modal); } }]
        });
        return false;
      }
      jalankan(modal);
      return false;
    }

    var badan = el('div', null,
      el('p', { class: 'redup' }, 'Ujian: ' + (u ? labelUjian(u) : '')),
      el('p', { class: 'redup petunjuk' }, 'Belum punya JSON? Salin prompt, kirim ke AI bersama PDF atau Word soal Anda, lalu tempel hasilnya di bawah atau unggah berkasnya.'),
      el('div', { class: 'bar', style: 'justify-content:flex-start' }, tbSalin, tbUnggah, berkas),
      kotak,
      el('div', { class: 'cek-baris' },
        el('label', { class: 'cek' }, modeTambah, el('span', null, 'Tambahkan ke soal yang ada')),
        el('label', { class: 'cek' }, modeGanti, el('span', null, 'Ganti semua soal'))),
      galat, hasil);
    var modal = window.openModal({
      judul: 'Import JSON', isi: badan, lebar: true, tutupDiLuar: false,
      tombol: [{ teks: 'Batal' }, { teks: 'Periksa dan impor', utama: true, aksi: impor }]
    });
    modal.el.querySelector('.modal-kaki').insertBefore(tbPeriksa, modal.el.querySelector('.modal-kaki').firstChild);
    var tbImpor = modal.el.querySelector('.btn-utama');
    tbImpor.textContent = 'Impor';
    tbImpor.disabled = true;
  }

  function bukaEditor(soal, indeks) {
    window.Editor.buka({
      tok: function () { return tokenAdmin; },
      ujianId: ujianTerpilih, soal: soal,
      nomor: soal ? indeks + 1 : daftarSoal.length + 1,
      total: soal ? daftarSoal.length : daftarSoal.length + 1,
      onSimpan: muatSoal
    });
  }

  function geserSoal(i, arah) {
    var j = i + arah;
    if (j < 0 || j >= daftarSoal.length) return;
    var ids = daftarSoal.map(function (x) { return x.id; });
    var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
    window.call('adminSoalUrut', tokenAdmin, ujianTerpilih, ids).then(muatSoal).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true);
    });
  }

  function hapusSoal(x, i) {
    window.openModal({
      judul: 'Hapus soal ' + (i + 1) + '?',
      isi: 'Soal ini akan dihapus. Tindakan ini tidak bisa dibatalkan.',
      tombol: [
        { teks: 'Batal' },
        { teks: 'Hapus soal', bahaya: true, aksi: function () {
          window.call('adminSoalHapus', tokenAdmin, x.id).then(function () {
            window.toast('Soal dihapus.'); muatSoal();
          }).catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true); });
        } }
      ]
    });
  }


  // ---------- tab Hasil ----------

  var daftarHasil = [];

  function tampilHasilTab() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    if (daftarUjian.length) { gambarHasilTab(); return; }
    p.appendChild(el('div', { class: 'kerangka' }));
    window.call('adminUjianList', tokenAdmin).then(function (d) {
      daftarUjian = d;
      gambarHasilTab();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      p.textContent = ''; p.appendChild(el('p', { class: 'kosong' }, e.message));
    });
  }

  function gambarHasilTab() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    p.appendChild(el('div', { class: 'adm-atas' }, el('h1', null, 'Hasil')));
    if (!daftarUjian.length) {
      p.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada ujian. Buat ujian dulu di tab Ujian.')));
      return;
    }
    p.appendChild(el('div', { class: 'bar' },
      pilihanUjian(muatHasil),
      el('button', { class: 'btn', type: 'button', onclick: muatHasil }, 'Muat ulang'),
      el('button', { class: 'btn btn-utama', type: 'button', id: 'tbCsv', onclick: eksporCsv }, 'Ekspor CSV')));
    p.appendChild(el('div', { id: 'daftarHasil' }));
    muatHasil();
  }

  function muatHasil() {
    var d = document.getElementById('daftarHasil');
    d.textContent = '';
    d.appendChild(el('div', { class: 'kerangka' }));
    var untuk = ujianTerpilih;
    window.call('adminHasil', tokenAdmin, untuk).then(function (h) {
      if (untuk !== ujianTerpilih) return;
      daftarHasil = h;
      gambarHasil();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      d.textContent = ''; d.appendChild(el('p', { class: 'kosong' }, e.message));
    });
  }

  function waktuRingkas(detik) {
    var d = Math.max(0, Math.round(Number(detik) || 0)), j = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), s = d % 60;
    var dua = function (x) { return (x < 10 ? '0' : '') + x; };
    return (j ? j + ':' + dua(m) : String(m)) + ':' + dua(s);
  }

  function tanggalRingkas(iso) {
    var t = new Date(iso);
    if (isNaN(t.getTime())) return '';
    try { return t.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return t.toLocaleString(); }
  }

  /** Nomor peringkat; yang sama persis pada nilai, benar, salah, dan waktu berbagi peringkat. */
  function peringkat(daftar) {
    var hasil = [];
    daftar.forEach(function (r, i) {
      var b = daftar[i - 1];
      var sama = b && b.skor === r.skor && b.benar === r.benar && b.salah === r.salah && b.durasi_detik === r.durasi_detik;
      hasil.push(sama ? hasil[i - 1] : i + 1);
    });
    return hasil;
  }

  function gambarHasil() {
    var d = document.getElementById('daftarHasil');
    d.textContent = '';
    document.getElementById('tbCsv').disabled = !daftarHasil.length;
    if (!daftarHasil.length) {
      d.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada siswa yang menyelesaikan ujian ini.')));
      return;
    }
    d.appendChild(el('p', { class: 'redup' }, daftarHasil.length + ' hasil. Urutan: nilai tertinggi, benar terbanyak, salah tersedikit, lalu waktu tercepat.'));
    var rank = peringkat(daftarHasil);
    var tbody = el('tbody');
    daftarHasil.forEach(function (r, i) {
      tbody.appendChild(el('tr', null,
        el('td', null, String(rank[i])),
        el('td', null, el('strong', null, r.nama)),
        el('td', null, r.nomor_peserta || '-'),
        el('td', null, r.kelas || '-'),
        el('td', null, r.sekolah || '-'),
        el('td', null, String(r.benar)), el('td', null, String(r.salah)), el('td', null, String(r.kosong)),
        el('td', null, el('strong', null, String(r.skor))),
        el('td', null, waktuRingkas(r.durasi_detik)),
        el('td', null, tanggalRingkas(r.selesai_at)),
        el('td', { class: 'aksi' }, el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { hapusHasil(r); } }, 'Reset'))));
    });
    var judul = ['Peringkat', 'Nama', 'Nomor', 'Kelas', 'Sekolah', 'Benar', 'Salah', 'Kosong', 'Nilai', 'Waktu', 'Selesai', ''];
    d.appendChild(el('div', { class: 'tabel-bungkus' }, el('table', { class: 'tabel' },
      el('thead', null, el('tr', null, judul.map(function (t) { return el('th', null, t); }))), tbody)));
  }

  function hapusHasil(r) {
    window.openModal({
      judul: 'Reset hasil ini?',
      isi: 'Hasil ' + r.nama + ' (nilai ' + r.skor + ') akan dihapus agar ia dapat mengulang ujian dari awal. Tindakan ini tidak bisa dibatalkan.',
      tombol: [
        { teks: 'Batal' },
        { teks: 'Reset hasil', bahaya: true, aksi: function () {
          window.call('adminSesiHapus', tokenAdmin, r.id).then(function () {
            window.toast('Hasil direset. Siswa dapat mengulang ujian.'); muatHasil();
          }).catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true); });
        } }
      ]
    });
  }

  /** Sel CSV: kutip bila perlu; awalan rumus (= + - @) diberi apostrof agar tidak dijalankan Excel. */
  function selCsv(v) {
    var t = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function eksporCsv() {
    if (!daftarHasil.length) return;
    var u = daftarUjian.filter(function (x) { return x.id === ujianTerpilih; })[0];
    var rank = peringkat(daftarHasil);
    var koma = function (n) { return String(n).replace('.', ','); };
    var baris = [['Peringkat', 'Nama', 'Nomor peserta', 'Kelas', 'Sekolah', 'Benar', 'Salah', 'Kosong', 'Nilai', 'Waktu pengerjaan', 'Waktu (detik)', 'Selesai']];
    daftarHasil.forEach(function (r, i) {
      baris.push([rank[i], r.nama, r.nomor_peserta || '', r.kelas || '', r.sekolah || '', r.benar, r.salah, r.kosong,
        koma(r.skor), waktuRingkas(r.durasi_detik), r.durasi_detik, r.selesai_at]);
    });
    // Titik koma dan koma desimal agar terbuka rapi di Excel berbahasa Indonesia; BOM agar huruf Arab/Latin utuh.
    var csv = '﻿' + baris.map(function (b) { return b.map(selCsv).join(';'); }).join('\r\n');
    var aman = function (t) { return String(t || '').trim().replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, ''); };
    var tautan = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: 'Hasil_' + (aman(u && u.nama) || 'Ujian') + '.csv' });
    document.body.appendChild(tautan);
    tautan.click();
    setTimeout(function () { URL.revokeObjectURL(tautan.href); tautan.remove(); }, 1000);
  }

  var btn = document.getElementById('btnAdmin');
  btn.hidden = false;
  btn.addEventListener('click', function () {
    if (tokenAdmin) tampilAdmin(); else bukaLogin();
  });
  tokenAdmin = bacaTokenTersimpan();
})();
</script>
