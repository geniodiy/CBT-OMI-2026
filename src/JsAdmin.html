<script>
(function () {
  var KUNCI_TOKEN = 'cbt_admin_v1';
  var tokenAdmin = null;
  var daftarUjian = [];

  function bacaTokenTersimpan() {
    try { return sessionStorage.getItem(KUNCI_TOKEN); } catch (e) { return null; }
  }
  function simpanToken(t) {
    tokenAdmin = t;
    try { if (t) sessionStorage.setItem(KUNCI_TOKEN, t); else sessionStorage.removeItem(KUNCI_TOKEN); } catch (e) { /* tanpa storage: sesi hilang saat refresh */ }
  }

  function keBeranda() {
    document.getElementById('btnAdmin').textContent = 'Login admin';
    if (window.App.muatBeranda) window.App.muatBeranda(); else window.showView('beranda');
  }

  function sesiHabis(pesan) {
    simpanToken(null);
    keBeranda();
    window.toast(String(pesan).replace(/^SESI_ADMIN:\s*/, 'Sesi admin berakhir, ') + '.', true);
  }
  window.App.onSesiAdminHabis = sesiHabis;

  var popoverLogin = null;

  function tutupLogin() {
    if (!popoverLogin) return;
    var p = popoverLogin; popoverLogin = null;
    document.removeEventListener('mousedown', luarLogin, true);
    document.removeEventListener('keydown', escLogin, true);
    window.removeEventListener('resize', tutupLogin);
    p.remove();
  }
  function luarLogin(e) {
    if (popoverLogin && !popoverLogin.contains(e.target) && e.target !== document.getElementById('btnAdmin')) tutupLogin();
  }
  function escLogin(e) { if (e.key === 'Escape') tutupLogin(); }

  /** Kotak kecil di dekat tombol "Login admin": hanya kata sandi. */
  function bukaLogin() {
    if (popoverLogin) { tutupLogin(); return; }
    var btn = document.getElementById('btnAdmin');
    var input = el('input', { type: 'password', autocomplete: 'current-password', 'aria-label': 'Kata sandi admin', placeholder: 'Kata sandi' });
    var masuk = el('button', { class: 'btn btn-utama', type: 'button' }, 'Masuk');
    var galat = el('div', { class: 'galat', role: 'alert' });
    function kirim() {
      if (!input.value) { galat.textContent = 'Isi kata sandi.'; input.focus(); return; }
      galat.textContent = '';
      window.sibuk(masuk, window.call('adminLogin', input.value).then(function (h) {
        simpanToken(h.tok);
        daftarUjian = h.ujian || [];
        tutupLogin();
        tampilAdmin();
      }).catch(function (e) {
        galat.textContent = e.message;
        input.select();
      }));
    }
    masuk.addEventListener('click', kirim);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); kirim(); } });
    var pop = el('div', { class: 'popover', role: 'dialog', 'aria-label': 'Login admin' },
      el('h3', null, 'Login admin'),
      el('p', null, 'Masukkan kata sandi admin.'),
      el('div', { class: 'popover-baris' }, input, masuk),
      galat);
    var r = btn.getBoundingClientRect();
    pop.style.top = Math.round(r.bottom + 8) + 'px';
    pop.style.right = Math.max(8, Math.round(window.innerWidth - r.right)) + 'px';
    document.body.appendChild(pop);
    popoverLogin = pop;
    document.addEventListener('mousedown', luarLogin, true);
    document.addEventListener('keydown', escLogin, true);
    window.addEventListener('resize', tutupLogin);
    input.focus();
  }

  var tabAktif = 'ujian';
  var ujianTerpilih = null;
  var daftarSoal = [];

  function tampilAdmin() {
    var s = document.querySelector('[data-view="admin"]');
    s.textContent = '';
    var tabs = el('div', { class: 'tabs', role: 'tablist' });
    [['ujian', 'Ujian'], ['soal', 'Soal'], ['hasil', 'Hasil']].forEach(function (t) {
      tabs.appendChild(el('button', { class: 'tab', role: 'tab', type: 'button', 'data-tab': t[0], onclick: function () { pilihTab(t[0]); } }, t[1]));
    });
    tabs.appendChild(el('span', { class: 'spacer' }));
    tabs.appendChild(el('button', { class: 'btn btn-teks', type: 'button', onclick: keluar }, 'Keluar'));
    s.appendChild(tabs);
    s.appendChild(el('div', { id: 'panelAdmin' }));
    window.showView('admin');
    document.getElementById('btnAdmin').textContent = 'Panel admin';
    pilihTab(tabAktif);
  }

  function pilihTab(t) {
    tabAktif = t;
    document.querySelectorAll('[data-view="admin"] .tab').forEach(function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === t ? 'true' : 'false');
    });
    if (t === 'soal') tampilSoalTab();
    else if (t === 'hasil') tampilHasilTab();
    else muatUjian();
  }

  function keluar() {
    var t = tokenAdmin;
    simpanToken(null);
    keBeranda();
    window.call('adminKeluar', t).catch(function () { /* token tetap kedaluwarsa sendiri */ });
  }

  /** Tampilkan daftar yang sudah ada lebih dulu, lalu segarkan dari server di belakang layar. */
  function muatUjian() {
    var p = document.getElementById('panelAdmin');
    if (daftarUjian.length) gambarUjian();
    else { p.textContent = ''; p.appendChild(el('div', { class: 'kerangka' })); p.appendChild(el('div', { class: 'kerangka' })); }
    window.call('adminUjianList', tokenAdmin).then(function (d) {
      daftarUjian = d;
      if (tabAktif === 'ujian' && !document.querySelector('.modal')) gambarUjian();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      if (!daftarUjian.length) { p.textContent = ''; p.appendChild(el('p', { class: 'kosong' }, e.message)); }
    });
  }

  function gambarUjian() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    p.appendChild(el('div', { class: 'bar' },
      el('h2', null, 'Daftar ujian'),
      el('button', { class: 'btn btn-utama', type: 'button', onclick: function () { bukaForm(null); } }, 'Tambah ujian')));
    if (!daftarUjian.length) {
      p.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada ujian. Klik "Tambah ujian" untuk membuat yang pertama.')));
      return;
    }
    var tbody = el('tbody');
    daftarUjian.forEach(function (u) {
      tbody.appendChild(el('tr', null,
        el('td', null, el('strong', null, u.nama)),
        el('td', null, u.jenjang),
        el('td', null, u.mapel),
        el('td', null, u.sesi || '-'),
        el('td', null, u.durasi_menit + ' menit'),
        el('td', null, String(u.jumlah_soal)),
        el('td', null, el('code', null, u.token)),
        el('td', null, statusUjian(u)),
        el('td', { class: 'aksi' },
          el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { bukaForm(u); } }, 'Ubah'),
          el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { duplikatUjian(u); } }, 'Duplikat'),
          el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { konfirmasiHapus(u); } }, 'Hapus'))));
    });
    var tabel = el('table', { class: 'tabel' },
      el('thead', null, el('tr', null, ['Nama', 'Jenjang', 'Mapel', 'Sesi', 'Durasi', 'Soal', 'Token', 'Status', ''].map(function (t) { return el('th', null, t); }))),
      tbody);
    p.appendChild(el('div', { class: 'tabel-bungkus' }, tabel));
  }


  function statusUjian(u) {
    var sekarang = Date.now(), b = u.buka_at ? Date.parse(u.buka_at) : NaN, t = u.tutup_at ? Date.parse(u.tutup_at) : NaN;
    if (!u.aktif) return el('span', { class: 'status-mati' }, 'Nonaktif');
    if (!isNaN(b) && sekarang < b) return el('span', { class: 'status-mati' }, 'Belum dibuka', el('div', { class: 'redup' }, tanggalRingkas(u.buka_at)));
    if (!isNaN(t) && sekarang >= t) return el('span', { class: 'status-mati' }, 'Ditutup', el('div', { class: 'redup' }, tanggalRingkas(u.tutup_at)));
    return el('span', { class: 'status-aktif' }, 'Aktif', !isNaN(t) ? el('div', { class: 'redup' }, 'Tutup ' + tanggalRingkas(u.tutup_at)) : null);
  }

  /** Nilai untuk input datetime-local (jam perangkat) dari ISO. */
  function keInputWaktu(iso) {
    var t = iso ? new Date(iso) : null;
    if (!t || isNaN(t.getTime())) return '';
    var dua = function (n) { return (n < 10 ? '0' : '') + n; };
    return t.getFullYear() + '-' + dua(t.getMonth() + 1) + '-' + dua(t.getDate()) + 'T' + dua(t.getHours()) + ':' + dua(t.getMinutes());
  }
  function dariInputWaktu(v) {
    if (!v) return '';
    var t = new Date(v);
    return isNaN(t.getTime()) ? '' : t.toISOString();
  }

  function duplikatUjian(u) {
    window.openModal({
      judul: 'Duplikat ujian?',
      isi: 'Ujian "' + u.nama + '" disalin beserta ' + u.jumlah_soal + ' soalnya. Hasil siswa tidak disalin. Salinan berstatus nonaktif dan memakai token baru.',
      tombol: [
        { teks: 'Batal' },
        { teks: 'Duplikat', utama: true, aksi: function () {
          window.call('adminUjianDuplikat', tokenAdmin, u.id).then(function (b) {
            window.toast('Ujian disalin dengan token ' + b.token + '. Aktifkan bila sudah siap.');
            muatUjian();
          }).catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true); });
        } }
      ]
    });
  }

  function tokenAcak() {
    var abjad = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var b = new Uint32Array(6), hasil = '';
    try { window.crypto.getRandomValues(b); } catch (e) { for (var i = 0; i < 6; i++) b[i] = Math.floor(Math.random() * 4294967296); }
    for (var j = 0; j < 6; j++) hasil += abjad.charAt(b[j] % abjad.length);
    return hasil;
  }

  function bukaForm(u) {
    var baru = !u;
    var d = u || { jenjang: '', durasi_menit: 120, aktif: true, token: tokenAcak() };
    var f = {};
    function isian(kunci, label, tipe, extra) {
      f[kunci] = el('input', Object.assign({ type: tipe || 'text', value: d[kunci] == null ? '' : d[kunci] }, extra || {}));
      return el('label', { class: 'field' }, el('span', null, label), f[kunci]);
    }
    function cek(kunci, label) {
      f[kunci] = el('input', { type: 'checkbox', checked: !!d[kunci] });
      return el('label', { class: 'cek' }, f[kunci], el('span', null, label));
    }
    f.jenjang = el('input', { type: 'text', list: 'daftarJenjang', value: d.jenjang || '', maxLength: 30 });
    var jenjangField = el('label', { class: 'field' }, el('span', null, 'Jenjang *'), f.jenjang,
      el('datalist', { id: 'daftarJenjang' }, ['MI', 'MTs', 'MA'].map(function (j) { return el('option', { value: j }); })));
    f.token = el('input', { type: 'text', value: d.token || '', maxLength: 30, autocapitalize: 'characters' });
    var tokenField = el('div', { class: 'field' }, el('span', null, 'Token *'),
      el('div', { class: 'baris-token' }, f.token,
        el('button', { class: 'btn', type: 'button', onclick: function () { f.token.value = tokenAcak(); } }, 'Acak')));
    f.catatan = el('textarea', { rows: 3, value: d.catatan || '' });
    f.buka_at = el('input', { type: 'datetime-local', value: keInputWaktu(d.buka_at), 'aria-label': 'Buka otomatis' });
    f.tutup_at = el('input', { type: 'datetime-local', value: keInputWaktu(d.tutup_at), 'aria-label': 'Tutup otomatis' });
    var galat = el('div', { class: 'galat', role: 'alert' });

    var badan = el('div', null,
      isian('nama', 'Nama ujian *', 'text', { maxLength: 150 }),
      el('div', { class: 'grid2' }, jenjangField, isian('mapel', 'Mata pelajaran *')),
      el('div', { class: 'grid2' }, isian('sesi', 'Sesi (opsional)', 'text', { placeholder: 'Contoh: Sesi 1' }),
        isian('durasi_menit', 'Durasi (menit) *', 'number', { min: 1, step: 1 })),
      tokenField,
      el('div', { class: 'grid2' },
        el('label', { class: 'field' }, el('span', null, 'Buka otomatis (opsional)'), f.buka_at),
        el('label', { class: 'field' }, el('span', null, 'Tutup otomatis (opsional)'), f.tutup_at)),
      el('p', { class: 'redup petunjuk' }, 'Kosongkan agar tidak dibatasi waktu. Ujian tampil di beranda hanya di antara waktu buka dan tutup. Waktu mengikuti jam perangkat ini. Siswa yang sudah mulai tetap dapat menyelesaikan ujiannya setelah waktu tutup.'),
      el('label', { class: 'field' }, el('span', null, 'Catatan dari pengawas (opsional)'), f.catatan),
      cek('aktif', 'Tampil di beranda (aktif)'),
      cek('acak_soal', 'Acak urutan soal'),
      cek('acak_opsi', 'Acak urutan opsi jawaban'),
      cek('tampil_kunci', 'Tampilkan kunci jawaban di hasil siswa'),
      galat);

    function simpan(modal) {
      var data = {
        id: u ? u.id : undefined,
        nama: f.nama.value, jenjang: f.jenjang.value, mapel: f.mapel.value, sesi: f.sesi.value,
        token: f.token.value, durasi_menit: Number(f.durasi_menit.value), catatan: f.catatan.value,
        buka_at: dariInputWaktu(f.buka_at.value), tutup_at: dariInputWaktu(f.tutup_at.value),
        aktif: f.aktif.checked, acak_soal: f.acak_soal.checked, acak_opsi: f.acak_opsi.checked, tampil_kunci: f.tampil_kunci.checked
      };
      tombol.disabled = true; galat.textContent = '';
      window.call('adminUjianSimpan', tokenAdmin, data).then(function () {
        modal.close();
        window.toast(baru ? 'Ujian ditambahkan.' : 'Ujian disimpan.');
        muatUjian();
      }).catch(function (e) {
        tombol.disabled = false;
        if (e.message.indexOf('SESI_ADMIN') !== 0) galat.textContent = e.message;
      });
      return false;
    }
    var modal = window.openModal({
      judul: baru ? 'Tambah ujian' : 'Ubah ujian', isi: badan, tutupDiLuar: false,
      tombol: [{ teks: 'Batal' }, { teks: 'Simpan ujian', utama: true, aksi: simpan }]
    });
    var tombol = modal.el.querySelector('.btn-utama');
  }

  function konfirmasiHapus(u) {
    window.openModal({
      judul: 'Hapus ujian?',
      isi: 'Ujian "' + u.nama + '" akan dihapus beserta seluruh soal dan hasil siswa (' + u.jumlah_soal + ' soal). Tindakan ini tidak bisa dibatalkan.',
      tombol: [
        { teks: 'Batal' },
        { teks: 'Hapus ujian', bahaya: true, aksi: function () {
          window.call('adminUjianHapus', tokenAdmin, u.id).then(function () {
            daftarUjian = daftarUjian.filter(function (x) { return x.id !== u.id; });
            window.toast('Ujian dihapus.'); muatUjian();
          }).catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true); });
        } }
      ]
    });
  }


  // ---------- tab Soal ----------

  function labelUjian(u) { return u.nama + ' (' + u.jenjang + ' ' + u.mapel + (u.sesi ? ', ' + u.sesi : '') + ')'; }

  function tampilSoalTab() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    if (daftarUjian.length) { gambarSoalTab(); return; }
    p.appendChild(el('div', { class: 'kerangka' }));
    window.call('adminUjianList', tokenAdmin).then(function (d) {
      daftarUjian = d;
      gambarSoalTab();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      p.textContent = ''; p.appendChild(el('p', { class: 'kosong' }, e.message));
    });
  }

  function pilihanUjian(onGanti) {
    if (!ujianTerpilih || !daftarUjian.some(function (u) { return u.id === ujianTerpilih; })) ujianTerpilih = daftarUjian[0].id;
    var pilih = el('select', { 'aria-label': 'Pilih ujian' }, daftarUjian.map(function (u) { return el('option', { value: u.id }, labelUjian(u)); }));
    pilih.value = ujianTerpilih;
    pilih.addEventListener('change', function () { ujianTerpilih = pilih.value; onGanti(); });
    return el('label', { class: 'field', style: 'margin:0;flex:1;min-width:220px' }, el('span', null, 'Ujian'), pilih);
  }

  function gambarSoalTab() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    if (!daftarUjian.length) {
      p.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada ujian. Buat ujian dulu di tab Ujian.')));
      return;
    }
    p.appendChild(el('div', { class: 'bar' },
      pilihanUjian(muatSoal),
      el('button', { class: 'btn', type: 'button', onclick: bukaImport }, 'Import JSON'),
      el('button', { class: 'btn btn-utama', type: 'button', onclick: function () { bukaEditor(null); } }, 'Tambah soal')));
    p.appendChild(el('div', { id: 'daftarSoal' }));
    muatSoal();
  }

  function muatSoal() {
    var d = document.getElementById('daftarSoal');
    d.textContent = '';
    d.appendChild(el('div', { class: 'kerangka' }));
    var untuk = ujianTerpilih;
    window.call('adminSoalList', tokenAdmin, untuk).then(function (h) {
      if (untuk !== ujianTerpilih) return;
      daftarSoal = h;
      gambarSoal();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      d.textContent = ''; d.appendChild(el('p', { class: 'kosong' }, e.message));
    });
  }

  function gambarKosong(soal) {
    return (soal.blok || []).some(function (b) { return b.tipe === 'gambar' && !String(b.isi || '').trim(); });
  }

  var LABEL_TIPE = { pg: 'Pilihan ganda', pgk: 'Pilihan ganda kompleks', isian: 'Isian singkat' };

  function gambarSoal() {
    var d = document.getElementById('daftarSoal');
    d.textContent = '';
    if (!daftarSoal.length) {
      d.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada soal di ujian ini. Klik "Tambah soal".')));
      return;
    }
    var kosongNo = daftarSoal.map(function (x, i) { return gambarKosong(x) ? i + 1 : 0; }).filter(Boolean);
    if (kosongNo.length) d.appendChild(el('p', { class: 'tanda-gambar' }, 'Gambar belum diisi pada soal ' + kosongNo.join(', ') + '.'));
    var daftar = el('div', { class: 'tabel-bungkus' });
    daftarSoal.forEach(function (x, i) {
      var ring = el('div', { class: 'soal-ringkas' });
      ring.innerHTML = window.blokHTML((x.blok || []).filter(function (b) { return b.tipe === 'teks'; }));
      window.mathify(ring);
      daftar.appendChild(el('div', { class: 'soal-baris' },
        el('div', { class: 'soal-no' }, String(i + 1)),
        el('div', null,
          el('div', { class: 'soal-meta' }, el('span', { class: 'lencana' }, LABEL_TIPE[x.tipe]), 'Bobot ' + x.bobot,
            gambarKosong(x) ? el('span', { class: 'tanda-gambar' }, 'Gambar belum diisi') : null),
          ring),
        el('div', { class: 'soal-aksi' },
          el('button', { class: 'btn btn-teks', type: 'button', disabled: i === 0, onclick: function () { geserSoal(i, -1); } }, 'Naik'),
          el('button', { class: 'btn btn-teks', type: 'button', disabled: i === daftarSoal.length - 1, onclick: function () { geserSoal(i, 1); } }, 'Turun'),
          el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { bukaEditor(x, i); } }, 'Ubah'),
          el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { hapusSoal(x, i); } }, 'Hapus'))));
    });
    d.appendChild(daftar);
  }


  var PROMPT_AI = String.raw`PERAN
Kamu adalah konverter soal ujian. Tugasmu mengubah soal pada dokumen terlampir (PDF atau Word) menjadi satu JSON array yang bisa langsung diimpor ke website CBT. Kerjakan semua soal di dokumen, jangan ada yang dilewati.

KELUARAN
- Keluarkan HANYA JSON yang valid. Tanpa kalimat pembuka, tanpa penjelasan, tanpa pagar kode markdown.
- Bentuknya array: [ {soal 1}, {soal 2}, ... ] sesuai urutan di dokumen.

FORMAT SATU SOAL
{
  "tipe": "pg",
  "blok": [
    {"tipe": "teks", "isi": "Narasi atau stimulus soal."},
    {"tipe": "gambar", "isi": ""},
    {"tipe": "teks", "isi": "<b>Pertanyaan</b><br>Kalimat pertanyaan ..."}
  ],
  "opsi": {"A": "...", "B": "...", "C": "...", "D": "..."},
  "kunci": ["B"],
  "bobot": 1
}

ATURAN TIPE DAN KUNCI
1. "pg" (pilihan ganda): tepat satu kunci, contoh ["B"]. Opsi A sampai D (atau sampai E bila dokumen memiliki 5 opsi).
2. "pgk" (pilihan ganda kompleks / pilih lebih dari satu jawaban benar): satu atau lebih kunci, contoh ["A","C"]. Dipakai bila soal berbunyi "pilih semua jawaban yang benar", "jawaban benar lebih dari satu", dan sejenisnya.
3. "isian" (isian singkat): TANPA "opsi". "kunci" berisi semua bentuk jawaban yang boleh diterima, contoh ["12,5","12.5"]. Jawaban isian singkat berupa teks atau angka biasa, bukan huruf opsi.
4. Jangan menulis huruf opsi ("A.", "B)") di dalam isi opsi. Huruf sudah menjadi nama kunci objek.
5. "bobot" bernilai 1 kecuali dokumen menyebut bobot lain.
6. Kunci jawaban diambil dari lembar kunci di dokumen bila ada. Bila tidak ada, isi dengan jawaban yang paling tepat menurutmu, dan catat nomor soal tersebut di bagian CATATAN AKHIR (lihat bawah).

ATURAN ISI SOAL (blok)
7. Pisahkan stimulus (cerita, data, kutipan) dan kalimat pertanyaan menjadi blok teks terpisah bila dokumen memisahkannya. Kalimat pertanyaan boleh diawali <b>Pertanyaan</b><br>.
8. Bila soal memiliki gambar, grafik, diagram, tabel bergambar, atau peta, sisipkan blok {"tipe":"gambar","isi":""} tepat di posisi gambar itu (di atas, tengah, atau bawah teks). Biarkan "isi" KOSONG. Gambar diunggah manual di website. Satu soal boleh punya beberapa blok gambar.
9. Bila SEBUAH OPSI berupa gambar, tulis teks opsinya "(gambar)" dan sebutkan nomor soal itu di CATATAN AKHIR.
10. Tabel data biasa: website tidak mendukung tag tabel. Ubah menjadi teks yang rapi, misalnya satu baris per data dengan <br>, atau daftar <ul><li>...</li></ul>. Bila tabelnya rumit, jadikan blok gambar kosong.
11. Pertahankan nomor, urutan, kata, dan angka apa adanya. Jangan memperbaiki, menyingkat, atau menerjemahkan. Buang nomor soal ("1.", "2.") dari awal teks, tetapi jangan ubah isinya.
12. Buang header, footer, nomor halaman, nama instansi, dan petunjuk umum ujian yang bukan bagian soal.

ATURAN FORMAT TEKS
13. HTML yang boleh dipakai HANYA: <b>, <strong>, <i>, <em>, <u>, <sub>, <sup>, <br>, <p>, <div>, <span>, <ul>, <ol>, <li>. Tag lain dan atribut style dilarang.
14. Baris baru di dalam teks ditulis <br>, bukan karakter enter di dalam string JSON.
15. Perataan teks (hanya bila di dokumen memang rata tengah, rata kanan, atau rata kiri-kanan): bungkus dengan <div class="rata-tengah">...</div>, <div class="rata-kanan">...</div>, atau <div class="rata-penuh">...</div>. Teks biasa tidak perlu dibungkus.
16. Cetak tebal, miring, garis bawah, pangkat, dan indeks di dokumen dipertahankan dengan <b>, <i>, <u>, <sup>, <sub>.

ATURAN RUMUS (SANGAT PENTING)
17. Semua rumus matematika, fisika, dan kimia ditulis dalam LaTeX di antara tanda dolar: sebaris $...$, baris sendiri $$...$$.
   Contoh: $\\frac{a}{b}$, $x^{2}$, $\\sqrt{17}$, $5\\,\\text{m/s}$, $\\times$, $\\leq$, $\\alpha$.
   Kimia: $\\ce{H2O}$, $\\ce{2H2 + O2 -> 2H2O}$.
18. Karena ini JSON, SETIAP garis miring terbalik WAJIB ditulis dua kali: \\frac, \\sqrt, \\times, \\text, \\ce. Ini mutlak. Satu garis miring akan merusak rumus.
19. Jangan menulis rumus sebagai teks biasa seperti "sqrt17", "x^2", "a/b", "10 pangkat 3" tanpa tanda dolar. Angka biasa tanpa operasi (misalnya "25 soal", "tahun 2026") tidak perlu dolar.
20. Bilangan desimal Indonesia di dalam rumus ditulis dengan {,} contoh $1{,}5 \\times 10^{3}$. Di luar rumus tulis biasa "1,5".
21. Teks biasa di dalam rumus dibungkus \\text{...}, termasuk teks Arab.
22. Tanda kutip ganda di dalam isi teks ditulis \" agar JSON tetap valid.

ATURAN TEKS ARAB
23. Teks Arab (termasuk harakat: fathah, kasrah, dhammah, sukun, syaddah, tanwin) ditulis sebagai karakter Unicode Arab biasa, UTUH, dalam urutan logis (huruf pertama kata di kanan). Jangan memakai gambar, jangan transliterasi pengganti, jangan membalik urutan huruf, jangan memutus huruf.
24. Hasil salinan PDF kadang terbalik atau terputus-putus. Bila begitu, tulis ulang kata Arab itu dengan benar. Jangan menghilangkan harakat.
25. Ayat atau hadis boleh dijadikan blok teks tersendiri.

PEMERIKSAAN SEBELUM MENJAWAB
Sebelum mengeluarkan hasil, periksa dalam hati:
- Jumlah soal di JSON = jumlah soal di dokumen.
- Semua "tipe" hanya pg, pgk, atau isian.
- pg memiliki tepat 1 kunci; pgk memiliki 1 atau lebih; semua huruf kunci ada di opsi.
- isian tidak punya "opsi".
- Tidak ada garis miring tunggal pada rumus (semua \\ ganda).
- Tidak ada koma berlebih di akhir, kutip tidak berpasangan, atau karakter enter di dalam string. JSON harus lolos validator.

JIKA HASIL TERLALU PANJANG
Bila batas keluaranmu tidak cukup untuk semua soal, keluarkan sebagian soal pertama sebagai JSON array yang LENGKAP dan valid (jangan terpotong di tengah), lalu pada baris terpisah setelah JSON tulis persis: "LANJUT: soal berikutnya dimulai dari nomor N" (N = nomor soal berikutnya). Saya akan membalas "lanjut", dan kamu mengeluarkan bagian berikutnya dalam array baru.

CATATAN AKHIR
Setelah JSON (di luar array), bila ada hal yang perlu diperiksa manusia, tulis satu baris terpisah diawali "CATATAN:" berisi nomor soal dan alasannya (kunci tidak ada di dokumen, opsi berupa gambar, tabel rumit, teks Arab meragukan). Bila tidak ada, jangan tulis apa pun.`;

  /** Buang pagar kode, urai JSON, beri posisi baris dan kolom bila rusak. Mengembalikan array/objek. */
  function uraiImport(teks) {
    var t = String(teks || '').trim();
    var pagar = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (pagar) t = pagar[1].trim();
    if (!t) throw new Error('Tempel atau unggah JSON soal terlebih dulu.');
    // Buang kalimat AI di luar JSON (misalnya baris "LANJUT:" atau "CATATAN:" di akhir).
    var awal = t.search(/[\[{]/);
    if (awal > 0) t = t.slice(awal);
    var akhir = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
    if (akhir > 0 && akhir < t.length - 1) t = t.slice(0, akhir + 1);
    try { return JSON.parse(t); }
    catch (e) {
      var m = /position (\d+)/.exec(e.message), lk = /line (\d+) column (\d+)/.exec(e.message);
      var lokasi = '';
      if (lk) lokasi = ' pada baris ' + lk[1] + ', kolom ' + lk[2];
      else if (m) {
        var sebelum = t.slice(0, Number(m[1])).split('\n');
        lokasi = ' pada baris ' + sebelum.length + ', kolom ' + (sebelum[sebelum.length - 1].length + 1);
      }
      throw new Error('JSON tidak valid' + lokasi + '. Pastikan garis miring terbalik di rumus ditulis dua kali (\\\\frac). Detail: ' + e.message);
    }
  }

  function salinTeks(teks) {
    function cadangan() {
      var ta = el('textarea', { value: teks, style: 'position:fixed;opacity:0' });
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      window.toast(ok ? 'Prompt disalin.' : 'Tidak bisa menyalin otomatis. Salin dari kotak yang ditampilkan.', !ok);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks).then(function () { window.toast('Prompt disalin.'); }).catch(cadangan);
    } else cadangan();
  }

  function bukaImport() {
    var u = daftarUjian.filter(function (x) { return x.id === ujianTerpilih; })[0];
    var kotak = el('textarea', { rows: 10, class: 'import-ta', spellcheck: false, placeholder: 'Tempel JSON soal di sini', 'aria-label': 'JSON soal' });
    var berkas = el('input', { type: 'file', accept: '.json,application/json,text/plain', 'aria-label': 'Unggah berkas JSON' });
    var modeTambah = el('input', { type: 'radio', name: 'modeImport', value: 'tambah', checked: true });
    var modeGanti = el('input', { type: 'radio', name: 'modeImport', value: 'ganti' });
    var hasil = el('div', { class: 'import-hasil', 'aria-live': 'polite' });
    var galat = el('div', { class: 'galat', role: 'alert' });
    var terperiksa = null;

    berkas.addEventListener('change', function () {
      var f = berkas.files && berkas.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { kotak.value = fr.result; setel(null); };
      fr.onerror = function () { galat.textContent = 'Berkas tidak dapat dibaca.'; };
      fr.readAsText(f, 'UTF-8');
    });
    kotak.addEventListener('input', function () { setel(null); });
    modeTambah.addEventListener('change', function () { setel(null); });
    modeGanti.addEventListener('change', function () { setel(null); });

    function setel(h) {
      terperiksa = h;
      tbImpor.disabled = !h;
      if (!h) { hasil.textContent = ''; galat.textContent = ''; }
    }

    function kirim(dry) {
      galat.textContent = '';
      var daftar;
      try { daftar = uraiImport(kotak.value); } catch (e) { galat.textContent = e.message; return Promise.reject(e); }
      var mode = modeGanti.checked ? 'ganti' : 'tambah';
      return window.call('adminSoalImport', tokenAdmin, ujianTerpilih, daftar, mode, dry);
    }

    function tampilHasil(h) {
      hasil.textContent = '';
      hasil.appendChild(el('p', null, el('strong', null, h.jumlah + ' soal valid'), ': ' +
        h.per_tipe.pg + ' pilihan ganda, ' + h.per_tipe.pgk + ' pilihan ganda kompleks, ' + h.per_tipe.isian + ' isian.'));
      if (h.gambar_kosong.length) {
        hasil.appendChild(el('p', { class: 'tanda-gambar' }, 'Gambar belum diisi pada soal ' + h.gambar_kosong.join(', ') + '. Isi lewat editor soal setelah impor.'));
      }
      if (h.peringatan.length) {
        hasil.appendChild(el('p', { class: 'redup' }, 'Peringatan (tidak menghentikan impor):'));
        hasil.appendChild(el('ul', null, h.peringatan.map(function (x) { return el('li', null, x); })));
      }
      hasil.appendChild(el('h3', null, 'Pratinjau' + (h.jumlah > h.pratinjau.length ? ' (' + h.pratinjau.length + ' soal pertama)' : '')));
      h.pratinjau.forEach(function (soal, n) {
        var w = el('div', { class: 'import-pra' }, window.soalSiswaEl(soal, n + 1, h.jumlah));
        hasil.appendChild(w);
      });
    }

    var tbPeriksa = el('button', { type: 'button', class: 'btn', onclick: function () {
      tbPeriksa.disabled = true; setel(null);
      kirim(true).then(function (h) { setel(h); tampilHasil(h); })
        .catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) galat.textContent = e.message; })
        .then(function () { tbPeriksa.disabled = false; });
    } }, 'Periksa');
    var tbSalin = el('button', { type: 'button', class: 'btn btn-teks', onclick: function () { salinTeks(PROMPT_AI); } }, 'Salin prompt untuk AI');

    function jalankan(modal) {
      tbImpor.disabled = true;
      kirim(false).then(function (h) {
        modal.close();
        window.toast(h.jumlah + ' soal diimpor.');
        muatSoal();
      }).catch(function (e) {
        tbImpor.disabled = false;
        if (e.message.indexOf('SESI_ADMIN') !== 0) galat.textContent = e.message;
      });
    }
    function impor(modal) {
      if (!terperiksa) { galat.textContent = 'Klik "Periksa" dulu sebelum mengimpor.'; return false; }
      if (modeGanti.checked && daftarSoal.length) {
        window.openModal({
          judul: 'Ganti semua soal?',
          isi: 'Semua ' + daftarSoal.length + ' soal yang ada di ujian ini akan dihapus dan diganti ' + terperiksa.jumlah + ' soal dari import. Tindakan ini tidak bisa dibatalkan.',
          tombol: [{ teks: 'Batal' }, { teks: 'Ganti semua', bahaya: true, aksi: function () { jalankan(modal); } }]
        });
        return false;
      }
      jalankan(modal);
      return false;
    }

    var badan = el('div', null,
      el('p', { class: 'redup' }, 'Ujian: ' + (u ? labelUjian(u) : '')),
      el('div', { class: 'bar' }, tbSalin, berkas),
      kotak,
      el('div', { class: 'cek-baris' },
        el('label', { class: 'cek' }, modeTambah, el('span', null, 'Tambahkan ke soal yang ada')),
        el('label', { class: 'cek' }, modeGanti, el('span', null, 'Ganti semua soal'))),
      galat, hasil);
    var modal = window.openModal({
      judul: 'Import JSON', isi: badan, lebar: true, tutupDiLuar: false,
      tombol: [{ teks: 'Batal' }, { teks: 'Periksa dan impor', utama: true, aksi: impor }]
    });
    modal.el.querySelector('.modal-kaki').insertBefore(tbPeriksa, modal.el.querySelector('.modal-kaki').firstChild);
    var tbImpor = modal.el.querySelector('.btn-utama');
    tbImpor.textContent = 'Impor';
    tbImpor.disabled = true;
  }

  function bukaEditor(soal, indeks) {
    window.Editor.buka({
      tok: function () { return tokenAdmin; },
      ujianId: ujianTerpilih, soal: soal,
      nomor: soal ? indeks + 1 : daftarSoal.length + 1,

    });
  }

  function geserSoal(i, arah) {
    var j = i + arah;
    if (j < 0 || j >= daftarSoal.length) return;
    var ids = daftarSoal.map(function (x) { return x.id; });
    var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
    window.call('adminSoalUrut', tokenAdmin, ujianTerpilih, ids).then(muatSoal).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true);
    });
  }

  // ---------- tab Hasil ----------

  var daftarHasil = [];

  function tampilHasilTab() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    if (daftarUjian.length) { gambarHasilTab(); return; }
    p.appendChild(el('div', { class: 'kerangka' }));
    window.call('adminUjianList', tokenAdmin).then(function (d) {
      daftarUjian = d;
      gambarHasilTab();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;

    });
  }

  function gambarHasilTab() {
    var p = document.getElementById('panelAdmin');
    p.textContent = '';
    if (!daftarUjian.length) {
      p.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada ujian. Buat ujian dulu di tab Ujian.')));
      return;
    }
    p.appendChild(el('div', { class: 'bar' },
      pilihanUjian(muatHasil),
      el('button', { class: 'btn', type: 'button', onclick: muatHasil }, 'Muat ulang'),

  function muatHasil() {
    var d = document.getElementById('daftarHasil');
    d.textContent = '';
    d.appendChild(el('div', { class: 'kerangka' }));
    var untuk = ujianTerpilih;
    window.call('adminHasil', tokenAdmin, untuk).then(function (h) {
      if (untuk !== ujianTerpilih) return;
      daftarHasil = h;
      gambarHasil();
    }).catch(function (e) {
      if (e.message.indexOf('SESI_ADMIN') === 0) return;
      d.textContent = ''; d.appendChild(el('p', { class: 'kosong' }, e.message));
    });
  }

  function waktuRingkas(detik) {
    var d = Math.max(0, Math.round(Number(detik) || 0)), j = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), s = d % 60;
    var dua = function (x) { return (x < 10 ? '0' : '') + x; };
    return (j ? j + ':' + dua(m) : String(m)) + ':' + dua(s);
  }

  function tanggalRingkas(iso) {
    var t = new Date(iso);
    if (isNaN(t.getTime())) return '';
    try { return t.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return t.toLocaleString(); }
  }

  /** Nomor peringkat; yang sama persis pada nilai, benar, salah, dan waktu berbagi peringkat. */
  function peringkat(daftar) {
    var hasil = [];
    daftar.forEach(function (r, i) {
      var b = daftar[i - 1];
      var sama = b && b.skor === r.skor && b.benar === r.benar && b.salah === r.salah && b.durasi_detik === r.durasi_detik;
      hasil.push(sama ? hasil[i - 1] : i + 1);
    });
    return hasil;
  }

  function gambarHasil() {
    var d = document.getElementById('daftarHasil');
    d.textContent = '';
    document.getElementById('tbCsv').disabled = !daftarHasil.length;
    if (!daftarHasil.length) {
      d.appendChild(el('div', { class: 'tabel-bungkus' }, el('p', { class: 'kosong' }, 'Belum ada siswa yang menyelesaikan ujian ini.')));
      return;
    }
    d.appendChild(el('p', { class: 'redup' }, daftarHasil.length + ' hasil. Urutan: nilai tertinggi, benar terbanyak, salah tersedikit, lalu waktu tercepat.'));
    var rank = peringkat(daftarHasil);
    var tbody = el('tbody');
    daftarHasil.forEach(function (r, i) {
      tbody.appendChild(el('tr', null,
        el('td', null, String(rank[i])),
        el('td', null, el('strong', null, r.nama)),
        el('td', null, r.nomor_peserta || '-'),
        el('td', null, r.kelas || '-'),
        el('td', null, r.sekolah || '-'),
        el('td', null, String(r.benar)), el('td', null, String(r.salah)), el('td', null, String(r.kosong)),
        el('td', null, el('strong', null, String(r.skor))),
        el('td', null, waktuRingkas(r.durasi_detik)),
        el('td', null, tanggalRingkas(r.selesai_at)),
        el('td', { class: 'aksi' }, el('button', { class: 'btn btn-teks', type: 'button', onclick: function () { hapusHasil(r); } }, 'Reset'))));
    });
    var judul = ['Peringkat', 'Nama', 'Nomor', 'Kelas', 'Sekolah', 'Benar', 'Salah', 'Kosong', 'Nilai', 'Waktu', 'Selesai', ''];
    d.appendChild(el('div', { class: 'tabel-bungkus' }, el('table', { class: 'tabel' },
      el('thead', null, el('tr', null, judul.map(function (t) { return el('th', null, t); }))), tbody)));
  }

  function hapusHasil(r) {
    window.openModal({
      judul: 'Reset hasil ini?',
      isi: 'Hasil ' + r.nama + ' (nilai ' + r.skor + ') akan dihapus agar ia dapat mengulang ujian dari awal. Tindakan ini tidak bisa dibatalkan.',
      tombol: [
        { teks: 'Batal' },
        { teks: 'Reset hasil', bahaya: true, aksi: function () {
          window.call('adminSesiHapus', tokenAdmin, r.id).then(function () {
            window.toast('Hasil direset. Siswa dapat mengulang ujian.'); muatHasil();
          }).catch(function (e) { if (e.message.indexOf('SESI_ADMIN') !== 0) window.toast(e.message, true); });
        } }
      ]
    });
  }

  /** Sel CSV: kutip bila perlu; awalan rumus (= + - @) diberi apostrof agar tidak dijalankan Excel. */
  function selCsv(v) {
    var t = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function eksporCsv() {
    if (!daftarHasil.length) return;
    var u = daftarUjian.filter(function (x) { return x.id === ujianTerpilih; })[0];
    var rank = peringkat(daftarHasil);
    var koma = function (n) { return String(n).replace('.', ','); };
    var baris = [['Peringkat', 'Nama', 'Nomor peserta', 'Kelas', 'Sekolah', 'Benar', 'Salah', 'Kosong', 'Nilai', 'Waktu pengerjaan', 'Waktu (detik)', 'Selesai']];
    daftarHasil.forEach(function (r, i) {
      baris.push([rank[i], r.nama, r.nomor_peserta || '', r.kelas || '', r.sekolah || '', r.benar, r.salah, r.kosong,
        koma(r.skor), waktuRingkas(r.durasi_detik), r.durasi_detik, r.selesai_at]);
    });
    // Titik koma dan koma desimal agar terbuka rapi di Excel berbahasa Indonesia; BOM agar huruf Arab/Latin utuh.
    var csv = '﻿' + baris.map(function (b) { return b.map(selCsv).join(';'); }).join('\r\n');
    var aman = function (t) { return String(t || '').trim().replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, ''); };
    var tautan = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: 'Hasil_' + (aman(u && u.nama) || 'Ujian') + '.csv' });
    document.body.appendChild(tautan);
    tautan.click();
    setTimeout(function () { URL.revokeObjectURL(tautan.href); tautan.remove(); }, 1000);
  }

  var btn = document.getElementById('btnAdmin');
  btn.hidden = false;
  btn.addEventListener('click', function () {
    if (tokenAdmin) tampilAdmin(); else bukaLogin();
  });
  tokenAdmin = bacaTokenTersimpan();
})();
