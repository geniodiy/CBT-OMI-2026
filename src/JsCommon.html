  // ---- indikator muat: bilah tipis di atas layar, muncul bila panggilan server > 150 ms ----
  var menunggu = 0, pewaktuBilah = null;
  function bilahNaik() {
    menunggu++;
    if (menunggu === 1) {
      pewaktuBilah = setTimeout(function () {
        var b = document.getElementById('bilahMuat');
        if (b) b.classList.add('aktif');
      }, 150);
    }
  }
  function bilahTurun() {
    menunggu = Math.max(0, menunggu - 1);
    if (menunggu === 0) {
      clearTimeout(pewaktuBilah);
      var b = document.getElementById('bilahMuat');
      if (b) b.classList.remove('aktif');
    }
  }

  /** Panggil fungsi server. Menolak dengan Error berpesan Indonesia. */
  window.call = function (fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    bilahNaik();
    return new Promise(function (ok, gagal) {
      google.script.run
        .withSuccessHandler(function (h) { bilahTurun(); ok(h); })
        .withFailureHandler(function (e) {
          bilahTurun();
          var pesan = String((e && e.message) || e || 'Terjadi kesalahan. Coba lagi.').replace(/^Error:\s*/, '');

  /**

  var janjiPdf = null;

    function dapatDiketik(e) {
      return !!e && e.nodeType === 1 && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName) || e.isContentEditable) &&
        !(e.tagName === 'INPUT' && /^(checkbox|radio|button|submit|file|range|color)$/.test(e.type));
    }
    function atur() {
      if (window.innerWidth !== lebarAwal) { lebarAwal = window.innerWidth; tinggiPenuh = window.innerHeight; }
      tinggiPenuh = Math.max(tinggiPenuh, window.innerHeight);
      var h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0;
      root.style.setProperty('--vv-h', Math.round(h) + 'px');
      root.style.setProperty('--vv-top', Math.round(top) + 'px');
      document.body && document.body.classList.toggle('kbd-aktif', tinggiPenuh - h > 120);
    }
    /** Memindahkan elemen ke bagian atas area terlihat; di dalam popup yang menggulir, gulir isi popup. */
    function naikkan(el, caret) {
      if (!el || !el.getBoundingClientRect) return;
      var r = caret || el.getBoundingClientRect(), tinggi = (vv && vv.height) || window.innerHeight;
      var batasAtas = tinggi * 0.12, batasBawah = tinggi * 0.34;
      var wadah = el.closest ? el.closest('.modal-badan') : null;
      if (r.top >= batasAtas && r.bottom <= batasBawah) return;
      var selisih = r.top - tinggi * 0.2;
      if (wadah) wadah.scrollTo({ top: wadah.scrollTop + selisih, behavior: 'smooth' });
      else window.scrollBy({ top: selisih, left: 0, behavior: 'smooth' });
    }
    function posisiCaret() {
      var sel = window.getSelection && window.getSelection();
      if (!sel || !sel.rangeCount) return null;
      var rg = sel.getRangeAt(0).cloneRange(); rg.collapse(false);
      var rc = rg.getClientRects()[0] || rg.getBoundingClientRect();
      return rc && (rc.top || rc.bottom) ? rc : null;
    }
    if (vv) { vv.addEventListener('resize', atur); vv.addEventListener('scroll', atur); }
    window.addEventListener('resize', atur);
    window.addEventListener('orientationchange', function () { setTimeout(atur, 300); });
    document.addEventListener('focusin', function (e) {
      if (!window.layarSentuh() || !dapatDiketik(e.target)) return;
      clearTimeout(lepas);
      document.body.classList.add('kbd-fokus');
      var el = e.target;
      clearTimeout(jadwal);
      jadwal = setTimeout(function () { naikkan(el); }, 380);   // menunggu popup selesai disusun ulang
    });
    document.addEventListener('focusout', function () {
      clearTimeout(lepas);
      lepas = setTimeout(function () { if (!dapatDiketik(document.activeElement)) document.body.classList.remove('kbd-fokus'); }, 300);
    });
    // Saat mengetik di editor/kolom panjang, pastikan tulisan yang sedang diketik tetap di atas keyboard.
    document.addEventListener('input', function (e) {
      if (!window.layarSentuh() || !dapatDiketik(e.target)) return;
      var rc = e.target.isContentEditable ? posisiCaret() : null;
      var tinggi = (vv && vv.height) || window.innerHeight;
      if (rc && rc.bottom > tinggi * 0.45) naikkan(e.target, rc);
    });
    atur();
  })();
})();
</script>
