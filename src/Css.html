<style>
:root {
  --biru: #1879bd; --biru-tua: #125d93; --biru-muda: #e8f3fb;
  --merah: #d3202b; --hijau: #17803d; --emas: #e3b505;
  --teks: #1c2733; --teks-redup: #5b6773;
  --garis: #dde3ea; --latar: #f4f6f8; --putih: #ffffff;
  --radius: 8px;
  /* Halaman ujian meniru CBT OMI: kaca tembus pandang, bayangan lembut bernuansa biru, gerak pegas. */
  --ease-pegas: cubic-bezier(.32, .72, 0, 1);
  --kaca: rgba(255, 255, 255, .74);
  --kaca-tepi: rgba(255, 255, 255, .92);
  --garis-lembut: rgba(36, 76, 120, .10);
  --biru-timer: #2f5f98;
  --bayangan-lembut: 0 1px 2px rgba(38, 70, 110, .06), 0 10px 28px -10px rgba(38, 70, 110, .16);
  --bayangan-angkat: 0 2px 4px rgba(38, 70, 110, .08), 0 16px 32px -12px rgba(38, 70, 110, .26);
  --latar-ujian: radial-gradient(900px 520px at 12% 4%, rgba(125, 190, 235, .30), transparent 62%),
    radial-gradient(760px 520px at 92% 12%, rgba(196, 176, 242, .22), transparent 62%),
    radial-gradient(900px 620px at 55% 105%, rgba(150, 224, 205, .24), transparent 62%), #eef3f8;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--latar); color: var(--teks);
  font: 400 16px/1.55 "Plus Jakarta Sans", system-ui, "Segoe UI", Roboto, sans-serif;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .75em; }
.redup { color: var(--teks-redup); font-weight: 400; }
:focus-visible { outline: 2px solid var(--biru); outline-offset: 2px; }

/* header */
.header {
  display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 20px;
  background: var(--putih); border-bottom: 1px solid var(--garis);
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo img { height: 40px; width: auto; display: block; }
.header-judul { flex: 1; display: flex; flex-direction: column; line-height: 1.2; font-size: 1.05rem; }
.header-judul .redup { font-size: .8rem; }
.header-judul { min-width: 0; }
.header-aksi { flex: none; }
@media (max-width: 600px) {
  .header { padding: 0 12px; gap: 8px; }
  .header-logo { gap: 6px; flex: none; }
  .header-logo img { height: 32px; }
  .header-judul { font-size: .9rem; line-height: 1.25; }
  .header-aksi .btn { padding: 0 8px; }
}

#app { padding: 24px 20px; max-width: 1200px; margin: 0 auto; }
@media (max-width: 600px) { #app { padding: 16px 12px; } }

/* tombol */
.btn {
  font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; cursor: pointer;
  border-radius: var(--radius); border: 1px solid var(--garis); background: var(--putih); color: var(--teks);
}
.btn { transition: transform .25s var(--ease-pegas), background-color .25s, border-color .25s, box-shadow .25s var(--ease-pegas), opacity .2s; }
.btn:hover { border-color: var(--biru); }
.btn:active:not([disabled]) { transform: scale(.98); }
.btn-utama { background: var(--biru); border-color: var(--biru); color: var(--putih); }
.btn-utama:hover { background: var(--biru-tua); border-color: var(--biru-tua); }
.btn-bahaya { background: var(--merah); border-color: var(--merah); color: var(--putih); }
.btn-bahaya:hover { background: #b01a24; border-color: #b01a24; }
.btn-teks { border-color: transparent; background: transparent; color: var(--biru-tua); }
.btn-teks:hover { background: var(--biru-muda); border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* formulir */
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; color: inherit;
  background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius);
}
.field .galat { color: var(--merah); font-size: .9rem; margin-top: 4px; }

/* modal */
.modal-latar {
  position: fixed; inset: 0; z-index: 50; background: rgba(28, 39, 51, .45);
  display: flex; align-items: flex-start; justify-content: center; padding: 5vh 12px; overflow-y: auto;
  animation: pudar .25s ease-out both;
}
.modal {
  width: 100%; max-width: 520px; background: var(--putih); border-radius: var(--radius);
  border: 1px solid var(--garis); box-shadow: 0 8px 24px rgba(28, 39, 51, .18);
  animation: modalMasuk .4s var(--ease-pegas) both;
}
.modal-lebar { max-width: 900px; }
.modal-kepala { padding: 18px 20px 0; }
.modal-kepala h2 { margin: 0; }
.modal-badan { padding: 14px 20px; }
.modal-kaki { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 0 20px 18px; }

/* tab dan tabel admin */
.tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--garis); margin-bottom: 16px; }
.tab { font: inherit; font-weight: 600; min-height: 44px; padding: 0 14px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--teks-redup); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--biru-tua); border-bottom-color: var(--biru); }
.tabs .spacer { flex: 1; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.bar h2 { margin: 0; }
.tabel-bungkus { overflow-x: auto; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius); }
table.tabel { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tabel th, .tabel td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--garis); vertical-align: top; }
.tabel th { font-weight: 600; color: var(--teks-redup); white-space: nowrap; }
.tabel tr:last-child td { border-bottom: 0; }
.tabel .aksi { white-space: nowrap; text-align: right; }
.tabel .btn { min-height: 36px; padding: 0 10px; }
.tabel code { font-family: ui-monospace, Consolas, monospace; }
.kosong { padding: 24px; text-align: center; color: var(--teks-redup); }
.status-aktif { color: var(--hijau); font-weight: 600; }
.status-mati { color: var(--teks-redup); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
.cek { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.cek input { width: 20px; height: 20px; min-height: 0; }
.baris-token { display: flex; gap: 8px; }
.baris-token input { flex: 1; }

/* editor soal */
.btn-kecil { min-height: 36px; padding: 0 12px; }
.editor { border: 1px solid var(--garis); border-radius: var(--radius); background: var(--putih); }
.editor-tb { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid var(--garis); }
.btn-tb { font: inherit; min-width: 36px; min-height: 36px; padding: 0 8px; border: 1px solid var(--garis); border-radius: 6px; background: var(--putih); color: var(--teks); cursor: pointer; }
.btn-tb:hover { border-color: var(--biru); }
.btn-tb.aktif { background: var(--biru-muda); border-color: var(--biru); color: var(--biru-tua); }
.editor-area { min-height: 96px; padding: 10px 12px; outline: none; overflow-wrap: anywhere; }
.editor-area:focus { box-shadow: inset 0 0 0 2px var(--biru); border-radius: 0 0 var(--radius) var(--radius); }
.editor-mini .editor-area, .editor-area.editor-mini { min-height: 44px; }
.rumus-panel { padding: 10px; border-bottom: 1px solid var(--garis); background: var(--latar); }
.rumus-cepat { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.rumus-ta { width: 100%; padding: 8px 10px; font: .95rem/1.4 ui-monospace, Consolas, monospace; border: 1px solid var(--garis); border-radius: var(--radius); margin-bottom: 6px; }
.rumus-pra { min-height: 36px; padding: 6px 0; overflow-x: auto; }
.bagian { border: 1px solid var(--garis); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
.bagian-kepala { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.bagian-kepala select { min-height: 36px; padding: 0 8px; font: inherit; border: 1px solid var(--garis); border-radius: 6px; background: var(--putih); }
.spacer { flex: 1; }
.pra-gambar { display: block; max-width: 100%; max-height: 240px; margin-top: 8px; object-fit: contain; }
.opsi-baris { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.opsi-ed { flex: 1; min-width: 0; }
.kontrol-kunci { padding-top: 6px; }
.opsi-huruf { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 32px; margin-top: 6px; border: 1px solid var(--garis); background: var(--putih); font-weight: 600; }
.opsi-huruf.bulat { border-radius: 50%; }
.opsi-huruf.kotak { border-radius: 6px; }
h3 { margin-top: 18px; }

/* perataan teks soal (satu-satunya kelas yang lolos sanitasi) */
.rata-kiri { text-align: left; }
.rata-tengah { text-align: center; }
.rata-kanan { text-align: right; }
.rata-penuh { text-align: justify; }

/* tampilan soal (siswa dan pratinjau admin) */
.kartu-soal { position: relative; overflow: hidden; background: var(--kaca); border: 1px solid var(--kaca-tepi); border-radius: 22px; box-shadow: var(--bayangan-lembut), inset 0 1px 0 rgba(255, 255, 255, .9); padding: 26px 28px 22px; }
.u-progres { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(24, 121, 189, .10); }
.u-progres i { display: block; height: 100%; width: 100%; background: var(--biru); border-radius: 0 4px 4px 0; transform-origin: left center; transform: scaleX(0); transition: transform .6s var(--ease-pegas); }
.kartu-isi { animation: soalMasuk .45s var(--ease-pegas) both; }
.kartu-isi[data-arah="mundur"] { animation-name: soalMasukMundur; }
.kartu-isi.tenang, .kartu-isi.tenang .opsi { animation: none; }
.kartu-kepala { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; color: var(--teks-redup); }
.kartu-kepala strong { color: var(--teks); }
.kartu-badan { font-size: 1.0625rem; line-height: 1.7; text-wrap: pretty; }
.kartu-badan b:first-child { text-decoration: underline; text-underline-offset: 3px; }
.instruksi { display: inline-block; font-weight: 700; font-size: .92rem; margin: 18px 0 14px; padding: 8px 18px; border-radius: 999px; background: rgba(255, 255, 255, .85); border: 1px solid rgba(24, 121, 189, .28); box-shadow: 0 6px 16px -10px rgba(38, 70, 110, .35); }
.opsi { display: flex; gap: 14px; align-items: center; padding: 12px 16px; margin-bottom: 12px; border: 1px solid var(--garis-lembut); border-radius: 16px; background: rgba(255, 255, 255, .82); box-shadow: 0 1px 2px rgba(38, 70, 110, .05), 0 8px 18px -12px rgba(38, 70, 110, .22); animation: naikMasuk .5s var(--ease-pegas) both; animation-delay: calc(var(--n, 0) * 50ms + 120ms); transition: transform .3s var(--ease-pegas), box-shadow .3s var(--ease-pegas), background-color .25s, border-color .25s; }
.opsi:hover { transform: translateY(-1px); box-shadow: var(--bayangan-angkat); }
.opsi:active { transform: scale(.985); }
.opsi .opsi-huruf { margin-top: 0; width: 36px; height: 36px; border-radius: 10px; background: #fff; border: 1px solid var(--garis-lembut); box-shadow: 0 2px 6px -2px rgba(38, 70, 110, .25); transition: background-color .25s, color .25s, border-color .25s, transform .35s var(--ease-pegas); }
.opsi .opsi-huruf.bulat { border-radius: 10px; }
.opsi-teks { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opsi-centang { flex: none; display: inline-flex; color: var(--biru); opacity: 0; transform: scale(.4); transition: opacity .25s, transform .4s var(--ease-pegas); }
.opsi.terpilih .opsi-centang { opacity: 1; transform: scale(1); }
.isian-siswa { width: 100%; min-height: 52px; padding: 10px 16px; font: inherit; border: 1px solid var(--garis-lembut); border-radius: 16px; background: rgba(255, 255, 255, .9); box-shadow: inset 0 1px 3px rgba(38, 70, 110, .08); transition: border-color .25s, box-shadow .25s; }
.isian-siswa:focus { border-color: var(--biru); box-shadow: 0 0 0 4px rgba(24, 121, 189, .14); outline: none; }

/* daftar soal admin */
.soal-baris { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; padding: 12px; border-bottom: 1px solid var(--garis); align-items: start; }
.soal-baris:last-child { border-bottom: 0; }
.soal-no { font-weight: 700; color: var(--biru-tua); }
.soal-ringkas { max-height: 5.6em; overflow: hidden; overflow-wrap: anywhere; }
.soal-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; font-size: .9rem; color: var(--teks-redup); }
.tanda-gambar { color: var(--merah); font-weight: 600; }
.soal-aksi { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; }
@media (max-width: 600px) { .soal-baris { grid-template-columns: 36px 1fr; } .soal-aksi { grid-column: 1 / -1; justify-content: flex-start; } }

/* import */
.import-ta { width: 100%; padding: 10px 12px; font: .9rem/1.45 ui-monospace, Consolas, monospace; border: 1px solid var(--garis); border-radius: var(--radius); }
.cek-baris { display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0; }
.import-hasil ul { margin: 0 0 12px; padding-left: 20px; }
.import-pra { margin-bottom: 12px; }

/* beranda siswa */
.kelompok { margin: 28px 0 12px; }
.grid-ujian { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid-ujian { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .grid-ujian { grid-template-columns: 1fr; } }
.kontainer { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; font: inherit; color: inherit; padding: 16px; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius); cursor: pointer; }
button.kontainer:hover { border-color: var(--biru); }
.kontainer-atas { display: flex; gap: 8px; align-items: center; }
.kontainer-mapel { font-size: 1.1rem; }
.kontainer-nama { overflow-wrap: anywhere; }
.kontainer-pilih { margin-top: 6px; align-self: flex-end; font-weight: 600; color: var(--biru-tua); }
.lanjut-kotak { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin: 12px 0; border: 1px solid var(--biru); border-radius: var(--radius); background: var(--biru-muda); }
.footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--garis); color: var(--teks-redup); font-size: .9rem; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin: 0 0 6px; }
@media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
.info-grid dt { color: var(--teks-redup); font-size: .9rem; }
.info-grid dd { margin: 0; font-weight: 600; }
.daftar-info { margin: 0 0 8px; padding-left: 20px; }
.daftar-info li { margin-bottom: 4px; }
.catatan { white-space: pre-line; margin: 0 0 8px; padding: 10px 12px; background: var(--latar); border-radius: var(--radius); }

/* halaman ujian: meniru CBT OMI */
body.mode-ujian { background: var(--latar-ujian) fixed; min-height: 100dvh; }
body.mode-ujian .header { background: transparent; border-bottom-color: transparent; }
body.mode-ujian #app { max-width: 1480px; }
.ujian { display: grid; grid-template-columns: 300px minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
/* backwards, bukan both: transform sisa animasi akan membuat anak position:fixed (laci, tombol bawah) menempel ke induknya. */
.ujian > * { animation: naikMasuk .65s var(--ease-pegas) backwards; }
.ujian > :nth-child(2) { animation-delay: .08s; }
.ujian > :nth-child(3) { animation-delay: .16s; }
.u-side, .u-panel { background: var(--kaca); border: 1px solid var(--kaca-tepi); border-radius: 22px; box-shadow: var(--bayangan-lembut), inset 0 1px 0 rgba(255, 255, 255, .9); padding: 20px; }
.u-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 6px; min-height: calc(100dvh - 120px); }
.u-avatar { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient(145deg, #5fa8dc, var(--biru)); color: #fff; font-weight: 700; font-size: 1.2rem; margin-bottom: 8px; box-shadow: 0 8px 18px -8px rgba(24, 121, 189, .6); }
.u-nama { overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: .01em; line-height: 1.3; }
.u-lencana { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.u-menu { margin-top: auto; display: grid; gap: 6px; padding-top: 24px; }
.u-menu-item { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; font: inherit; font-weight: 600; text-align: left; color: var(--teks-redup); background: transparent; border: 0; border-radius: 14px; cursor: pointer; transition: background-color .25s, color .25s, transform .25s var(--ease-pegas); }
.u-menu-item:hover { background: rgba(255, 255, 255, .7); color: var(--teks); }
.u-menu-item:active { transform: scale(.98); }
.u-menu-item.aktif { background: rgba(24, 121, 189, .12); color: var(--biru-tua); }
.u-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.u-nav .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; }
.u-nav .btn-utama { box-shadow: 0 12px 22px -12px rgba(24, 121, 189, .7); }
.u-posisi { display: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.u-panel { position: sticky; top: 16px; }
.u-waktu { text-align: center; margin-bottom: 14px; }
.u-waktu-label { display: inline-flex; align-items: center; gap: 8px; color: var(--teks-redup); font-weight: 600; font-size: .92rem; }
.u-timer { font-size: 2.4rem; font-weight: 700; letter-spacing: .01em; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--biru-timer); transition: color .4s; }
.u-timer.mepet { color: var(--merah); animation: kedip 1.4s ease-in-out infinite; }
.u-aksi { display: grid; gap: 10px; margin-bottom: 18px; }
.u-aksi .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 14px; background: rgba(255, 255, 255, .85); border-color: var(--kaca-tepi); box-shadow: var(--bayangan-lembut); }
.u-aksi .btn:hover { transform: translateY(-1px); box-shadow: var(--bayangan-angkat); border-color: rgba(24, 121, 189, .35); }
.u-aksi .btn:active { transform: scale(.98); }
.u-aksi .btn-bahaya { background: var(--merah); border-color: var(--merah); box-shadow: 0 14px 24px -14px rgba(211, 32, 43, .75); }
.u-aksi .btn-bahaya:hover { background: #b91d27; border-color: #b91d27; box-shadow: 0 16px 28px -14px rgba(211, 32, 43, .85); }
.u-daftar-kepala { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.u-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.sel { min-height: 46px; font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid var(--garis-lembut); border-radius: 12px; background: rgba(255, 255, 255, .9); color: var(--teks); cursor: pointer; box-shadow: 0 6px 12px -8px rgba(38, 70, 110, .3); transition: transform .3s var(--ease-pegas), background-color .3s, color .3s, border-color .3s, box-shadow .3s var(--ease-pegas); }
.sel:hover { transform: translateY(-2px); box-shadow: var(--bayangan-angkat); }
.sel:active { transform: scale(.95); }
.sel.terjawab { background: var(--biru-muda); color: var(--biru-tua); border-color: rgba(24, 121, 189, .25); }
.sel.baru { animation: terjawabBaru .5s var(--ease-pegas); }
.sel.aktif { border: 2px solid var(--biru); box-shadow: 0 0 0 4px rgba(24, 121, 189, .14); }
.u-laci-tombol, .u-lapis, .u-timer-mobile { display: none; }
.opsi { cursor: pointer; min-height: 52px; position: relative; }
.opsi input { position: absolute; opacity: 0; pointer-events: none; }
.opsi.terpilih { background: #eaf4fc; border-color: var(--biru); }
.opsi.terpilih .opsi-huruf { background: var(--biru); border-color: var(--biru); color: #fff; transform: scale(1.06); }
.opsi:has(input:focus-visible) { outline: 2px solid var(--biru); outline-offset: 3px; }
.gambar-gagal { padding: 12px; margin-bottom: .75em; border: 1px dashed var(--garis); border-radius: 12px; color: var(--teks-redup); }

@keyframes naikMasuk { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes soalMasuk { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes soalMasukMundur { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes pudar { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalMasuk { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
