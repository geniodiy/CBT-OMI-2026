<style>
:root {
  --biru: #1879bd; --biru-tua: #125d93; --biru-muda: #e8f3fb;

* { box-sizing: border-box; }

/* formulir */

/* tab dan tabel admin */

/* editor soal */

/* tampilan soal (siswa dan pratinjau) */

.ujian { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; gap: 16px; align-items: start; }

.u-aksi { display: grid; gap: 8px; margin-bottom: 16px; }
.u-daftar-kepala { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.u-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sel { min-height: 44px; font: inherit; font-weight: 600; border: 1px solid var(--garis); border-radius: 6px; background: var(--putih); color: var(--teks); cursor: pointer; }

.sel.aktif { border: 2px solid var(--biru); }
.u-laci-tombol { display: none; width: 100%; }
.opsi { position: relative; cursor: pointer; min-height: 44px; }
.opsi input { position: absolute; opacity: 0; pointer-events: none; }
.opsi.terpilih { background: var(--biru-muda); border-color: var(--biru); }
.opsi.terpilih .opsi-huruf { background: var(--biru); border-color: var(--biru); color: var(--putih); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* hasil */
.hasil { max-width: 820px; margin: 0 auto; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius); padding: 24px; }

.hasil-ujian { margin: 0 0 16px; color: var(--teks-redup); }

.tabel-gulir { overflow-x: auto; }

.hasil-aksi { max-width: 820px; margin: 16px auto 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pdf-gudang { position: fixed; left: -10000px; top: 0; width: 190mm; background: #ffffff; color: #1c2733; }

@media print {
