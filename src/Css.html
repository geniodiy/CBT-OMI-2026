<style>
:root {
  --biru: #1879bd; --biru-tua: #125d93; --biru-muda: #e8f3fb;
  --merah: #d3202b; --hijau: #17803d; --emas: #e3b505;
  --teks: #1c2733; --teks-redup: #5b6773;
  --garis: #dde3ea; --latar: #f4f6f8; --putih: #ffffff;
  --radius: 10px; --radius-kartu: 14px;
  /* Halaman ujian meniru CBT OMI: kaca tembus pandang, bayangan lembut bernuansa biru, gerak pegas. */
  --ease-pegas: cubic-bezier(.32, .72, 0, 1);
  --kaca: rgba(255, 255, 255, .74);
  --kaca-tepi: rgba(255, 255, 255, .92);
  --garis-lembut: rgba(36, 76, 120, .10);
  --biru-timer: #2f5f98;
  --bayangan-lembut: 0 1px 2px rgba(38, 70, 110, .06), 0 10px 28px -10px rgba(38, 70, 110, .16);
  --bayangan-angkat: 0 2px 4px rgba(38, 70, 110, .08), 0 16px 32px -12px rgba(38, 70, 110, .26);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; font-size: 14px; }
body {
  margin: 0; background: var(--latar); color: var(--teks);
  font: 400 1rem/1.5 "Plus Jakarta Sans", system-ui, "Segoe UI", Roboto, sans-serif;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.15rem; } h3 { font-size: .98rem; }
p { margin: 0 0 .75em; }
.redup { color: var(--teks-redup); font-weight: 400; }
:focus-visible { outline: 2px solid var(--biru); outline-offset: 2px; }

/* header */
.header {
  display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 18px;
  background: var(--putih); border-bottom: 1px solid var(--garis);
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo img { height: 32px; width: auto; display: block; }
.header-logo img:first-child { height: 40px; }
.header-judul { flex: 1; display: flex; flex-direction: column; line-height: 1.2; font-size: .98rem; }
.header-judul .redup { font-size: .75rem; }
.header-judul { min-width: 0; }
.header-aksi { flex: none; }
@media (max-width: 600px) {
  .header { padding: 0 12px; gap: 8px; }
  .header-logo { gap: 6px; flex: none; }
  .header-logo img { height: 26px; }
  .header-logo img:first-child { height: 34px; }
  .header-judul { font-size: .88rem; line-height: 1.25; }
  .header-aksi .btn { padding: 0 8px; }
}

#app { padding: 20px 18px; max-width: 1120px; margin: 0 auto; }
@media (max-width: 600px) { #app { padding: 14px 12px; } }

/* tombol */
.btn {
  font: inherit; font-size: .93rem; font-weight: 600; min-height: 36px; padding: 0 16px; cursor: pointer;
  border-radius: var(--radius); border: 1px solid var(--garis); background: var(--putih); color: var(--teks);
}
.btn { transition: transform .25s var(--ease-pegas), background-color .25s, border-color .25s, box-shadow .25s var(--ease-pegas), opacity .2s; }
.btn:hover { border-color: var(--biru); }
.btn:active:not([disabled]) { transform: scale(.98); }
.btn-utama { background: var(--biru); border-color: var(--biru); color: var(--putih); }
.btn-utama:hover { background: var(--biru-tua); border-color: var(--biru-tua); }
.btn-bahaya { background: var(--merah); border-color: var(--merah); color: var(--putih); }
.btn-bahaya:hover { background: #b01a24; border-color: #b01a24; }
.btn-teks { border-color: transparent; background: transparent; color: var(--biru-tua); }
.btn-teks:hover { background: var(--biru-muda); border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* formulir */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; min-height: 36px; padding: 6px 12px; font: inherit; font-size: .95rem; color: inherit;
  background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius);
}
.field .galat { color: var(--merah); font-size: .9rem; margin-top: 4px; }

/* modal */
.modal-latar {
  position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100%); z-index: 50; background: rgba(28, 39, 51, .45);
  display: flex; align-items: center; justify-content: center; padding: 3vh 12px; overflow: hidden;
  animation: pudar .25s ease-out both;
}
.modal {
  display: flex; flex-direction: column; max-height: 94vh; max-height: calc(var(--vv-h, 100dvh) * .94);
  width: 100%; max-width: 460px; background: var(--putih); border-radius: 16px;
  border: 1px solid var(--garis); box-shadow: 0 8px 24px rgba(28, 39, 51, .18);
  animation: modalMasuk .4s var(--ease-pegas) both;
}
.modal-lebar { max-width: 820px; }
.modal-kepala { flex: none; padding: 16px 18px 0; }
.modal-kepala h2 { margin: 0; font-size: 1.08rem; }
.modal-badan { flex: 1 1 auto; min-height: 0; padding: 12px 18px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.modal-kaki { flex: none; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--garis); background: var(--putih); border-radius: 0 0 16px 16px; }
.modal-kaki[hidden] { display: none; }

/* tab dan tabel admin */
.tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--garis); margin-bottom: 14px; }
.tab { font: inherit; font-size: .93rem; font-weight: 600; min-height: 38px; padding: 0 12px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--teks-redup); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--biru-tua); border-bottom-color: var(--biru); }
.tabs .spacer { flex: 1; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.bar h2 { margin: 0; }
.tabel-bungkus { overflow-x: auto; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius); }
table.tabel { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tabel th, .tabel td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--garis); vertical-align: top; }
.tabel th { font-weight: 600; color: var(--teks-redup); white-space: nowrap; }
.tabel tr:last-child td { border-bottom: 0; }
.tabel .aksi { white-space: nowrap; text-align: right; }
.tabel .btn { min-height: 30px; padding: 0 8px; font-size: .86rem; }
.tabel code { font-family: ui-monospace, Consolas, monospace; }
.petunjuk { font-size: .82rem; }
.kosong { padding: 20px; text-align: center; color: var(--teks-redup); }
.status-aktif { color: var(--hijau); font-weight: 600; }
.status-mati { color: var(--teks-redup); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; }
.grid2 > * { min-width: 0; }
@media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
.cek { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.cek input { width: 18px; height: 18px; min-height: 0; }
.baris-token { display: flex; gap: 8px; }
.baris-token input { flex: 1; }

/* editor soal */
.btn-kecil { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; font-size: .86rem; }
.editor { border: 1px solid var(--garis); border-radius: var(--radius); background: var(--putih); }
.editor-tb { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid var(--garis); }
.btn-tb { font: inherit; font-size: .88rem; min-width: 30px; min-height: 30px; padding: 0 7px; border: 1px solid var(--garis); border-radius: 6px; background: var(--putih); color: var(--teks); cursor: pointer; }
.btn-tb:hover { border-color: var(--biru); }
.btn-tb.aktif { background: var(--biru-muda); border-color: var(--biru); color: var(--biru-tua); }
.editor-area { min-height: 80px; padding: 8px 10px; outline: none; overflow-wrap: anywhere; }
.editor-area:focus { box-shadow: inset 0 0 0 2px var(--biru); border-radius: 0 0 var(--radius) var(--radius); }
.editor-mini .editor-area, .editor-area.editor-mini { min-height: 38px; }
.rumus-panel { padding: 10px; border-bottom: 1px solid var(--garis); background: var(--latar); }
.rumus-cepat { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.rumus-ta { width: 100%; padding: 8px 10px; font: .95rem/1.4 ui-monospace, Consolas, monospace; border: 1px solid var(--garis); border-radius: var(--radius); margin-bottom: 6px; }
.rumus-pra { min-height: 36px; padding: 6px 0; overflow-x: auto; }
.bagian { border: 1px solid var(--garis); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
.bagian-kepala { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.bagian-kepala select { min-height: 30px; padding: 0 8px; font: inherit; font-size: .88rem; border: 1px solid var(--garis); border-radius: 6px; background: var(--putih); }
.spacer { flex: 1; }
.pra-gambar { display: block; max-width: 100%; max-height: 240px; margin-top: 8px; object-fit: contain; }
.opsi-baris { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.opsi-ed { flex: 1; min-width: 0; }
.kontrol-kunci { padding-top: 6px; }
.opsi-huruf { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; margin-top: 4px; border: 1px solid var(--garis); background: var(--putih); font-weight: 600; font-size: .88rem; }
.opsi-huruf.bulat { border-radius: 50%; }
.opsi-huruf.kotak { border-radius: 6px; }
h3 { margin-top: 14px; }

/* perataan teks soal (satu-satunya kelas yang lolos sanitasi) */
.rata-kiri { text-align: left; }
.rata-tengah { text-align: center; }
.rata-kanan { text-align: right; }
.rata-penuh, .blok-teks.auto-penuh { text-align: justify; }

/* tampilan soal (siswa dan pratinjau admin) */
.kartu-soal { position: relative; overflow: hidden; background: var(--kaca); border: 1px solid var(--kaca-tepi); border-radius: 18px; box-shadow: var(--bayangan-lembut), inset 0 1px 0 rgba(255, 255, 255, .9); padding: 20px 22px 18px; }
.u-progres { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(24, 121, 189, .10); }
.u-progres i { display: block; height: 100%; width: 100%; background: var(--biru); border-radius: 0 3px 3px 0; transform-origin: left center; transform: scaleX(0); transition: transform .6s var(--ease-pegas); }
.kartu-isi { animation: soalMasuk .45s var(--ease-pegas) both; }
.kartu-isi[data-arah="mundur"] { animation-name: soalMasukMundur; }
.kartu-isi.tenang, .kartu-isi.tenang .opsi { animation: none; }
.kartu-kepala { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; color: var(--teks-redup); font-size: .92rem; }
.kartu-soal > .kartu-kepala { justify-content: flex-start; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--garis-lembut); flex-wrap: wrap; }
.kartu-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.u-nomor { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--biru); color: #fff; line-height: 1; box-shadow: 0 10px 18px -10px rgba(24, 121, 189, .8); }
.u-nomor small { font-size: .62rem; font-weight: 600; opacity: .85; margin-bottom: 1px; }
.u-nomor b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.lencana-status { background: #e6f4ea; color: var(--hijau); border-color: rgba(23, 128, 61, .25); font-variant-numeric: tabular-nums; }
.u-alat { margin-left: auto; display: flex; gap: 6px; }
.btn-alat { min-width: 34px; height: 34px; padding: 0 8px; display: inline-grid; place-items: center; font: inherit; font-size: .8rem; font-weight: 700; color: var(--teks); background: rgba(255, 255, 255, .9); border: 1px solid var(--garis-lembut); border-radius: 10px; cursor: pointer; box-shadow: 0 1px 2px rgba(38, 70, 110, .06); transition: transform .25s var(--ease-pegas), background-color .2s, border-color .2s, opacity .2s; }
.btn-alat:hover:not(:disabled) { border-color: rgba(24, 121, 189, .45); background: #fff; }
.btn-alat:active:not(:disabled) { transform: scale(.93); }
.btn-alat:disabled { opacity: .4; cursor: not-allowed; }
.btn-alat-utama { background: var(--biru); border-color: var(--biru); color: #fff; }
.btn-alat-utama:hover:not(:disabled) { background: var(--biru-tua); border-color: var(--biru-tua); }
.u-logo { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 12px; background: #fff; border: 1px solid var(--garis-lembut); border-radius: 16px; box-shadow: 0 1px 2px rgba(38, 70, 110, .05); }
.u-logo img { height: 28px; width: auto; display: block; }
.u-logo img:first-child { height: 34px; }
.u-logo strong { display: block; font-size: .86rem; line-height: 1.2; }
.u-logo span { font-size: .72rem; color: var(--teks-redup); }
@media (min-width: 901px) { body[data-halaman="ujian"] .header { display: none; } body[data-halaman="ujian"] .u-side { min-height: calc(100dvh - 40px); } }
@media (max-width: 900px) { .btn-panah { display: none; } .u-logo { display: none; } .kartu-soal > .kartu-kepala .kartu-info { order: 3; flex-basis: 100%; } .kartu-soal > .kartu-kepala .u-alat { order: 2; } }
.kartu-kepala strong { color: var(--teks); }
.kartu-badan { font-size: calc(1rem * var(--skala-huruf, 1)); line-height: 1.65; text-wrap: pretty; }
.opsi-teks, .isian-siswa { font-size: calc(1rem * var(--skala-huruf, 1)); }
.instruksi { display: inline-block; font-weight: 700; font-size: .86rem; margin: 14px 0 12px; padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, .85); border: 1px solid rgba(24, 121, 189, .28); box-shadow: 0 6px 16px -10px rgba(38, 70, 110, .35); }
.opsi { display: flex; gap: 12px; align-items: center; padding: 8px 12px; margin-bottom: 9px; border: 1px solid var(--garis-lembut); border-radius: 14px; background: rgba(255, 255, 255, .82); box-shadow: 0 1px 2px rgba(38, 70, 110, .05), 0 8px 18px -12px rgba(38, 70, 110, .22); animation: naikMasuk .5s var(--ease-pegas) both; animation-delay: calc(var(--n, 0) * 50ms + 120ms); transition: transform .3s var(--ease-pegas), box-shadow .3s var(--ease-pegas), background-color .25s, border-color .25s; }
.opsi:hover { transform: translateY(-1px); box-shadow: var(--bayangan-angkat); }
.opsi:active { transform: scale(.985); }
.opsi .opsi-huruf { margin-top: 0; width: 30px; height: 30px; font-size: .9rem; border-radius: 9px; background: #fff; border: 1px solid var(--garis-lembut); box-shadow: 0 2px 6px -2px rgba(38, 70, 110, .25); transition: background-color .25s, color .25s, border-color .25s, transform .35s var(--ease-pegas); }
.opsi .opsi-huruf.bulat { border-radius: 9px; }
.opsi-teks { flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* penanda pilihan di kanan: lingkaran (pg) atau kotak berisi ceklis (pgk) */
.opsi-tanda { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border: 2px solid #b4c3d3; background: #fff; color: #fff; transition: background-color .25s, border-color .25s, transform .35s var(--ease-pegas); }
.opsi-tanda.bulat { border-radius: 50%; }
.opsi-tanda.kotak { border-radius: 7px; }
.opsi-tanda svg { stroke-width: 3; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .4s var(--ease-pegas); }
.opsi-tanda.bulat::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .35s var(--ease-pegas); }
.opsi.terpilih .opsi-tanda { background: var(--biru); border-color: var(--biru); transform: scale(1.05); }
.opsi.terpilih .opsi-tanda svg { opacity: 1; transform: scale(1); }
.opsi.terpilih .opsi-tanda.bulat::after { transform: scale(1); }
.isian-siswa { width: 100%; min-height: 44px; padding: 8px 14px; font: inherit; border: 1px solid var(--garis-lembut); border-radius: 14px; background: rgba(255, 255, 255, .9); box-shadow: inset 0 1px 3px rgba(38, 70, 110, .08); transition: border-color .25s, box-shadow .25s; }
.isian-siswa:focus { border-color: var(--biru); box-shadow: 0 0 0 4px rgba(24, 121, 189, .14); outline: none; }

/* daftar soal admin */
.soal-baris { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--garis); align-items: start; }
.soal-baris:last-child { border-bottom: 0; }
.soal-no { font-weight: 700; color: var(--biru-tua); }
.soal-ringkas { font-size: .92rem; max-height: 5.2em; overflow: hidden; overflow-wrap: anywhere; }
.soal-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; font-size: .82rem; color: var(--teks-redup); }
.tanda-gambar { color: var(--merah); font-weight: 600; }
.soal-aksi { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; }
@media (max-width: 600px) { .soal-baris { grid-template-columns: 36px 1fr; } .soal-aksi { grid-column: 1 / -1; justify-content: flex-start; } }

/* import */
.import-ta { width: 100%; padding: 8px 10px; font: .82rem/1.45 ui-monospace, Consolas, monospace; border: 1px solid var(--garis); border-radius: var(--radius); }
.cek-baris { display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0; }
.import-hasil ul { margin: 0 0 12px; padding-left: 20px; }
.import-pra { margin-bottom: 12px; }

/* halaman utama */
body[data-halaman="beranda"] #app { max-width: none; padding: 0; }
.isi { max-width: 1120px; margin: 0 auto; padding: 0 18px; }
.pita { padding: 38px 0; }
.pita-putih { background: var(--putih); border-bottom: 1px solid var(--garis); }
.judul-bagian { margin-bottom: 14px; max-width: 62ch; }
.judul-bagian h2 { font-size: 1.35rem; margin-bottom: 4px; }
.judul-bagian p { margin: 0; color: var(--teks-redup); }

.hero { padding: 34px 0 38px; background: var(--putih); border-bottom: 1px solid var(--garis); }
.hero .isi { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 40px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: .84rem; font-weight: 700; color: var(--biru-tua); }
.eyebrow::before { content: ""; width: 22px; height: 3px; border-radius: 2px; background: var(--biru); }
.hero h1 { font-size: clamp(1.9rem, 3.4vw, 2.6rem); line-height: 1.12; letter-spacing: -.025em; margin: 0 0 12px; max-width: 17ch; }
.hero-sub { font-size: 1.05rem; line-height: 1.55; color: var(--teks-redup); max-width: 48ch; margin: 0 0 20px; text-wrap: pretty; }
.hero-aksi { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-aksi .btn { min-height: 42px; padding: 0 20px; }

.filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px; font: inherit; font-size: .9rem; font-weight: 600; color: var(--teks); background: var(--putih); border: 1px solid var(--garis); border-radius: 999px; cursor: pointer; transition: background-color .25s, color .25s, border-color .25s, transform .25s var(--ease-pegas); }
.chip:hover { border-color: rgba(24, 121, 189, .5); }
.chip:active { transform: scale(.97); }
.chip[aria-selected="true"] { background: var(--biru); border-color: var(--biru); color: #fff; }
.chip small { font-size: .78rem; font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }

.grid-ujian { display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 14px; }
.kontainer { display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: left; font: inherit; color: inherit; padding: 16px 16px 14px; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius-kartu); cursor: pointer; animation: naikMasuk .55s var(--ease-pegas) backwards; animation-delay: calc(var(--n, 0) * 55ms); transition: transform .3s var(--ease-pegas), box-shadow .3s var(--ease-pegas), border-color .25s; }
button.kontainer:hover { transform: translateY(-3px); border-color: rgba(24, 121, 189, .45); box-shadow: var(--bayangan-angkat); }
button.kontainer:active { transform: scale(.99); }
.kontainer-atas { display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--teks-redup); }
.kontainer-mapel { font-size: 1.08rem; margin-top: 4px; letter-spacing: -.01em; }
.kontainer-nama { overflow-wrap: anywhere; font-size: .9rem; color: var(--teks-redup); }
.kontainer-meta { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--garis); font-size: .86rem; color: var(--teks-redup); }
.kontainer-meta span { display: inline-flex; align-items: center; gap: 5px; }
.kontainer-pilih { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-weight: 700; color: var(--biru-tua); }
.kontainer-pilih svg { transition: transform .3s var(--ease-pegas); }
button.kontainer:hover .kontainer-pilih svg { transform: translateX(3px); }
.kerangka-kartu { cursor: default; animation: none; }
.kosong-daftar { grid-column: 1 / -1; padding: 28px 18px; text-align: center; background: var(--putih); border: 1px dashed var(--garis); border-radius: var(--radius-kartu); color: var(--teks-redup); }
.kosong-daftar strong { display: block; color: var(--teks); margin-bottom: 4px; }
.lanjut-kotak { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; margin: 0 0 16px; border: 1px solid rgba(24, 121, 189, .4); border-radius: var(--radius-kartu); background: var(--biru-muda); }

.tentang { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: start; }
.tentang p { max-width: 62ch; line-height: 1.65; }
.tema { margin: 18px 0 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--biru); font-size: 1.02rem; font-weight: 600; font-style: italic; line-height: 1.5; max-width: 52ch; }
.fakta { margin: 0; display: grid; }
.fakta div { display: grid; grid-template-columns: 128px 1fr; gap: 14px; padding: 11px 0; border-top: 1px solid var(--garis); }
.fakta div:last-child { border-bottom: 1px solid var(--garis); }
.fakta dt { color: var(--teks-redup); font-size: .9rem; }
.fakta dd { margin: 0; font-weight: 600; }

.aturan { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 40px; align-items: start; }
.tahap { display: grid; }
.tahap-baris { display: grid; grid-template-columns: 112px minmax(0, 1fr) 150px; gap: 14px; padding: 12px 0; border-top: 1px solid var(--garis); align-items: baseline; }
.tahap-baris:last-child { border-bottom: 1px solid var(--garis); }
.tahap-baris strong { font-size: .95rem; }
.tahap-baris .tgl { text-align: right; font-weight: 600; color: var(--biru-tua); font-variant-numeric: tabular-nums; }
.catatan-kecil { margin: 12px 0 0; font-size: .86rem; color: var(--teks-redup); }
.urutan { margin: 0; padding: 0; list-style: none; counter-reset: u; display: grid; gap: 10px; }
.urutan li { counter-increment: u; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.urutan li::before { content: counter(u); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--biru-muda); color: var(--biru-tua); font-weight: 700; font-size: .85rem; }

.footer-situs { background: var(--putih); border-top: 1px solid var(--garis); padding: 26px 0 30px; }
.footer-situs .isi { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
.footer-logo { display: flex; align-items: center; gap: 10px; }
.footer-logo img { height: 34px; width: auto; display: block; }
.footer-situs p { margin: 0 0 4px; font-size: .86rem; color: var(--teks-redup); max-width: 74ch; }
.footer-situs p strong { color: var(--teks); }
.footer-situs a { color: var(--biru-tua); font-weight: 600; }

html.js .muncul { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--ease-pegas), transform .7s var(--ease-pegas); }
html.js .muncul.terlihat { opacity: 1; transform: none; }

@media (max-width: 900px) {
  .hero .isi, .tentang, .aturan { grid-template-columns: 1fr; gap: 24px; }
  .footer-situs .isi { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .pita { padding: 28px 0; }
  .hero { padding: 24px 0 28px; }

  .tahap-baris .tgl { text-align: left; }

  .grid-ujian { grid-template-columns: 1fr; }
}
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin: 0 0 6px; }
@media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
.info-grid dt { color: var(--teks-redup); font-size: .82rem; }
.info-grid dd { margin: 0; font-weight: 600; }
.daftar-info { margin: 0 0 8px; padding-left: 20px; }

/* ---- beranda: gaya hijau lembut selaras panel admin; header datar, hero berfoto, kartu putih. Aksen kuning hanya secuil. ---- */
body[data-halaman="beranda"] { --biru: #1f8a4c; --biru-tua: #14693a; --biru-muda: #e4f3e9; --latar: #f3f7f3; --garis: #e0e9e2; --teks: #14231c; --teks-redup: #587064; --kuning: #e3b505; --radius-kartu: 16px; --bayangan-lembut: 0 1px 2px rgba(20, 60, 40, .05), 0 10px 28px -12px rgba(20, 60, 40, .16); --bayangan-angkat: 0 2px 4px rgba(20, 60, 40, .07), 0 16px 32px -14px rgba(20, 60, 40, .26); }
.header-menu { display: none; gap: 2px; margin-left: auto; }
body[data-halaman="beranda"] .header-menu { display: flex; }
body[data-halaman="beranda"] .header-judul { flex: none; }
.header-menu button { font: inherit; font-size: .9rem; font-weight: 600; color: var(--teks-redup); background: none; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; transition: background-color .2s, color .2s; }
.header-menu button:hover { background: var(--biru-muda); color: var(--biru-tua); }
@media (max-width: 960px) { body[data-halaman="beranda"] .header-menu { display: none; } body[data-halaman="beranda"] .header-judul { flex: 1; } }

body[data-halaman="beranda"] .hero { position: relative; padding: 76px 0 112px; border-bottom: 0; color: #fff; background: var(--foto, none) center / cover #3d7a55; }
body[data-halaman="beranda"] .hero::before { content: ""; position: absolute; inset: 0; background: rgba(16, 76, 44, .56); }
body[data-halaman="beranda"] .hero .isi { position: relative; display: block; }
body[data-halaman="beranda"] .eyebrow { color: #fff; background: rgba(255, 255, 255, .16); padding: 3px 12px; border-radius: 99px; margin-bottom: 16px; font-size: .8rem; }
body[data-halaman="beranda"] .eyebrow::before { width: 7px; height: 7px; border-radius: 50%; background: var(--kuning); }
body[data-halaman="beranda"] .hero h1 { color: #fff; max-width: 21ch; font-size: clamp(2rem, 4.4vw, 2.9rem); line-height: 1.1; letter-spacing: -.03em; }
body[data-halaman="beranda"] .hero-sub { color: rgba(255, 255, 255, .92); }
.btn-hero, .btn-hero-garis { min-height: 44px; padding: 0 22px; font: inherit; font-weight: 600; border-radius: var(--radius); cursor: pointer; transition: transform .25s var(--ease-pegas), background-color .2s; }
.btn-hero { background: #fff; color: var(--biru-tua); border: 1px solid #fff; }
.btn-hero-garis { background: rgba(255, 255, 255, .12); color: #fff; border: 1px solid rgba(255, 255, 255, .45); }
.btn-hero:active, .btn-hero-garis:active { transform: scale(.97); }
.langkah-bungkus { position: relative; z-index: 2; margin-top: -58px; }
.langkah { display: flex; align-items: center; padding: 18px 24px; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius-kartu); box-shadow: 0 18px 40px -24px rgba(10, 50, 30, .5); }
.langkah-item { display: flex; gap: 12px; align-items: center; flex: none; }
.langkah-item strong { display: block; }
.langkah-item > div span { display: block; font-size: .86rem; color: var(--teks-redup); }
.langkah-ikon { position: relative; flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--kuning); color: var(--biru-tua); display: grid; place-items: center; }
.langkah-no { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--biru-tua); color: #fff; font-size: .68rem; font-weight: 800; line-height: 1; display: grid; place-items: center; border: 2px solid var(--putih); }
/* penghubung: garis tipis dan lingkaran hijau berpanah kuning tebal; animasi 5 detik: 1 ke 2, lalu 2 ke 3 */
.langkah-sambung { flex: 1; min-width: 40px; display: flex; align-items: center; margin: 0 16px; }
.langkah-sambung i { flex: 1; height: 2px; background: #d5e3d9; position: relative; overflow: hidden; }
.langkah-sambung i::after { content: ""; position: absolute; inset: 0; background: var(--kuning); transform: scaleX(0); transform-origin: left; }
.langkah-sambung span { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--biru); color: var(--kuning); display: grid; place-items: center; box-shadow: 0 0 0 4px var(--putih); position: relative; z-index: 1; margin: 0 -1px; overflow: hidden; }
.langkah-sambung svg { stroke-width: 3.2; }
.langkah-sambung.k1 i::after { animation: lgIsiK1 5s ease-in-out infinite; }
.langkah-sambung.k2 i::after { animation: lgIsiK2 5s ease-in-out infinite; }
.langkah-sambung.k1 svg { animation: lgPanahK1 5s cubic-bezier(.5, 0, .2, 1) infinite; }
.langkah-sambung.k2 svg { animation: lgPanahK2 5s cubic-bezier(.5, 0, .2, 1) infinite; }
.langkah-item.n1 .langkah-ikon { animation: lgDenyut1 5s ease-out infinite; }
.langkah-item.n2 .langkah-ikon { animation: lgDenyut2 5s ease-out infinite; }
.langkah-item.n3 .langkah-ikon { animation: lgDenyut3 5s ease-out infinite; }
@keyframes lgPanahK1 { 0% { transform: translateX(0); opacity: .5 } 4% { transform: translateX(0); opacity: 1 } 14% { transform: translateX(22px); opacity: 0 } 14.01% { transform: translateX(-22px); opacity: 0 } 28% { transform: translateX(0); opacity: 1 } 36%, 100% { transform: translateX(0); opacity: .5 } }
@keyframes lgPanahK2 { 0%, 32% { transform: translateX(0); opacity: .5 } 36% { transform: translateX(0); opacity: 1 } 46% { transform: translateX(22px); opacity: 0 } 46.01% { transform: translateX(-22px); opacity: 0 } 60% { transform: translateX(0); opacity: 1 } 68%, 100% { transform: translateX(0); opacity: .5 } }
@keyframes lgPanahV1 { 0% { transform: translateY(0) rotate(90deg); opacity: .5 } 4% { transform: translateY(0) rotate(90deg); opacity: 1 } 14% { transform: translateY(18px) rotate(90deg); opacity: 0 } 14.01% { transform: translateY(-18px) rotate(90deg); opacity: 0 } 28% { transform: translateY(0) rotate(90deg); opacity: 1 } 36%, 100% { transform: translateY(0) rotate(90deg); opacity: .5 } }
@keyframes lgPanahV2 { 0%, 32% { transform: translateY(0) rotate(90deg); opacity: .5 } 36% { transform: translateY(0) rotate(90deg); opacity: 1 } 46% { transform: translateY(18px) rotate(90deg); opacity: 0 } 46.01% { transform: translateY(-18px) rotate(90deg); opacity: 0 } 60% { transform: translateY(0) rotate(90deg); opacity: 1 } 68%, 100% { transform: translateY(0) rotate(90deg); opacity: .5 } }
@keyframes lgIsiK1 { 0% { transform: scaleX(0); opacity: 1 } 30% { transform: scaleX(1) } 90% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
@keyframes lgIsiK2 { 0%, 30% { transform: scaleX(0); opacity: 1 } 62% { transform: scaleX(1) } 90% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
@keyframes lgIsiV1 { 0% { transform: scaleY(0); opacity: 1 } 30% { transform: scaleY(1) } 90% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(1); opacity: 0 } }
@keyframes lgIsiV2 { 0%, 30% { transform: scaleY(0); opacity: 1 } 62% { transform: scaleY(1) } 90% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(1); opacity: 0 } }
@keyframes lgDenyut1 { 0% { box-shadow: 0 0 0 0 rgba(227, 181, 5, .55) } 12% { box-shadow: 0 0 0 9px rgba(227, 181, 5, 0) } 100% { box-shadow: 0 0 0 0 rgba(227, 181, 5, 0) } }
@keyframes lgDenyut2 { 0%, 30% { box-shadow: 0 0 0 0 rgba(227, 181, 5, 0) } 31% { box-shadow: 0 0 0 0 rgba(227, 181, 5, .55) } 44% { box-shadow: 0 0 0 9px rgba(227, 181, 5, 0) } 100% { box-shadow: 0 0 0 0 rgba(227, 181, 5, 0) } }
@keyframes lgDenyut3 { 0%, 62% { box-shadow: 0 0 0 0 rgba(227, 181, 5, 0) } 63% { box-shadow: 0 0 0 0 rgba(227, 181, 5, .55) } 76% { box-shadow: 0 0 0 9px rgba(227, 181, 5, 0) } 100% { box-shadow: 0 0 0 0 rgba(227, 181, 5, 0) } }
@media (prefers-reduced-motion: reduce) { .langkah-sambung i::after, .langkah-sambung svg, .langkah-ikon { animation: none !important; } .langkah-sambung svg { opacity: 1; } }

.ringkas-ujian span:not(.kontainer-ikon) { font-size: .84rem; color: var(--teks-redup); }

.ubin-baris { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.ubin { display: grid; gap: 1px; padding: 10px 12px; border: 1px solid var(--garis); border-radius: 12px; background: var(--putih); min-width: 0; }
.ubin span { font-size: .78rem; font-weight: 600; color: var(--teks-redup); }
.ubin strong { font-size: 1.05rem; overflow-wrap: anywhere; }
.ubin small { font-size: .78rem; color: var(--teks-redup); }
.catatan-pengawas { margin-bottom: 14px; padding: 10px 14px; background: #fbf4df; border-left: 3px solid var(--kuning, #e3b505); border-radius: 0 12px 12px 0; }
.catatan-pengawas p { margin: 2px 0 0; white-space: pre-line; }
.info-dua { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.info-kartu { padding: 14px 16px; border: 1px solid var(--garis); border-radius: 14px; background: var(--putih); }
.info-kartu h3 { margin: 0 0 8px; font-size: .95rem; }
.daftar-info { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .9rem; }
.daftar-info li { margin: 0; padding-left: 2px; }
.daftar-info li::marker { color: var(--biru); font-weight: 700; }
@media (max-width: 700px) { .info-dua { grid-template-columns: 1fr; } .ubin-baris { grid-template-columns: 1fr 1fr; } .ubin-baris .ubin:first-child { grid-column: 1 / -1; } .form-peserta .grid2 { grid-template-columns: 1fr 1fr; } }

.popover { width: 320px; padding: 16px; border-radius: 16px; border-color: var(--garis, #e0e9e2); box-shadow: 0 24px 50px -22px rgba(10, 50, 30, .45); }
.popover-kepala { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.popover-kepala h3 { margin: 0; }
.popover-kepala p { margin: 1px 0 0; }
.popover-kolom { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; margin-bottom: 8px; background: var(--putih); border: 1px solid #cfdcd3; border-radius: var(--radius); color: var(--teks-redup); transition: border-color .2s, box-shadow .2s; }
.popover-kolom:focus-within { border-color: var(--biru); box-shadow: 0 0 0 3px rgba(31, 138, 76, .16); }
.popover-kolom input { flex: 1; min-width: 0; min-height: 38px; border: 0; background: transparent; font: inherit; color: var(--teks); outline: none; }
.popover > .btn { width: 100%; justify-content: center; }
.popover .galat { margin: 0 0 8px; min-height: 0; color: var(--merah); font-size: .84rem; }
.popover .galat:empty { display: none; }

/* halaman ujian: meniru CBT OMI. Latar polos (var(--latar)); permukaan kaca putih tembus pandang. */
body.mode-ujian { min-height: 100dvh; }
body.mode-ujian #app { max-width: 1240px; padding-top: 16px; }
.ujian { display: grid; grid-template-columns: 252px minmax(0, 1fr) 284px; gap: 18px; align-items: start; }
/* backwards, bukan both: transform sisa animasi akan membuat anak position:fixed (laci, tombol bawah) menempel ke induknya. */
.ujian > * { animation: naikMasuk .65s var(--ease-pegas) backwards; }
.ujian > :nth-child(2) { animation-delay: .08s; }
.ujian > :nth-child(3) { animation-delay: .16s; }
.u-panel { background: var(--kaca); border: 1px solid var(--kaca-tepi); border-radius: 18px; box-shadow: var(--bayangan-lembut), inset 0 1px 0 rgba(255, 255, 255, .9); padding: 16px; }
.u-side { position: sticky; top: 14px; display: flex; flex-direction: column; min-height: calc(100dvh - 104px); }
.u-identitas { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, .5); border: 1px solid rgba(255, 255, 255, .85); box-shadow: 0 1px 2px rgba(38, 70, 110, .04), 0 10px 24px -14px rgba(38, 70, 110, .18); }
.u-avatar { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: linear-gradient(145deg, #5fa8dc, var(--biru)); color: #fff; font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; box-shadow: 0 8px 18px -8px rgba(24, 121, 189, .6); }
.u-nama { overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: .01em; line-height: 1.3; font-size: .95rem; }
.u-lencana { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.u-menu { margin-top: auto; display: grid; gap: 4px; padding-top: 20px; }
.u-menu-item { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; font: inherit; font-weight: 600; text-align: left; color: var(--teks-redup); background: transparent; border: 0; border-radius: 12px; cursor: pointer; transition: background-color .25s, color .25s, transform .25s var(--ease-pegas); }
.u-menu-item:hover { background: rgba(255, 255, 255, .7); color: var(--teks); }
.u-menu-item:active { transform: scale(.98); }
.u-menu-item.aktif { background: rgba(24, 121, 189, .12); color: var(--biru-tua); }
.u-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
.u-nav .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 999px; }
.u-nav .btn-utama { box-shadow: 0 12px 22px -12px rgba(24, 121, 189, .7); }
.u-posisi { display: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.u-panel { position: sticky; top: 14px; }
.u-waktu { text-align: center; margin-bottom: 12px; }
.u-waktu-label { display: inline-flex; align-items: center; gap: 8px; color: var(--teks-redup); font-weight: 600; font-size: .9rem; }
.u-timer { font-size: 2.05rem; font-weight: 700; letter-spacing: .01em; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--biru-timer); transition: color .4s; }
.u-timer.mepet { color: var(--merah); animation: kedip 1.4s ease-in-out infinite; }
.u-aksi { display: grid; gap: 8px; margin-bottom: 14px; }
.u-aksi .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border-radius: 12px; background: rgba(255, 255, 255, .85); border-color: var(--kaca-tepi); box-shadow: var(--bayangan-lembut); }
.u-aksi .btn:hover { transform: translateY(-1px); box-shadow: var(--bayangan-angkat); border-color: rgba(24, 121, 189, .35); }
.u-aksi .btn:active { transform: scale(.98); }
.u-aksi .btn-bahaya { background: var(--merah); border-color: var(--merah); box-shadow: 0 14px 24px -14px rgba(211, 32, 43, .75); }
.u-aksi .btn-bahaya:hover { background: #b91d27; border-color: #b91d27; box-shadow: 0 16px 28px -14px rgba(211, 32, 43, .85); }
.u-daftar-kepala { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: .92rem; }
.u-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sel { min-height: 38px; font: inherit; font-size: .92rem; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid var(--garis-lembut); border-radius: 10px; background: rgba(255, 255, 255, .9); color: var(--teks); cursor: pointer; box-shadow: 0 6px 12px -8px rgba(38, 70, 110, .3); transition: transform .3s var(--ease-pegas), background-color .3s, color .3s, border-color .3s, box-shadow .3s var(--ease-pegas); }
.sel:hover { transform: translateY(-2px); box-shadow: var(--bayangan-angkat); }
.sel:active { transform: scale(.95); }
.sel.terjawab { background: var(--biru-muda); color: var(--biru-tua); border-color: rgba(24, 121, 189, .25); }
.sel.baru { animation: terjawabBaru .5s var(--ease-pegas); }
.sel.aktif { border: 2px solid var(--biru); box-shadow: 0 0 0 3px rgba(24, 121, 189, .14); }
.u-laci-tombol, .u-lapis, .u-timer-mobile { display: none; }
.opsi { cursor: pointer; min-height: 44px; position: relative; }
.opsi input { position: absolute; opacity: 0; pointer-events: none; }
.opsi.terpilih { background: #eaf4fc; border-color: var(--biru); }
.opsi.terpilih .opsi-huruf { background: var(--biru); border-color: var(--biru); color: #fff; transform: scale(1.06); }
.opsi:has(input:focus-visible) { outline: 2px solid var(--biru); outline-offset: 3px; }
.gambar-gagal { padding: 12px; margin-bottom: .75em; border: 1px dashed var(--garis); border-radius: 12px; color: var(--teks-redup); }

@keyframes naikMasuk { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes soalMasuk { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes soalMasukMundur { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes pudar { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalMasuk { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toastMasuk { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes terjawabBaru { 0% { transform: scale(.85); } 60% { transform: scale(1.12); } 100% { transform: none; } }
@keyframes kedip { 50% { opacity: .55; } }

@media (max-width: 1180px) { .ujian { grid-template-columns: 224px minmax(0, 1fr) 260px; gap: 14px; } }
@media (max-width: 900px) {
  .ujian { grid-template-columns: 1fr; gap: 10px; padding-bottom: 84px; }
  .u-side { display: none; }
  .u-panel { order: -1; position: sticky; top: 6px; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 16px; }
  .u-waktu { text-align: left; margin: 0; }
  .u-waktu-label { font-size: .78rem; }
  .u-timer { font-size: 1.4rem; }
  .u-laci-tombol { display: inline-flex; align-items: center; gap: 8px; width: auto; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: .9rem; }
  .u-lapis { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(20, 38, 64, .38); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .u-lapis.buka { opacity: 1; pointer-events: auto; }
  .u-laci { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 82dvh; overflow-y: auto; overscroll-behavior: contain; background: #fff; border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -18px 40px -16px rgba(38, 70, 110, .45); transform: translateY(105%); visibility: hidden; transition: transform .45s var(--ease-pegas), visibility 0s .45s; }
  .u-laci.buka { transform: none; visibility: visible; transition: transform .45s var(--ease-pegas); }
  .u-laci::before { content: ""; display: block; width: 40px; height: 4px; margin: -8px auto 12px; border-radius: 3px; background: var(--garis); }
  .u-aksi .btn { min-height: 44px; }
  .sel { min-height: 44px; }
  .u-grid { gap: 8px; }
  .kartu-soal { padding: 18px 14px 14px; border-radius: 16px; }
  .u-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; margin: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, .94); box-shadow: 0 -10px 28px -14px rgba(38, 70, 110, .35); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; }
  .u-nav .btn { justify-content: center; min-height: 46px; padding: 0 10px; font-size: .92rem; min-width: 0; }
  .u-posisi { display: block; white-space: nowrap; font-size: .88rem; color: var(--teks-redup); }
  .u-sembunyi-hp { display: none; }
  .u-waktu-label, .u-laci-tombol { white-space: nowrap; }
  body.mode-ujian #toastRoot { bottom: 80px; }
}

/* ---- penyempurnaan layar ujian: tanpa glow, huruf kecil, pil rata tengah. Skala sudut: kartu 12, kotak dan tombol 8, huruf opsi 6; bulat penuh hanya untuk pil dan tombol navigasi. ---- */
.ujian { --bayangan-lembut: 0 1px 2px rgba(38, 70, 110, .06); --bayangan-angkat: 0 1px 3px rgba(38, 70, 110, .10); }
.ujian .lencana, .ujian .lencana-status, .ujian .instruksi { display: inline-flex; align-items: center; justify-content: center; line-height: 1; white-space: nowrap; }
.ujian .lencana { min-height: 22px; padding: 0 9px; border-radius: 999px; font-size: .68rem; }
.ujian .instruksi { min-height: 28px; padding: 0 13px; margin: 10px 0 9px; font-size: .74rem; background: #fff; border-color: rgba(24, 121, 189, .25); box-shadow: none; }
.ujian .kartu-soal, .ujian .u-panel, .ujian .u-identitas, .ujian .u-logo { border-radius: 12px; box-shadow: none; }
.ujian .kartu-soal { padding: 14px 18px; }
.ujian .kartu-kepala { gap: 7px; }
.ujian .u-nomor { width: 36px; height: 36px; border-radius: 8px; box-shadow: none; }
.ujian .u-nomor small { font-size: .52rem; }
.ujian .u-nomor b { font-size: .95rem; }
.ujian .btn-alat { min-width: 28px; height: 28px; padding: 0 6px; border-radius: 8px; font-size: .68rem; line-height: 1; box-shadow: none; display: inline-flex; align-items: center; justify-content: center; }
.ujian .kartu-badan { font-size: calc(.86rem * var(--skala-huruf, 1)); line-height: 1.6; }
.ujian .opsi-teks, .ujian .isian-siswa { font-size: calc(.84rem * var(--skala-huruf, 1)); }
.ujian .opsi { min-height: 36px; gap: 10px; padding: 5px 11px; margin-bottom: 7px; border-radius: 8px; background: #fff; box-shadow: none; }
.ujian .opsi:hover { transform: none; box-shadow: none; border-color: rgba(24, 121, 189, .4); }
.ujian .opsi:active { transform: none; }
.ujian .opsi.terpilih { background: #eef6fc; }
.ujian .opsi .opsi-huruf { width: 24px; height: 24px; font-size: .74rem; line-height: 1; border-radius: 6px; box-shadow: none; display: inline-flex; align-items: center; justify-content: center; }
.ujian .opsi .opsi-huruf.bulat { border-radius: 6px; }
.ujian .opsi.terpilih .opsi-huruf, .ujian .opsi.terpilih .opsi-tanda { transform: none; }
.ujian .opsi-tanda { width: 18px; height: 18px; }
.ujian .opsi-tanda.kotak { border-radius: 5px; }
.ujian .isian-siswa { min-height: 36px; border-radius: 8px; box-shadow: none; background: #fff; }
.ujian .isian-siswa:focus { border-color: var(--biru); box-shadow: 0 0 0 1px var(--biru); }
.ujian .u-panel { padding: 12px; }
.ujian .u-waktu-label { font-size: .76rem; }
.ujian .u-timer { font-size: 1.5rem; }
.ujian .u-aksi { gap: 6px; margin-bottom: 10px; }
.ujian .u-aksi .btn { min-height: 32px; font-size: .78rem; border-radius: 8px; background: #fff; border-color: #d9e2ec; box-shadow: none; }
.ujian .u-aksi .btn:hover { transform: none; box-shadow: none; border-color: rgba(24, 121, 189, .45); }
.ujian .u-aksi .btn-bahaya, .ujian .u-aksi .btn-bahaya:hover { box-shadow: none; }
.ujian .u-aksi .btn-bahaya { background: var(--merah); border-color: var(--merah); }
.ujian .u-aksi .btn-bahaya:hover { background: #b91d27; border-color: #b91d27; }
.ujian .u-daftar-kepala { font-size: .8rem; }
.ujian .u-grid { gap: 6px; }
.ujian .sel { aspect-ratio: 1 / 1; min-height: 0; width: 100%; padding: 0; font-size: .74rem; border-radius: 8px; background: #fff; box-shadow: none; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.ujian .sel:hover { transform: none; box-shadow: none; border-color: rgba(24, 121, 189, .4); }
.ujian .sel.terjawab { background: var(--biru-muda); }
.ujian .sel.aktif { border-width: 2px; box-shadow: none; }
.ujian .u-nav .btn { min-height: 34px; padding: 0 15px; font-size: .8rem; box-shadow: none; }
.ujian .u-nav .btn-utama { box-shadow: none; }
.ujian .u-identitas { padding: 12px; background: #fff; border-color: var(--garis-lembut); }
.ujian .u-avatar { width: 36px; height: 36px; border-radius: 8px; background: var(--biru); box-shadow: none; font-size: .85rem; margin-bottom: 3px; }
.ujian .u-nama { font-size: .78rem; }
.ujian .u-menu { padding-top: 14px; }
.ujian .u-menu-item { min-height: 34px; font-size: .8rem; border-radius: 8px; }
.ujian .u-logo { padding: 8px 10px; margin-bottom: 10px; }
.ujian .u-logo img { height: 24px; }
.ujian .u-logo img:first-child { height: 30px; }
.ujian .u-logo strong { font-size: .78rem; }
@media (max-width: 900px) {
  .ujian .kartu-soal { padding: 12px 12px 10px; }
  .ujian .u-nav { grid-template-columns: auto 1fr auto; padding-left: 10px; padding-right: 10px; }
  .ujian .u-nav .btn { width: auto; min-width: 0; padding: 0 12px; min-height: 38px; justify-self: start; }
  .ujian .u-nav .btn-utama { justify-self: end; }
  .ujian .u-nav .u-posisi { text-align: center; justify-self: center; }
  .ujian .btn-alat.btn-panah { display: none; }
  .ujian .u-timer { font-size: 1.2rem; }
  .ujian .u-nav .btn { min-height: 40px; font-size: .8rem; }
  .ujian .u-grid { grid-template-columns: repeat(6, 1fr); }
  .ujian .sel { font-size: .8rem; }
  .ujian .u-aksi .btn { min-height: 40px; font-size: .82rem; }
  .ujian .u-laci-tombol { font-size: .8rem; min-height: 40px; border-radius: 8px; }
  .ujian .opsi { min-height: 40px; }
  .ujian .u-panel { padding: 8px 10px 8px 14px; border-radius: 12px; }
}

/* ---- popup di ruang ujian: kecil, datar, selaras layar ujian (biru, sudut 12/8, tanpa glow) ---- */
body[data-halaman="ujian"] .modal-latar { background: rgba(20, 38, 64, .38); }
body[data-halaman="ujian"] .modal { max-width: 420px; border-radius: 12px; border-color: var(--garis-lembut); box-shadow: 0 12px 32px -16px rgba(20, 38, 64, .4); font-size: .84rem; }
body[data-halaman="ujian"] .modal-kepala.dgn-ikon { gap: 10px; padding: 14px 16px 0; }
body[data-halaman="ujian"] .modal-kepala h2 { font-size: .95rem; line-height: 1.25; }
body[data-halaman="ujian"] .modal-sub { font-size: .78rem; }
body[data-halaman="ujian"] .modal-ikon { width: 32px; height: 32px; border-radius: 8px; background: var(--biru-muda); color: var(--biru-tua); }
body[data-halaman="ujian"] .modal-badan { padding: 10px 16px 12px; }
body[data-halaman="ujian"] .modal-kaki { gap: 6px; padding: 10px 16px 12px; border-radius: 0 0 12px 12px; background: #fafbfc; }
body[data-halaman="ujian"] .modal-kaki .btn { min-height: 34px; padding: 0 14px; font-size: .8rem; border-radius: 8px; box-shadow: none; }
body[data-halaman="ujian"] .modal-kaki .btn-teks { color: var(--teks-redup); }
.modal-teks { margin: 8px 0 0; font-size: .82rem; line-height: 1.55; color: var(--teks-redup); }
.bantuan-daftar { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.bantuan-daftar li { display: flex; gap: 10px; align-items: flex-start; font-size: .82rem; line-height: 1.5; color: var(--teks); }
.bantuan-no { flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--biru-muda); color: var(--biru-tua); font-size: .7rem; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.ubin-kecil-baris { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.ubin-kecil { display: grid; gap: 1px; padding: 8px 12px; border: 1px solid var(--garis-lembut); border-radius: 8px; background: #fff; }
.ubin-kecil span { font-size: .72rem; font-weight: 600; color: var(--teks-redup); }
.ubin-kecil strong { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.ubin-kecil.peringatan { background: #fdf6e3; border-color: #ecd9a0; }
.ubin-kecil.peringatan strong { color: #8a6100; }
.belum-kotak { margin-top: 10px; padding: 8px 10px; border: 1px solid var(--garis-lembut); border-radius: 8px; background: #fafbfc; }
.belum-kotak p { margin: 0 0 6px; font-size: .76rem; font-weight: 600; color: var(--teks-redup); }
.belum-nomor { display: flex; flex-wrap: wrap; gap: 4px; max-height: 96px; overflow-y: auto; }
.belum-nomor span { width: 26px; height: 26px; border: 1px solid var(--garis-lembut); border-radius: 6px; background: #fff; font-size: .7rem; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }

.popover-kolom input, .popover-baris input { font-size: .86rem; }

.editor-area { font-size: .86rem; line-height: 1.55; }
html.adm-aktif .field input, html.adm-aktif .field select, html.adm-aktif .field textarea { font-size: .9rem; }
html.adm-aktif .editor-area, html.adm-aktif .modal-editor .editor-area { font-size: .9rem; }
html.adm-aktif .popover-kolom input { font-size: .9rem; }

html.adm-aktif textarea, html.adm-aktif .adm-import textarea { font-size: .86rem; }

/* tabel di isi soal (editor, pratinjau, siswa): garis tipis dan judul tebal; teks panjang dalam sel dipatahkan agar tabel tidak melebihi lebar kartu */
.blok-teks table, .editor-area table, .kartu-badan table, .opsi-teks table { max-width: 100%; border-collapse: collapse; margin: .5em 0; font-size: .95em; }
.blok-teks th, .blok-teks td, .editor-area th, .editor-area td, .kartu-badan th, .kartu-badan td { border: 1px solid #c9d3cc; padding: 4px 9px; text-align: left; vertical-align: top; min-width: 34px; line-height: 1.45; overflow-wrap: anywhere; }
.blok-teks th, .editor-area th, .kartu-badan th { background: #f1f5f2; font-weight: 700; }
.editor-area td:empty, .editor-area th:empty { height: 1.6em; }
table.rata-tengah { margin-left: auto; margin-right: auto; }
table.rata-kanan { margin-left: auto; margin-right: 0; }
table.rata-penuh { width: 100%; }
.tb-tabel .adm-seg { margin-left: auto; }
.tb-tabel { gap: 4px; padding-top: 5px; padding-bottom: 5px; border-top: 1px dashed var(--garis); flex-wrap: wrap; }
.tb-tabel[hidden] { display: none; }
.tb-tabel-label { display: inline-flex; align-items: center; gap: 5px; margin-right: 4px; font-size: .78rem; font-weight: 700; color: var(--teks-redup); }
.tb-tabel .btn-kecil { padding: 0 8px; font-size: .78rem; }
.panel-tabel { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--garis); background: #f9fbf9; }
.panel-tabel[hidden] { display: none; }
.panel-tabel label { display: grid; gap: 2px; font-size: .78rem; font-weight: 600; color: var(--teks-redup); }
.panel-tabel .tbl-angka { width: 64px; min-height: 30px; padding: 0 8px; border: 1px solid var(--garis); border-radius: 8px; font: inherit; font-size: .86rem; }
.panel-tabel .tbl-cek { display: inline-flex; align-items: center; gap: 6px; padding-bottom: 6px; }
.panel-tabel .galat { flex-basis: 100%; margin: 0; }

/* indikator muat */
#bilahMuat { position: fixed; left: 0; right: 0; top: 0; height: 3px; z-index: 80; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .25s; }
#bilahMuat.aktif { opacity: 1; }
#bilahMuat i { display: block; height: 100%; width: 38%; border-radius: 3px; background: var(--biru); animation: geserBilah 1.15s var(--ease-pegas) infinite; }
.muat { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 14vh 16px; animation: pudar .3s ease-out both; }
.muat-cincin { position: relative; width: 84px; height: 84px; display: grid; place-items: center; margin-bottom: 14px; }
.muat-cincin b { width: 14px; height: 14px; border-radius: 50%; background: var(--biru); animation: titik 1.4s ease-in-out infinite; }
@keyframes titik { 50% { transform: scale(1.6); opacity: .6; } }
.muat-cincin i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--biru); animation: putar 1.1s linear infinite; }
.muat-cincin i + i { inset: 10px; border-top-color: transparent; border-bottom-color: rgba(24, 121, 189, .5); animation-duration: 1.7s; animation-direction: reverse; }
.muat-cincin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(24, 121, 189, .25); animation: riak 2s ease-out infinite; }
.muat h2 { margin: 0; font-size: 1.12rem; }
.muat-langkah { margin: 0; min-height: 1.5em; color: var(--teks-redup); }
.muat-langkah.ganti { animation: naikMasuk .45s var(--ease-pegas) both; }
.btn.sibuk { position: relative; color: transparent !important; pointer-events: none; }
.btn.sibuk::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff; border-radius: 50%; animation: putar .7s linear infinite; }
.btn:not(.btn-utama):not(.btn-bahaya).sibuk::after { border-color: rgba(18, 93, 147, .22); border-top-color: var(--biru-tua); }

/* popover login admin */
.popover { position: fixed; z-index: 70; width: 300px; padding: 14px; background: var(--putih); border: 1px solid var(--garis); border-radius: 14px; box-shadow: var(--bayangan-angkat); transform-origin: top right; animation: popoverMasuk .3s var(--ease-pegas) both; }
.popover h3 { margin: 0 0 2px; font-size: .98rem; }
.popover p { margin: 0 0 10px; font-size: .86rem; color: var(--teks-redup); }
.popover-baris { display: flex; gap: 8px; }
.popover-baris input { flex: 1; min-width: 0; min-height: 38px; padding: 0 12px; font: inherit; border: 1px solid var(--garis); border-radius: var(--radius); background: var(--putih); }
.popover-baris input:focus { border-color: var(--biru); box-shadow: 0 0 0 3px rgba(24, 121, 189, .14); outline: none; }
.popover-galat { min-height: 1.2em; margin-top: 6px; color: var(--merah); font-size: .84rem; }
.popover.goyang { animation: goyang .35s; }
@media (max-width: 600px) { .popover { left: 12px; right: 12px; width: auto; } }

@keyframes putar { to { transform: rotate(360deg); } }
@keyframes riak { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
@keyframes geserBilah { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
@keyframes denyut { 50% { opacity: .5; } }
@keyframes popoverMasuk { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes goyang { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

/* toast */
#toastRoot { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 24px); max-width: 420px; pointer-events: none; }
.toast { pointer-events: auto; padding: 9px 14px; border-radius: var(--radius); background: var(--teks); color: var(--putih); font-size: .88rem; animation: toastMasuk .4s var(--ease-pegas) both; }
.toast-galat { background: var(--merah); }

/* lencana dan kerangka memuat */
.lencana { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--biru-muda); color: var(--biru-tua); font-size: .76rem; font-weight: 600; }
.kerangka { height: 14px; border-radius: 6px; background: var(--garis); margin-bottom: 10px; animation: denyut 1.4s ease-in-out infinite; }
.kerangka.pendek { width: 40%; }
.kerangka.sedang { width: 70%; }
.kerangka.tebal { height: 20px; }

/* isi soal */
.blok-teks { margin-bottom: .75em; overflow-wrap: anywhere; }
.blok-gambar { display: block; max-width: 100%; height: auto; object-fit: contain; margin: 0 0 .75em; }
/* ukuran gambar yang dipilih admin: lebar tetap selama muat, mengecil bila layar sempit */
.blok-gambar.ukuran-kecil { width: min(100%, 200px); }
.blok-gambar.ukuran-sedang { width: min(100%, 360px); }
.blok-gambar.ukuran-besar { width: min(100%, 540px); }
.blok-gambar.ukuran-penuh { width: 100%; }
/* posisi gambar: kiri (bawaan), tengah, kanan, atau penuh (direntangkan selebar kartu, seperti justify) */
.blok-gambar.posisi-tengah { margin-left: auto; margin-right: auto; }
.blok-gambar.posisi-kanan { margin-left: auto; margin-right: 0; }
.blok-gambar.posisi-penuh { width: 100%; }
.adm-seg-ikon button { display: inline-grid; place-items: center; min-width: 30px; }
.baris-ukuran { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; font-size: .82rem; }
.ar { font-family: "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif; font-size: 1.25em; line-height: 2; direction: rtl; unicode-bidi: isolate; }
.ar-blok { text-align: right; direction: rtl; }

@media (pointer: coarse) {
  .btn, .tab, .btn-tb, .btn-kecil, .tabel .btn, .bagian-kepala select, .field input, .field select, .field textarea { min-height: 44px; }
  .btn-tb { min-width: 44px; }
}
/* iPhone: 16 px mencegah Safari memperbesar halaman saat kolom difokus. iPad dan tablet memakai ukuran rancangan (kecil); zoom-saat-fokus dicegah lewat maximum-scale di meta viewport (Code.gs). */
@supports (-webkit-touch-callout: none) {
  @media (pointer: coarse) and (max-width: 600px) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea, .editor-area { font-size: 16px !important; }
  }
}
input, select, textarea, [contenteditable="true"] { scroll-margin-block: 96px; }
@media (max-width: 900px) { body.kbd-aktif .u-nav, body.kbd-fokus .u-nav { display: none; } body.kbd-aktif .ujian { padding-bottom: 24px; } }
/* keyboard layar: ukuran dan posisi popup tetap (tingginya dikunci saat kolom difokus); isi popup digulir ke atas sampai baris yang diisi berada di atas keyboard.
   Bila isi sudah di ujung gulir, ditambah ruang kosong yang hanya sebesar kekurangannya (--ekstra, diatur skrip; berupa isi yang dapat digulir, bukan padding, agar footer tidak
   terdorong keluar). Halaman biasa diperlakukan sama lewat --ekstra-halaman. Mengetuk bagian lain mengembalikan semuanya. */
body.kbd-fokus { padding-bottom: var(--ekstra-halaman, 0px); }
body.kbd-fokus .modal-badan::after { content: ""; display: block; height: var(--ekstra, 0px); flex: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* hasil */
.hasil { max-width: 860px; margin: 0 auto; background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius-kartu); padding: 22px; }
.hasil h1 { margin: 2px 0 0; font-size: 1.4rem; }
.hasil-selesai { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; padding: 10px 14px; border-radius: var(--radius); background: #e6f4ea; color: var(--hijau); font-weight: 600; }
.hasil-judul { margin: 18px 0 8px; font-size: 1rem; }
.hasil-kop { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 2px solid var(--biru); }
.hasil-logo { display: flex; gap: 8px; }

.hasil-identitas { margin: 0; display: grid; gap: 4px; }
.hasil-baris { display: grid; grid-template-columns: 112px 1fr; gap: 8px; }

.hasil-maks { font-size: 1.3rem; font-weight: 600; letter-spacing: 0; color: var(--teks-redup); margin-left: 2px; }

.hasil-angka > div { padding: 10px 16px; border-left: 1px solid var(--garis); }

.hasil-kaki { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--garis); font-size: .8rem; color: var(--teks-redup); }
/* HP: susunan sama dengan desktop, hanya diperkecil (nilai tetap di kanan, empat angka tetap sebaris). */
@media (max-width: 600px) {
  .hasil:not(.hasil-pdf) { padding: 12px; font-size: .78rem; }

  .hasil:not(.hasil-pdf) .hasil-skor { font-size: 2.1rem; }

  .hasil:not(.hasil-pdf) .hasil-selesai { padding: 8px 10px; }
}
.tabel-gulir { overflow-x: auto; }
.hasil-tabel td { overflow-wrap: anywhere; }
.hasil-tabel tr { page-break-inside: avoid; }
.hasil-pdf .hasil-tabel { margin-top: 16px; font-size: .92rem; }
.hasil-pdf .hasil-tabel th, .hasil-pdf .hasil-tabel td { padding: 6px 8px; }
.hasil-pdf .hasil-tabel .pisah { border-left: 1px solid var(--garis); }
.status-benar { color: var(--hijau); font-weight: 600; }
.status-salah { color: var(--merah); font-weight: 600; }
.status-kosong { color: var(--teks-redup); font-weight: 600; }
.hasil-aksi { max-width: 760px; margin: 16px auto 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
/* html2pdf memusatkan wadahnya (margin: auto); selisih lebar jendela asli dan jendela tangkapan membuat hasil bergeser dan terpotong di HP */
.html2pdf__container { margin: 0 !important; }
.pdf-gudang { position: fixed; left: -10000px; top: 0; width: 190mm; background: #ffffff; color: #1c2733; }

@media print {
  body { background: #fff; }
  .header, .footer, .no-print, .no-pdf, #toastRoot, #modalRoot { display: none !important; }

}

#cetakAdmin { display: none; }

/* ---- panel admin: sidebar kiri, tabel padat. Ukuran dasar 13 px agar banyak data muat di layar. ---- */

.adm { display: grid; grid-template-columns: 188px minmax(0, 1fr); min-height: 100vh; }

.adm-nav { position: relative; }
.adm-nav-btn { position: relative; z-index: 1; }

.adm-nav-btn em { margin-left: auto; font-style: normal; font-size: .78rem; padding: 0 7px; border-radius: 99px; background: var(--latar); color: var(--teks-redup); }

/* editor soal: dua kolom (formulir dan pratinjau langsung) */

.ed2-kiri { display: grid; gap: 10px; align-content: start; min-width: 0; padding: 14px 18px 18px; grid-auto-rows: max-content; }
